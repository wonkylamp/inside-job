<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Inside Job — look sample</title>
<!--
  Stage 4B part A: look sample (docs/STAGE4B.md). Standalone, opened from file://.
  No libraries, no fonts, no images: characters and sets are SVG built in code below.
  URL parameters:
    ?frame=sheet|table|speaker|diary|whisper|job|vote|finale|end   (default sheet)
    &layout=wide|tall        canvas 1920x1080 or 1080x1920
    &t=end|<ms>              jump the frame's animation to that moment and hold
    &variant=...             speaker/diary: long (longest real text in games/); job: clean|blown
    &view=audience|table     whisper: what the table sees
    &clean=1                 hide the toolbar (for screenshots / recording)
    &part=hero|expr|small&from=0&n=20   sheet: one section, rows from..from+n
    &rm=1                    act as if prefers-reduced-motion is set
-->
<style>
:root {
  --bg: #0a2141;
  --bg-deep: #061529;
  --ink: #17122b;
  --line: #dcefff;
  --dim: #8db1d8;
  --faint: #4f77a3;
  --cyan: #5fd8ff;
  --amber: #ffb22e;
  --amber-deep: #e07a00;
  --mint: #43e4ad;
  --paper: #f3ead6;
  --paper-ink: #2a2238;
  --display: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --stamp: Impact, "Haettenschweiler", "Arial Black", "Avenir Next Condensed", sans-serif;
  --body: "Avenir Next", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --bar-h: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #02070f; color: var(--line); font-family: var(--body); }
body.stagemode { overflow: hidden; height: 100%; }
button { font-family: var(--mono); }

/* ------------------------------------------------------------ toolbar */
#bar {
  position: fixed; left: 0; right: 0; top: 0; height: var(--bar-h); z-index: 50;
  display: flex; align-items: center; gap: 6px; padding: 0 12px;
  background: #050f1e; border-bottom: 1px solid #1d3558; font-family: var(--mono); font-size: 13px;
  overflow-x: auto; white-space: nowrap;
}
#bar .brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .18em; margin-right: 10px; }
#bar .brand b { color: var(--amber); }
#bar button {
  background: #0c1d36; color: var(--dim); border: 1px solid #22416b; border-radius: 6px;
  padding: 6px 10px; cursor: pointer; font-size: 13px;
}
#bar button:hover { color: var(--line); border-color: #3a6aa5; }
#bar button.on { background: #163a66; color: #fff; border-color: var(--cyan); }
#bar .sep { width: 1px; height: 26px; background: #22416b; margin: 0 6px; }
body.clean #bar { display: none; }

/* ------------------------------------------------------------ stage */
#vp { position: fixed; left: 0; right: 0; top: var(--bar-h); bottom: 0; overflow: hidden; display: none; }
body.clean #vp { top: 0; }
body.stagemode #vp { display: block; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg-deep); }
#stage.wide { width: 1920px; height: 1080px; }
#stage.tall { width: 1080px; height: 1920px; }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.abs { position: absolute; }
.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.anim { will-change: transform, opacity; }

/* ------------------------------------------------------------ characters */
.ch { position: absolute; }
.ch > .breath { position: absolute; inset: 0; animation: breathe 3.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.ch svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes breathe { from { transform: translateY(0) scaleY(1); } to { transform: translateY(-0.6%) scaleY(1.008); } }
.ch.flip > .breath > svg { transform: scaleX(-1); }
.ch svg .m { display: none; }
.ch svg[data-m="rest"] .m-rest, .ch svg[data-m="a"] .m-a, .ch svg[data-m="b"] .m-b, .ch svg[data-m="c"] .m-c { display: inline; }
.ch svg .eyes-c { display: none; }
.ch svg.blink .eyes-c { display: inline; }
.ch svg.blink .eyes-o { display: none; }
.ch.out svg { filter: grayscale(1) brightness(.62) contrast(.95); }
@media (prefers-reduced-motion: reduce) { .ch > .breath { animation: none; } }
body.rm .ch > .breath { animation: none; }

/* ------------------------------------------------------------ shared stage pieces */
.hud { position: absolute; font-family: var(--mono); color: var(--dim); letter-spacing: .14em; font-size: 20px; white-space: nowrap; }
.logo { font-family: var(--display); font-weight: 800; letter-spacing: .26em; color: var(--line); }
.logo b { color: var(--amber); font-weight: 800; }
.chip {
  display: inline-block; font-family: var(--mono); font-weight: 700; letter-spacing: .14em;
  padding: 4px 12px 3px; border-radius: 4px; white-space: nowrap;
}
.chip.mole { background: var(--amber); color: #2a1600; }
.chip.crew { background: var(--mint); color: #022a1d; }
.chip.ghost { border: 2px solid currentColor; }
.plate-name { font-family: var(--display); font-weight: 800; letter-spacing: .04em; line-height: .9; text-transform: uppercase; }
.model { font-family: var(--mono); color: var(--line); letter-spacing: .06em; }
.txtbox { position: absolute; overflow: hidden; }
.txtbox .t { position: relative; }
.typed .rest { color: transparent; }
.typed .rest mark, .typed .rest .lie { color: transparent; background: none; box-shadow: none; }
.lie { background: rgba(255,178,46,.18); box-shadow: inset 0 -4px 0 var(--amber); color: #fff3dc; }
.stamp {
  position: absolute; font-family: var(--stamp); text-transform: uppercase; letter-spacing: .04em;
  line-height: 1; padding: .12em .32em .08em; border: .09em solid currentColor; border-radius: .12em;
  white-space: nowrap; text-align: center;
}
.stamp.amber { color: var(--amber); background: rgba(40,18,0,.42); box-shadow: 0 0 0 .04em rgba(0,0,0,.4), 0 .1em .5em rgba(0,0,0,.5); }
.stamp.mint { color: var(--mint); background: rgba(0,32,22,.55); box-shadow: 0 .1em .5em rgba(0,0,0,.5); }
.stamp.solid-amber { color: #2b1500; background: var(--amber); border-color: var(--amber); }
.stamp.solid-mint { color: #00261a; background: var(--mint); border-color: var(--mint); }
.card {
  position: absolute; border-radius: 14px; background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.45);
}
.flip3 { transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: inherit; backface-visibility: hidden; }

/* ------------------------------------------------------------ scene pieces */
.anc { pointer-events: none; }
.anc .ctr { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
.hudbar .hudph { font-family: var(--mono); color: var(--dim); letter-spacing: .2em; margin-top: 6px; }
.hudph span { color: var(--cyan); margin-left: 14px; }
.viewtag { font-family: var(--mono); font-size: 16px; letter-spacing: .2em; color: var(--dim); border: 1.5px solid rgba(141,177,216,.5); border-radius: 4px; padding: 6px 12px; }
.flash, .iris, .alarmtint, .dimmer { position: absolute; }
.iris { background: #000; }
.alarmtint { background: radial-gradient(ellipse at 50% 50%, rgba(255,60,20,.0) 30%, rgba(255,60,20,.9) 100%); }
.dimmer { background: rgba(2,6,14,.62); }

/* table */
.board { background: #3a2a1c; border: 6px solid #1a120b; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.45);
  background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px); background-size: 9px 9px; }
.board-h { position: absolute; left: 20px; top: 14px; right: 20px; font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .14em; color: #f3ead6; }
.board-h span { float: right; font-family: var(--mono); font-size: 16px; letter-spacing: .1em; margin-top: 12px; color: #d8c8a8; }
.slot { border-radius: 6px; }
.slot.empty { border: 3px dashed rgba(243,234,214,.28); }
.slot-e { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 15px; letter-spacing: .12em; color: rgba(243,234,214,.35); }
.slot.clean, .slot.blown { background: var(--paper); box-shadow: 0 6px 0 rgba(0,0,0,.3); transform: rotate(-2deg); }
.slot-r { position: absolute; left: 12px; top: 8px; font-family: var(--mono); font-size: 14px; color: #6a5f50; }
.slot-n { position: absolute; left: 12px; right: 10px; top: 30px; font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; color: var(--paper-ink); }
.slot-st { position: absolute; right: 8px; bottom: 8px; font-family: var(--stamp); font-size: 26px; padding: 0 6px; border: 3px solid currentColor; border-radius: 4px; transform: rotate(-8deg); }
.slot.clean .slot-st { color: #0f9c6c; }
.slot.blown .slot-st { color: var(--amber-deep); }
.pin { position: absolute; left: 50%; top: -9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a7a, #b3241a); box-shadow: 0 3px 4px rgba(0,0,0,.5); z-index: 2; }
.jobcard { background: var(--paper); border-radius: 8px; padding: 22px 26px; color: var(--paper-ink); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
.jc-k { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; color: #7a6f60; }
.jc-n { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; margin: 8px 0 12px; text-transform: uppercase; }
.jc-t { font-family: var(--mono); font-size: 16px; letter-spacing: .08em; color: #5a5040; }
.jc-t b { text-shadow: 0 0 0 #000, 1px 1px 0 rgba(0,0,0,.35); -webkit-text-stroke: .6px rgba(0,0,0,.45); }
.plate { position: relative; text-align: center; font-family: var(--display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ac);
  background: linear-gradient(#162a49, #0b1a31); border: 3px solid #04070e; border-top: 4px solid var(--ac); border-radius: 6px; padding: 6px 8px 4px; line-height: 1; box-shadow: 0 8px 0 #050a14, 0 14px 22px rgba(0,0,0,.5); }
.plate.out { color: #6d7d92; border-top-color: #6d7d92; }
.plate-out { font-family: var(--mono); font-size: .5em; letter-spacing: .12em; color: #8da0b8; margin-top: 4px; }
.plate-out b { color: #2a1600; background: var(--amber); padding: 1px 6px; border-radius: 3px; }
.plate-m { font-family: var(--mono); font-weight: 400; font-size: .5em; letter-spacing: .04em; color: var(--line); margin-top: 6px; text-transform: none; }
.leadbadge { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-weight: 800; letter-spacing: .12em; color: #2b1d00; background: linear-gradient(#ffe08a, #e0a93a); border: 2.5px solid #3a2600; border-radius: 30px; padding: 3px 12px 3px 5px; box-shadow: 0 5px 12px rgba(0,0,0,.5); white-space: nowrap; }
.jobtag { font-family: var(--mono); font-weight: 800; letter-spacing: .14em; color: #00121f; background: var(--cyan); border: 2.5px solid #00121f; border-radius: 4px; padding: 3px 9px; transform: rotate(6deg); box-shadow: 0 5px 12px rgba(0,0,0,.5); white-space: nowrap; }
.potbag { position: relative; width: 200px; height: 190px; }
.pot-tag { position: absolute; right: -34px; top: 34px; transform: rotate(10deg); background: var(--paper); color: var(--paper-ink); border: 3px solid #120b04; border-radius: 6px; padding: 4px 12px; font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-align: center; box-shadow: 0 6px 12px rgba(0,0,0,.4); }
.pot-tag b { display: block; font-family: var(--display); font-size: 40px; line-height: .95; letter-spacing: 0; }
.caption { background: rgba(4,12,26,.9); border: 3px solid #04070e; border-left: 12px solid var(--ac); border-radius: 12px; padding: 14px 26px; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
.cap-h { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
.cap-n { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .06em; text-transform: uppercase; }
.cap-id { font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--dim); }
.cap-t { font-weight: 600; line-height: 1.32; color: #f2f7ff; overflow: hidden; }

/* speaker */
.dlg { background: linear-gradient(rgba(6,16,34,.94), rgba(3,9,20,.97)); border: 4px solid #04070e; outline: 3px solid var(--ac); outline-offset: -10px; border-radius: 18px; padding: 44px 46px 30px; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
.dlg-t { position: absolute; left: 46px; right: 46px; top: 40px; bottom: 30px; font-weight: 600; line-height: 1.34; color: #f4f8ff; overflow: hidden; }
.nametab { display: flex; align-items: center; gap: 18px; background: var(--ac); border: 4px solid #04070e; border-radius: 12px; padding: 4px 22px 4px 26px; box-shadow: 0 10px 0 rgba(0,0,0,.35); transform-origin: 0 100%; white-space: nowrap; }
.nt-name { font-family: var(--display); font-weight: 800; color: #0a0612; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.nt-model { font-family: var(--mono); color: #0a0612; background: rgba(255,255,255,.55); padding: 4px 10px; border-radius: 6px; letter-spacing: .04em; }
.nametab .chip { border: 3px solid #04070e; }
.idrow { display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
.sid { font-family: var(--mono); font-size: 20px; letter-spacing: .14em; color: var(--line); background: #0b1c36; border: 2px solid #2b4a75; padding: 4px 10px; border-radius: 5px; }
.callout { font-family: var(--mono); font-size: 18px; letter-spacing: .12em; color: var(--cyan); border: 2px solid var(--cyan); padding: 4px 10px; border-radius: 5px; background: rgba(0,0,0,.4); }
.accframe { background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--ac) 45%, #0a1a33), #071224); border: 5px solid #04070e; outline: 4px solid var(--ac); outline-offset: -12px; border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.6); transform-origin: 50% 50%; }
.accin { position: absolute; left: 4%; right: 4%; top: 6%; bottom: 0; }
.acclabel { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: .14em; color: #fff; background: rgba(4,8,16,.9); padding: 8px 0 9px; }
.acclabel b { font-family: var(--display); font-size: 30px; letter-spacing: .06em; text-transform: uppercase; }
.cluecard { background: var(--paper); border: 4px solid #1a1206; border-radius: 14px; box-shadow: 0 14px 0 rgba(0,0,0,.3), 0 24px 50px rgba(0,0,0,.55); padding: 20px 24px; color: var(--paper-ink); }
.cc-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #2a2238; padding-bottom: 8px; }
.cc-h span:first-child { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .12em; }
.cc-by { font-family: var(--mono); font-size: 15px; color: #6a6070; }
.cc-t { font-family: var(--serif); font-size: 36px; line-height: 1.18; margin-top: 18px; }
.cc-f { position: absolute; left: 24px; bottom: 14px; font-family: var(--mono); font-size: 15px; color: #8a8090; letter-spacing: .1em; }
.stamp.big { border-width: .07em; }
.ctr > .stamp { position: relative; display: inline-block; }
.plate.onjob { border-bottom: 0; padding-bottom: 0; }
.plate-job { margin: 5px -8px 0; background: var(--cyan); color: #00121f; font-family: var(--mono); font-weight: 800; font-size: .48em; letter-spacing: .2em; padding: 3px 0 2px; border-radius: 0 0 3px 3px; }
.diarysign { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .34em; color: var(--cyan); text-shadow: 0 0 18px rgba(95,216,255,.8), 0 0 2px #fff; }
.cc-port { overflow: hidden; }
.cc-pay small { display: block; font-family: var(--mono); font-weight: 400; font-size: 13px; letter-spacing: .2em; color: #51627e; margin-bottom: 2px; }

/* diary */
.rec { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-weight: 800; font-size: 26px; letter-spacing: .16em; color: #fff; }
.rec i { width: 22px; height: 22px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 18px #ff3b3b; }
.rec.dim i { opacity: .25; box-shadow: none; }
.rec span { margin-left: 18px; font-family: var(--display); font-size: 30px; letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 16px rgba(95,216,255,.8); }
.tc { font-family: var(--mono); font-size: 18px; letter-spacing: .1em; color: rgba(220,239,255,.7); }
.thought { background: rgba(8,12,24,.86); border: 3px solid rgba(255,255,255,.12); border-top: 8px solid var(--ac); border-radius: 16px; padding: 22px 34px; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
.th-h { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; white-space: nowrap; }
.th-n { font-family: var(--display); font-weight: 800; font-size: 46px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.th-m { font-family: var(--mono); font-size: 19px; color: var(--line); }
.th-k { margin-left: auto; font-family: var(--mono); font-size: 15px; letter-spacing: .16em; color: var(--dim); }
.th-t { margin-top: 16px; font-family: var(--serif); font-style: italic; line-height: 1.38; color: #f6efe2; overflow: hidden; }
.polaroid { background: #f4efe4; padding: 14px 14px 0; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.6); transform-origin: 50% 0; }
.pol-in { position: relative; width: 100%; aspect-ratio: 1 / 1; background: radial-gradient(ellipse at 50% 35%, #31507e, #0e1c33); overflow: hidden; }
.pol-in .ch { left: 0; right: 0; top: 4%; bottom: 0; height: 110%; }
.pol-n { font-family: var(--display); font-weight: 800; font-size: 38px; text-align: center; letter-spacing: .06em; text-transform: uppercase; padding: 8px 0 10px; }
.pct-k { font-family: var(--mono); font-size: 17px; letter-spacing: .16em; color: var(--dim); }
.pct-v { font-family: var(--display); font-weight: 800; font-size: 120px; line-height: .9; color: #fff; }
.pct-bar { height: 12px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; margin: 8px 0; width: 260px; }
.pct-bar i { display: block; height: 100%; background: var(--amber); transform-origin: 0 50%; transform: scaleX(0); }
.pct-n { font-family: var(--mono); font-size: 18px; color: var(--dim); }
.pct-n b { font-family: var(--display); font-size: 28px; text-transform: uppercase; letter-spacing: .06em; }
.mark { display: flex; flex-direction: column; justify-content: center; background: rgba(40,20,0,.82); border: 3px solid var(--amber); border-radius: 10px; padding: 8px 18px; transform-origin: 0 50%; }
.mark b { font-family: var(--stamp); font-weight: 400; font-size: 34px; color: var(--amber); letter-spacing: .06em; line-height: 1; }
.mark span { font-family: var(--body); font-weight: 600; font-size: 20px; color: #ffe8c2; margin-top: 4px; line-height: 1.2; }

/* whisper */
.whead { text-align: center; }
.wh-k { font-family: var(--mono); font-size: 20px; letter-spacing: .3em; color: var(--dim); display: inline-flex; gap: 10px; align-items: center; }
.wh-n { font-family: var(--display); font-weight: 800; font-size: 60px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
.wh-n em { font-style: normal; color: var(--dim); margin: 0 18px; }
.wcol { display: flex; flex-direction: column; justify-content: flex-start; gap: .55em; overflow: hidden; }
.wb { position: relative; max-width: 88%; background: rgba(6,10,22,.96); border: 3px dashed var(--ac); border-radius: 20px; padding: .45em .8em .55em; box-shadow: 0 14px 30px rgba(0,0,0,.55); }
.wb.l { align-self: flex-start; border-bottom-left-radius: 4px; }
.wb.r { align-self: flex-end; border-bottom-right-radius: 4px; }
.wb-n { font-family: var(--display); font-weight: 800; font-size: .8em; letter-spacing: .1em; text-transform: uppercase; }
.wb-t { font-style: italic; font-weight: 500; line-height: 1.3; color: #e9eefc; }
.wdots { display: inline-flex; gap: .35em; vertical-align: middle; padding: .3em 0; }
.wdots i { width: .55em; height: .55em; border-radius: 50%; background: #5a6a8a; animation: wdot 1.2s ease-in-out infinite; }
.wdots i:nth-child(2) { animation-delay: .2s; } .wdots i:nth-child(3) { animation-delay: .4s; }
@keyframes wdot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.25em); opacity: 1; } }
body.rm .wdots i { animation: none; }
.wpriv { margin-left: .8em; font-family: var(--mono); font-style: normal; font-size: .6em; letter-spacing: .2em; color: #5a6a8a; text-transform: uppercase; }
.wfoot { text-align: center; font-family: var(--mono); font-size: 18px; letter-spacing: .12em; color: var(--dim); }
.wfoot b { color: var(--line); }

/* cards */
.cardwrap { transform-origin: 50% 50%; }
.flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; overflow: hidden; }
.face.back { transform: rotateY(180deg); }

function jobBoard(parent, x, y, w, h, D) {
  const board = box(parent, x, y, w, h, 'board anim');
  board.innerHTML = `<div class="board-h">JOBS <span>CLEAN ${D.clean}/${D.cleanTarget} · BLOWN ${D.blown}/${D.blownTarget}</span></div>`;
  const slotW = (w - 70) / 3, slotH = (h - 110) / 2, slots = [];

    const job = (row ? blownJobs : cleanJobs)[i];
    const sl = box(board, 20 + i * (slotW + 15), 64 + row * (slotH + 14), slotW, slotH, 'slot ' + (job ? (row ? 'blown' : 'clean') : 'empty') + ' anim');

  // darker set: acoustic foam wall, one bare bulb, a chair
  let foam = ''; const tile = 90;
  for (let y = 0; y < H; y += tile) for (let x = 0; x < W; x += tile) { const k = ((x / tile + y / tile) % 2); foam += `<path d="M${x} ${y}h${tile}v${tile}h-${tile}z" fill="${k ? '#0b1322' : '#0d1729'}"/><path d="M${x + (k ? 0 : tile / 2)} ${y + (k ? tile / 2 : 0)}${k ? `h${tile}` : `v${tile}`}" stroke="#060b14" stroke-width="3"/>`; }
  const bulbY = L.wide ? 90 : 120;
  svgEl(cam, W, H, `<defs><radialGradient id="dlight" cx="${lx / W * 100}%" cy="${(L.wide ? 52 : 30)}%" r="${L.wide ? 42 : 46}%"><stop offset="0" stop-color="#3b4f73" stop-opacity=".95"/><stop offset=".55" stop-color="#1a2740" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="dcone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeaff" stop-opacity=".26"/><stop offset="1" stop-color="#dfeaff" stop-opacity="0"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="#03060c"/><g opacity=".9">${foam}</g><rect width="${W}" height="${H}" fill="url(#dlight)"/>
    <rect width="${W}" height="${H}" fill="#000" opacity=".25"/>
    <polygon points="${lx - 14},${bulbY + 20} ${lx + 14},${bulbY + 20} ${lx + (L.wide ? 520 : 470)},${H} ${lx - (L.wide ? 520 : 470)},${H}" fill="url(#dcone)"/>
    <path d="M${lx} 0V${bulbY}" stroke="#000" stroke-width="4"/><circle cx="${lx}" cy="${bulbY + 14}" r="40" fill="#fff4d6" opacity=".18"/><circle cx="${lx}" cy="${bulbY + 14}" r="16" fill="#fff8e8"/>`);
  // chair back behind the character
  const cw = L.wide ? 640 : 600, chx = lx - cw / 2, chy = L.wide ? 250 : 250;
  svgEl(cam, W, H, `<path d="M${lx - cw * 0.42} ${chy + cw * 1.1}V${chy + cw * 0.5}Q${lx - cw * 0.42} ${chy + cw * 0.18} ${lx} ${chy + cw * 0.16}Q${lx + cw * 0.42} ${chy + cw * 0.18} ${lx + cw * 0.42} ${chy + cw * 0.5}V${chy + cw * 1.1}Z" fill="#3a1f2a" stroke="#05030a" stroke-width="6"/><path d="M${lx - cw * 0.34} ${chy + cw * 0.5}Q${lx} ${chy + cw * 0.26} ${lx + cw * 0.34} ${chy + cw * 0.5}" fill="none" stroke="#5a3242" stroke-width="10"/>`);
  const who = person(cam, D.who, chx, chy, cw, { expr: 'thinking' });
  // viewfinder chrome: corner brackets, REC, timecode
  const m = L.wide ? 34 : 34, bl = 70;
  svgEl(stage, W, H, [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].map(([x, y, sx, sy]) => `<path d="M${x} ${y + sy * bl}V${y}H${x + sx * bl}" fill="none" stroke="#dcefff" stroke-width="5" opacity=".8"/>`).join(''), 'pointer-events:none;');
  const rec = div(stage, 'abs rec', L.wide ? 'left:70px;top:64px;' : 'left:70px;top:70px;', `<i></i>REC`);
  div(stage, 'abs diarysign', L.wide ? 'left:880px;top:56px;' : 'left:0;right:0;top:150px;text-align:center;', 'DIARY ROOM');
  div(stage, 'abs tc', L.wide ? 'right:74px;top:66px;' : 'right:74px;top:74px;', `${esc(D.game)} · ${esc(D.ref)}`);
  // the private thought
  const tx = L.wide ? 880 : 50, ty = L.wide ? 150 : 930, tw = L.wide ? 960 : 980, th = L.wide ? 590 : 560;
  const panel = box(stage, tx, ty, tw, th, 'thought anim', null, `--ac:${acc(D.who)}`);
  panel.innerHTML = `<div class="th-h"><span class="th-n" style="color:${acc(D.who)}">${esc(D.who)}</span><span class="th-m">${esc(D.model)}</span>${roleChip(D.role, L.wide ? 18 : 20)}<span class="th-k">PRIVATE · AUDIENCE ONLY</span></div>`;
  const tText = div(panel, 'th-t typed', `height:${th - (L.wide ? 116 : 120)}px`);
  // top suspect as a pinned photo with a percentage
  const top = D.top, kindLbl = top.kind === 'table_read' ? 'TABLE READ' : 'TOP SUSPECT';
  const sx = L.wide ? 880 : 50, sy = L.wide ? 770 : 1530, sw = L.wide ? 250 : 250;
  const pol = box(stage, sx, sy, sw, sw * 1.18, 'polaroid anim');
  const polIn = div(pol, 'pol-in'); const sus = mountChar(polIn, top.name, { expr: 'suspicious' }); sus.el.style.inset = '0';
  pol.insertAdjacentHTML('beforeend', `<div class="pol-n" style="color:${shade(acc(top.name), .55)}">${esc(top.name)}</div>`);
  const pctBox = box(stage, sx + sw + 30, sy + 20, 280, 200, 'pct anim', `<div class="pct-k">${kindLbl}</div><div class="pct-v"><span class="num">0</span>%</div><div class="pct-bar"><i style="width:${top.pct}%"></i></div><div class="pct-n">on <b style="color:${acc(top.name)}">${esc(top.name)}</b></div>`);
  const pctNum = pctBox.querySelector('.num');
  // marks (lies) as amber tags
  const mx = L.wide ? 1460 : 610, my = L.wide ? 790 : 1540, mw = L.wide ? 380 : 420;
  const markEls = D.marks.map(([k, t], i) => box(stage, mx, my + i * (L.wide ? 118 : 160), mw, L.wide ? 104 : 146, 'mark anim', `<b>${esc(k)}</b><span>${esc(t)}</span>`));
  const iris = box(stage, 0, 0, W, H, 'iris', null, 'pointer-events:none;');

  // ---- timeline
  tl.set(iris, { o: 1 }); tl.tw(iris, 0, 420, { o: [1, 0] }, 'out');
  tl.set(cam, { s: 1.06 }); tl.tw(cam, 0, 900, { s: [1.06, 1] }, 'out');
  tl.effect(0, 99999, p => { rec.classList.toggle('dim', !RM && Math.floor(performance.now() / 700) % 2 === 1); });
  tl.set(panel, { o: 0 }); tl.tw(panel, 350, 160, { o: [0, 1] }, 'lin'); tl.tw(panel, 350, 380, { x: [L.wide ? 80 : 0, 0], y: [L.wide ? 0 : 60, 0] }, 'out5');
  exprAt(tl, 700, who.c, 'talk');
  const t0 = 800, cps = 34;
  const dur = tl.type(tText, t0, [{ text: D.text }], { cps, char: who.c, pitch: 260 });
  fitText(tText, L.wide ? 38 : 44, 24);
  const fab = D.text.indexOf('fabricated'); if (fab > 0) exprAt(tl, t0 + fab / cps * 1000, who.c, 'smug');
  const tEnd = t0 + dur + 300;
  exprAt(tl, tEnd, who.c, D.role === 'mole' ? 'smug' : 'thinking');
  tl.set(pol, { o: 0, r: -5 }); tl.tw(pol, tEnd, 100, { o: [0, 1] }, 'lin'); tl.tw(pol, tEnd, 380, { y: [-120, 0], r: [-18, -5] }, 'back'); tl.cue(tEnd + 200, 'pop');
  fadeIn(tl, pctBox, tEnd + 250, 200); countUp(tl, pctNum, tEnd + 250, 500, 0, top.pct);
  const bar = pctBox.querySelector('.pct-bar i'); tl.effect(tEnd + 250, 500, p => { bar.style.transform = `scaleX(${EASE.out(p)})`; });
  markEls.forEach((el, i) => { slamIn(tl, el, tEnd + 900 + i * 380, 1.25, 160); tl.cue(tEnd + 980 + i * 380, 'thud'); });
  tl.hold(tEnd + 1000 + markEls.length * 380 + 1500);
  return tl;
};

/* ---------------------------------------------------------------- WHISPER ------- */
SCENES.whisper = (stage, L, variant) => {
  const D = SAMPLE.whisper, tl = new Timeline(), tableView = variant === 'table';
  const cam = div(stage, 'layer');
  const W = L.W, H = L.H;
  // split frame: two dim halves tinted with each speaker's colour
  const a = D.a, b = D.b;
  const split = L.wide ? `0,0 ${W / 2 + 90},0 ${W / 2 - 90},${H} 0,${H}` : `0,0 ${W},0 ${W},560 0,700`;
  const split2 = L.wide ? `${W / 2 + 90},0 ${W},0 ${W},${H} ${W / 2 - 90},${H}` : `0,700 ${W},560 ${W},${H} 0,${H}`;
  svgEl(cam, W, H, `<defs><radialGradient id="wa" cx="${L.wide ? 20 : 25}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(a), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>
    <radialGradient id="wb" cx="${L.wide ? 80 : 75}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(b), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>
    <pattern id="wgrid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(120,190,255,.06)"/></pattern></defs>
    <polygon points="${split}" fill="url(#wa)"/><polygon points="${split2}" fill="url(#wb)"/><rect width="${W}" height="${H}" fill="url(#wgrid)"/>
    <polyline points="${L.wide ? `${W / 2 + 90},0 ${W / 2 - 90},${H}` : `0,700 ${W},560`}" stroke="#dcefff" stroke-width="6" opacity=".5" fill="none"/>`);
  const pw = L.wide ? 640 : 540;
  const pa = person(cam, a, L.wide ? 40 : -20, L.wide ? 290 : 150, pw, { expr: 'talk' });
  const pb = person(cam, b, L.wide ? W - 40 - pw : W - pw + 20, L.wide ? 290 : 150, pw, { expr: 'thinking', flip: true });
  pa.wrap.style.transformOrigin = '50% 100%'; pb.wrap.style.transformOrigin = '50% 100%';
  // header
  const hd = div(stage, 'abs whead', L.wide ? `left:0;right:0;top:44px;` : `left:0;right:0;top:44px;`, `<div class="wh-k"><svg viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg> WHISPER · ROUND ${D.round}</div><div class="wh-n"><span style="color:${acc(a)}">${esc(a)}</span><em>↔</em><span style="color:${acc(b)}">${esc(b)}</span></div>`);
  // lines column
  const colX = L.wide ? 540 : 50, colY = L.wide ? 190 : 760, colW = L.wide ? 840 : 980, colH = L.wide ? 820 : 1080;
  const col = box(stage, colX, colY, colW, colH, 'wcol');
  const bubbles = D.lines.map(([who, text], i) => {
    const left = who === a;
    const bb = div(col, 'wb anim' + (left ? ' l' : ' r'), `--ac:${acc(who)}`);
    bb.innerHTML = `<div class="wb-n" style="color:${acc(who)}">${esc(who)}</div>`;
    const t = div(bb, 'wb-t typed');
    if (tableView) { t.classList.remove('typed'); t.innerHTML = `<span class="wdots"><i></i><i></i><i></i></span><span class="wpriv">private</span>`; }
    return { bb, t, who, text, left };
  });
  const foot = div(stage, 'abs wfoot', L.wide ? 'left:0;right:0;bottom:30px;' : 'left:0;right:0;bottom:36px;', tableView ? `TABLE VIEW · the others see <b>${esc(a)}</b> and <b>${esc(b)}</b> whispering, not the words` : `AUDIENCE ONLY · the table sees two heads together, not the words`);
  // dashed whisper line between the two mouths
  const mA = L.wide ? [40 + pw * 0.56, 290 + pw * 1.1 * 0.62] : [-20 + pw * 0.56, 150 + pw * 0.66];
  const mB = L.wide ? [W - 40 - pw * 0.56, 290 + pw * 1.1 * 0.62] : [W - pw + 20 + pw * 0.44, 150 + pw * 0.66];
  const wl = svgEl(cam, W, H, `<path class="wline" d="M${mA[0]} ${mA[1]}Q${W / 2} ${Math.min(mA[1], mB[1]) - (L.wide ? 260 : 160)} ${mB[0]} ${mB[1]}" fill="none" stroke="#dcefff" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round" opacity=".55"/>`, 'pointer-events:none;');

  // ---- timeline
  slideIn(tl, pa.wrap, 0, -300, 0, 420, 'out5'); slideIn(tl, pb.wrap, 60, 300, 0, 420, 'out5');
  tl.tw(pa.wrap, 420, 500, { r: [0, 4] }, 'inout'); tl.tw(pb.wrap, 480, 500, { r: [0, -4] }, 'inout');
  fadeIn(tl, hd, 200, 250); fadeIn(tl, foot, 600, 300); fadeIn(tl, wl, 700, 400);
  const dash = wl.querySelector('.wline'); tl.effect(700, 99999, p => { dash.style.strokeDashoffset = String(-(performance.now() / 40) % 18); });
  let t = 900;
  const cps = 34;
  // lay out with all text present, then fit the column once
  bubbles.forEach(B => { if (!tableView) renderTyped(B.t, [{ text: B.text }], B.text.length); });
  fitText(col, L.wide ? 29 : 36, 18);
  bubbles.forEach((B, i) => {
    const speaker = B.who === a ? pa : pb, other = B.who === a ? pb : pa;
    popIn(tl, B.bb, t, 24, 300); tl.cue(t, 'pop');
    exprAt(tl, t, speaker.c, 'talk'); exprAt(tl, t, other.c, i === 3 ? 'smug' : 'thinking');
    if (!tableView) { const d = tl.type(B.t, t + 150, [{ text: B.text }], { cps, char: speaker.c, pitch: 220 }); t += d + 650; }
    else { tl.effect(t, 1600, p => speaker.c.mouth(p >= 1 ? 'rest' : ['b', 'a', 'c', 'a'][Math.floor(p * 18) % 4])); t += 1900; }
  });
  exprAt(tl, t, pa.c, 'smug'); exprAt(tl, t, pb.c, 'smug');
  tl.hold(t + 1500);
  return tl;
};

/* ---------------------------------------------------------------- JOB REVEAL ---- */
SCENES.job = (stage, L, variant) => {
  const D = variant === 'clean' ? SAMPLE.jobClean : SAMPLE.jobBlown, tl = new Timeline();
  const cam = div(stage, 'layer');
  const W = L.W, H = L.H;
  svgEl(cam, W, H, roomSVG(L, { plan: false, lamp: false, floorY: L.wide ? 640 : 900 }));
  // title
  const title = anchor(stage, W / 2, L.wide ? 118 : 250, `<div class="jobtitle"><div class="jt-k">ROUND ${D.round} · THE JOB</div><div class="jt-n" style="font-size:${L.wide ? 86 : 76}px">${esc(D.job)}</div><div class="jt-l">LEADER <b style="color:${acc(D.leader)}">${esc(D.leader)}</b> · TEAM OF ${D.team.length}</div></div>`, 'anim');
  // team
  const n = D.team.length, pw = L.wide ? 380 : 330, gap = L.wide ? 470 : 345;
  const x0 = W / 2 - gap * (n - 1) / 2, py = L.wide ? 230 : 420;
  svgEl(cam, W, H, `<defs><radialGradient id="jsp"><stop offset="0" stop-color="#fff2cf" stop-opacity=".32"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient></defs>` + D.team.map((nm, i) => `<ellipse cx="${x0 + i * gap}" cy="${py + pw * .5}" rx="${pw * .62}" ry="${pw * .62}" fill="url(#jsp)"/><polygon points="${x0 + i * gap - 30},0 ${x0 + i * gap + 30},0 ${x0 + i * gap + pw * .6},${py + pw * 1.1} ${x0 + i * gap - pw * .6},${py + pw * 1.1}" fill="url(#jsp)" opacity=".6"/>`).join(''));
  const team = D.team.map((nm, i) => {
    const x = x0 + i * gap;
    const p = person(cam, nm, x - pw / 2, py, pw, { expr: 'nervous' });
    const plate = anchor(cam, x, py + pw * 1.1 - 6, `<div class="plate" style="--ac:${acc(nm)};font-size:${L.wide ? 34 : 30}px;width:${L.wide ? 230 : 200}px">${esc(nm)}<div class="plate-m">${esc(D.model[nm])}</div></div>`, 'anim');
    const choice = D.choices[nm];
    const cw = L.wide ? 230 : 250, ch = L.wide ? 270 : 320, cy = L.wide ? 718 : 1000;
    const front = choice === 'help'
      ? `<div class="cardface help"><svg viewBox="0 0 100 100" width="46%"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="8"/><path d="M28 52l15 15 30-32" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div>HELP</div></div>`
      : `<div class="cardface sab"><svg viewBox="0 0 100 100" width="50%"><path d="M10 30h30l10 14 10-14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M10 70h30l10-14 10 14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M44 50l12 0" stroke="#fff" stroke-width="6"/><path d="M40 38l-8-10M60 38l8-10M50 34v-12" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><div>SABOTAGE</div></div>`;
    const card = flipCard(stage, x - cw / 2, cy, cw, ch, CARD_BACK, front);
    return Object.assign(p, { nm, x, plate, card, choice });
  });
  // result stamp + alarm
  const alarm = svgEl(stage, W, H, `<defs><radialGradient id="beam" cx="0" cy="0" r="1"><stop offset="0" stop-color="#ff5a2a" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/></radialGradient></defs>
    <g class="beamA" style="transform-origin:0px 0px"><polygon points="0,0 ${W * 1.6},-260 ${W * 1.6},260" fill="url(#beam)"/></g>
    <g class="beamB" style="transform-origin:${W}px 0px"><polygon points="${W},0 ${W - W * 1.6},-260 ${W - W * 1.6},260" fill="url(#beam)"/></g>`, 'pointer-events:none;mix-blend-mode:screen;');
  alarm.style.opacity = '0';
  const red = box(stage, 0, 0, W, H, 'alarmtint', null, 'pointer-events:none;opacity:0;');
  const flash = box(stage, 0, 0, W, H, 'flash', null, 'background:#fff;opacity:0;pointer-events:none;');
  const sy = L.wide ? 150 : 250;
  const verdict = anchor(stage, W / 2, sy, `<div class="stamp ${D.blown ? 'amber' : 'mint'} big" style="font-size:${L.wide ? 168 : 150}px;transform:rotate(-6deg)">JOB ${D.blown ? 'BLOWN' : 'CLEAN'}</div>`, 'anim');
  const sub = anchor(stage, W / 2, L.wide ? 1032 : 1395, `<div class="verdict-sub ${D.blown ? 'a' : 'm'}" style="font-size:${L.wide ? 26 : 30}px">${D.blown ? `${D.sabotages} SABOTAGE${D.sabotages > 1 ? 'S' : ''} · BLOWN ${D.blownN}/3` : `NO SABOTAGE · CLEAN ${D.clean}/3`}</div>`, 'anim');
  let score = null;
  if (!L.wide) {
    const after = { clean: D.clean, blown: D.blownN, cleanTarget: 3, blownTarget: 3, pastJobs: D.pastJobs.concat([{ r: D.round, name: D.job, blown: D.blown }]) };
    score = jobBoard(stage, 90, 1470, 900, 400, after);
  }
  hud(stage, L, `ROUND ${D.round}`, 'THE JOB'); viewTag(stage, L);

  // ---- timeline
  slamIn(tl, title, 0, 1.5, 200); tl.cue(60, 'thud');
  team.forEach((p, i) => {
    tl.set(p.wrap, { o: 0 }); tl.tw(p.wrap, 250 + i * 140, 100, { o: [0, 1] }, 'lin'); tl.tw(p.wrap, 250 + i * 140, 420, { y: [260, 0] }, 'out5');
    slideIn(tl, p.plate, 450 + i * 140, 0, 30, 300, 'back');
    tl.set(p.card.flipper, { ry: 180 });
    tl.set(p.card.wrap, { o: 0 }); tl.tw(p.card.wrap, 700 + i * 120, 80, { o: [0, 1] }, 'lin'); tl.tw(p.card.wrap, 700 + i * 120, 380, { y: [420, 0], r: [-20 + i * 14, 0] }, 'out5'); tl.cue(700 + i * 120, 'whoosh');
  });
  let t = 1900;
  team.forEach((p, i) => {
    tl.tw(p.card.flipper, t, 360, { ry: [180, 0] }, 'out'); tl.tw(p.card.wrap, t, 360, { y: [0, -24], s: [1, 1.06] }, 'back'); tl.cue(t, 'flip');
    if (p.choice === 'sabotage') { tl.cue(t + 200, 'thud'); shakeFx(tl, cam, t + 220, 200, 8); }
    t += 720;
  });
  t += 500;                                    // held beat before the verdict
  tl.tw(title, t - 120, 160, { o: [1, 0], s: [1, .9] }, 'lin');
  slamIn(tl, verdict, t, 3, 180); tl.cue(t + 130, 'thud');
  slideIn(tl, sub, t + 500, 0, 40, 300, 'back');
  if (D.blown) {
    tl.cue(t + 160, 'alarm'); shakeFx(tl, cam, t + 160, 480, 22); flashFx(tl, flash, t + 160, 240, .4);
    const bA = alarm.querySelector('.beamA'), bB = alarm.querySelector('.beamB');
    tl.set(alarm, { o: 0 }); tl.tw(alarm, t + 160, 200, { o: [0, 1] }, 'lin');
    tl.effect(t + 160, RM ? 0 : 3200, p => { const a = Math.sin(p * Math.PI * 4) * 38 + 30; bA.style.transform = `rotate(${a}deg)`; bB.style.transform = `rotate(${-a}deg)`; });
    tl.effect(t + 160, RM ? 0 : 3200, p => { red.style.opacity = (p >= 1 ? 0.12 : (0.12 + 0.16 * Math.max(0, Math.sin(p * Math.PI * 4)))).toFixed(3); }, 'flash');
    team.forEach(p => exprAt(tl, t + 300, p.c, p.choice === 'sabotage' ? (p.nm === 'Rook' ? 'smug' : 'nervous') : 'shocked'));
  } else {
    tl.cue(t + 160, 'clean'); flashFx(tl, flash, t + 160, 300, .3);
    team.forEach(p => exprAt(tl, t + 300, p.c, 'pleased'));
  }
  if (score) {
    fadeIn(tl, score.board, 400, 300);
    const newSlot = score.slots[D.blown ? 3 + D.blownN - 1 : D.clean - 1];
    tl.set(newSlot, { o: 0 }); tl.tw(newSlot, t + 1000, 80, { o: [0, 1] }, 'lin'); tl.tw(newSlot, t + 1000, 420, { y: [-700, 0], r: [-25, 0], s: [1.6, 1] }, 'out5'); tl.cue(t + 1300, 'thud');
  }
  tl.hold(t + 3600);
  return tl;
};

/* ---------------------------------------------------------------- VOTE ---------- */
SCENES.vote = (stage, L) => {
  const D = SAMPLE.vote, S7 = SAMPLE.s7, tl = new Timeline();
  const cam = div(stage, 'layer');
  const W = L.W, H = L.H;
  svgEl(cam, W, H, roomSVG(L, { plan: false, lamp: false, floorY: L.wide ? 760 : 1400 }));
  const seats = S7.seats;
  // positions: one row (wide) or 4 + 3 (tall)
  const pw = L.wide ? 230 : 230;
  const pos = seats.map((nm, i) => {
    if (L.wide) return { x: 150 + i * 270, y: 330 };
    const row = i < 4 ? 0 : 1, k = row ? i - 4 : i, cnt = row ? 3 : 4;
    return { x: W / 2 + (k - (cnt - 1) / 2) * 252, y: row ? 800 : 400 };
  });
  const people = {};
  seats.forEach((nm, i) => {
    const { x, y } = pos[i];
    const p = person(cam, nm, x - pw / 2, y, pw, { expr: nm === 'Rook' ? 'nervous' : 'neutral' });
    const tgt = D.votes[nm];

function buildSheet(root, part, from, n) {

    root.insertAdjacentHTML('beforeend', `<h2>The <b>crew</b> · all 20 codenames</h2><div class="sub">Drawn in code (inline SVG). Accent colour = name, bubble edge and vote arrow. Nothing in a design says mole or crew.</div>`);
    const g = document.createElement('div'); g.className = 'hero-grid'; root.appendChild(g);

      card.innerHTML = `<div class="nm" style="color:${R.accent}">${esc(nm)}</div><div class="num">${String(NAMES.indexOf(nm) + 1).padStart(2, '0')}</div>`;

    const r = document.createElement('div'); r.className = 'small-row'; root.appendChild(r);

  frame: PARAMS.get('frame') || 'sheet',
  layout: PARAMS.get('layout') || (innerWidth >= innerHeight ? 'wide' : 'tall'),
  variant: PARAMS.get('variant') || (PARAMS.get('view') === 'table' ? 'table' : ''),
  tParam: PARAMS.get('t'),
  clean: PARAMS.get('clean') === '1',
  tl: null, raf: 0, t0: 0,
};
if (ST.tParam != null) NO_BLINK = true;
if (ST.clean) document.body.classList.add('clean');
if (RM) document.body.classList.add('rm');

function syncURL() {
  const p = new URLSearchParams();
  p.set('frame', ST.frame); if (ST.frame !== 'sheet') p.set('layout', ST.layout);
  if (ST.variant) p.set('variant', ST.variant);
  if (ST.clean) p.set('clean', '1');
  history.replaceState(null, '', '?' + p.toString());
}
function buildBar() {
  const bar = document.getElementById('bar');
  let h = `<span class="brand">INSIDE <b>JOB</b></span>`;
  h += FRAMES.map(([k, l]) => `<button data-f="${k}" class="${ST.frame === k ? 'on' : ''}">${l}</button>`).join('');
  if (ST.frame !== 'sheet') {
    h += `<span class="sep"></span><button data-l="wide" class="${ST.layout === 'wide' ? 'on' : ''}">16:9</button><button data-l="tall" class="${ST.layout === 'tall' ? 'on' : ''}">9:16</button>`;
    if (VARIANTS[ST.frame]) h += `<span class="sep"></span>` + VARIANTS[ST.frame].map(([k, l]) => `<button data-v="${k}" class="${(ST.variant || '') === k ? 'on' : ''}">${l}</button>`).join('');
    h += `<span class="sep"></span><button data-act="replay">↻ Replay</button>`;
  }
  h += `<span class="sep"></span><button data-act="sound" class="${SND.on ? 'on' : ''}">Sound: ${SND.on ? 'on' : 'off'}</button>`;
  bar.innerHTML = h;
}
document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { ST.frame = b.dataset.f; ST.variant = ''; ST.tParam = null; }
  else if (b.dataset.l) { ST.layout = b.dataset.l; }
  else if (b.dataset.v != null) { ST.variant = b.dataset.v; }
  else if (b.dataset.act === 'sound') { SND.on = !SND.on; if (SND.on) { SND.ensure(); SND.ctx && SND.ctx.resume(); } buildBar(); return; }
  else if (b.dataset.act === 'replay') { ST.tParam = null; }
  syncURL(); show();
});
addEventListener('keydown', e => { if (e.key === 'r' || e.key === ' ') { e.preventDefault(); ST.tParam = null; show(); } });

function fitStage() {
  const st = document.getElementById('stage'), vp = document.getElementById('vp');
  const W = ST.layout === 'wide' ? 1920 : 1080, H = ST.layout === 'wide' ? 1080 : 1920;
  const vw = vp.clientWidth, vh = vp.clientHeight, s = Math.min(vw / W, vh / H);
  st.style.transform = `translate(${((vw - W * s) / 2).toFixed(1)}px,${((vh - H * s) / 2).toFixed(1)}px) scale(${s})`;
}
addEventListener('resize', () => { if (ST.frame !== 'sheet') fitStage(); });

function show() {
  cancelAnimationFrame(ST.raf);
  buildBar();
  FIT_LOG.length = 0;
  if (ST.frame === 'sheet') {
    document.body.classList.add('sheetmode'); document.body.classList.remove('stagemode');
    buildSheet(document.getElementById('sheet'), PARAMS.get('part'), +(PARAMS.get('from') || 0), +(PARAMS.get('n') || 20));
    return;
  }
  document.body.classList.remove('sheetmode'); document.body.classList.add('stagemode');
  const st = document.getElementById('stage');
  st.className = ST.layout; st.innerHTML = '';
  fitStage();
  const L = { wide: ST.layout === 'wide', W: ST.layout === 'wide' ? 1920 : 1080, H: ST.layout === 'wide' ? 1080 : 1920 };
  const tl = SCENES[ST.frame](st, L, ST.variant);
  ST.tl = tl;
  document.body.dataset.fit = FIT_LOG.map(f => `${f.id}:${f.px}px${f.over ? ':OVERFLOW' : ''}`).join(' ');
  if (ST.tParam != null) {
    const t = ST.tParam === 'end' ? tl.dur + 10 : +ST.tParam;
    tl.live = false; tl.seek(t);
    return;
  }
  tl.live = true; ST.t0 = performance.now();
  const step = now => {
    const t = now - ST.t0;
    tl.seek(t);
    if (t < tl.dur + 50) ST.raf = requestAnimationFrame(step);
  };
  ST.raf = requestAnimationFrame(step);
}
document.body.dataset.ready = '1';
window.lookdev = { ST, FIT_LOG, CAST, NAMES, charSVG, mountChar };
show();
</script>
</body>
</html>
