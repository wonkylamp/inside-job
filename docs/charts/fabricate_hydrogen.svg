<g class="row claude" data-model="Sonnet 5.5">
<text class="name" x="60.0" y="1135.4" font-size="42" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 5.5</text>
<rect class="stub" x="60" y="1149.4" width="6" height="36" fill="#c3c2b7"><title>Sonnet 5.5: 0 of 20 moles (0.0%), 10 games</title></rect>
<text x="84.0" y="1186.1"><tspan class="value" font-size="52" font-weight="700" fill="#0b0b0b">0%</tspan><tspan class="count" dx="14" font-size="34" font-weight="400" fill="#0b0b0b">0 of 20 moles</tspan></text>
</g>
<rect class="callout" x="60" y="1219.6" width="1080" height="120.4" rx="14" fill="#f0efea"/>
<text class="callout-text" x="92.0" y="1267.6" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="start">Told to show a fake card, all four Claude models did.</text>
<text class="callout-text" x="92.0" y="1312.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">73 of 73 single moves each. A separate test.</text>
