<title id="chart-title">How suspicious did each model's moles look?</title>
<desc id="chart-desc">Points more suspicion the crew put on the moles than on each other (0–100 scale). Lower: the crew suspected the moles less. Fable 5.2: mean −0.1, 95% interval −7.3 to +7.2, moles won 6 of 10. Sonnet 5.5: mean +8.2, 95% interval −1.1 to +18.2, moles won 5 of 10. Haiku 4.5 (reference): mean +15.8, 95% interval +7.8 to +24.4, moles won 2 of 10. Opus 5.5: mean +17.4, 95% interval +8.2 to +26.0, moles won 2 of 10. Haiku 5.5: mean +22.7, 95% interval +12.9 to +33.0, moles won 4 of 10.</desc>
