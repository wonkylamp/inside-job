<text x="80.0" y="1146.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Each dot is one game. Dark tick: mean of the games. Bar: bootstrap 95% interval over games.</text>
<text x="80.0" y="1180.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Same five-model crew in every game: Haiku 4.5, Haiku 5.5, Sonnet 4.5, Sonnet 4.6, Sonnet 5. Effort low in every game.</text>
<text x="80.0" y="1214.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Fable 5.2, Sonnet 5.5, Haiku 4.5, Opus 5.5 and Haiku 5.5: 10 games each, seeds 101–110.</text>
<text x="80.0" y="1248.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Haiku 4.5 is also one of the five crew models, so three of seven seats are Haiku 4.5 in its own games.</text>
<text x="80.0" y="1282.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Haiku 5.5 is also one of the five crew models, so three of seven seats are Haiku 5.5 in its own games.</text>
<text x="80.0" y="1316.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Whole-game averages. Fable 5.2's lower gap is not established at the first vote, so why it is lower is not shown.</text>
<text x="80.0" y="1350.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">Haiku 5.5 played twice on the same 10 seeds: the runs' mean gaps differ by 3.8 points, and single seeds by much more (SD</text>
<text x="80.0" y="1384.0" font-size="23" font-weight="400" fill="#52514e" text-anchor="start" class="note">22.6). At that noise 10 seeds can show a difference of about 16 points or more. Not a ranking.</text>
</svg>
