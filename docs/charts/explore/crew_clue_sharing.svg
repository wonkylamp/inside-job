<text x="882.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">40%</text>
<line x1="1088.0" y1="190" x2="1088.0" y2="680" stroke="#e1e0d9"/>
<text x="1088.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">60%</text>
<line x1="1294.0" y1="190" x2="1294.0" y2="680" stroke="#e1e0d9"/>
<text x="1294.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">80%</text>
<line x1="1500.0" y1="190" x2="1500.0" y2="680" stroke="#e1e0d9"/>
<text x="1500.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">100%</text>
<line x1="470" y1="680" x2="1500" y2="680" stroke="#c3c2b7"/>
<text x="985.0" y="754.0" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="middle">share of whisper turns showing the real clue card</text>
<text x="80.0" y="244.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 4.6</text>
<text x="80.0" y="278.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">138 of 138 whisper turns, 41 games</text>
<rect x="1500.0" y="233" width="2.0" height="14" rx="7" fill="#86b6ef"><title>Sonnet 4.6: 95% interval 100% to 100%</title></rect>
<rect x="1496.0" y="214" width="8" height="52" rx="3" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/>
<text x="1500.0" y="206.0" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle" stroke="#fcfcfb" stroke-width="8" stroke-linejoin="round" paint-order="stroke">100%</text>
<text x="80.0" y="339.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Haiku 5.5</text>
