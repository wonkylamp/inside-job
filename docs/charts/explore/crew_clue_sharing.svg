<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Who keeps their clue to themselves?</title>
<desc id="chart-desc">Crew whispering in a round they were dealt a clue: share of turns that showed the real card. Sonnet 4.6: 100% (95% 100 to 100), 138 of 138 whisper turns, 41 games. Haiku 5.5: 71% (95% 60 to 81), 50 of 70 whisper turns, 27 games. Sonnet 4.5: 62% (95% 55 to 70), 52 of 84 whisper turns, 34 games. Haiku 4.5: 45% (95% 35 to 55), 54 of 120 whisper turns, 42 games. Sonnet 5: 43% (95% 33 to 54), 44 of 102 whisper turns, 36 games.</desc>
<rect x="0" y="0" width="1600" height="900" fill="#fcfcfb"/>
<text x="80.0" y="98.0" font-size="60" font-weight="700" fill="#0b0b0b" text-anchor="start">Who keeps their clue to themselves?</text>
<text x="80.0" y="148.0" font-size="28" font-weight="400" fill="#52514e" text-anchor="start">Crew whispering in a round they were dealt a clue: share of turns that showed the real card</text>
<line x1="470.0" y1="190" x2="470.0" y2="680" stroke="#e1e0d9"/>
<text x="470.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">0%</text>
<line x1="676.0" y1="190" x2="676.0" y2="680" stroke="#e1e0d9"/>
<text x="676.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">20%</text>
