<text x="80.0" y="529.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Haiku 4.5</text>
<text x="80.0" y="563.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">54 of 120 whisper turns, 42 games</text>
<rect x="831.4" y="518" width="202.2" height="14" rx="7" fill="#86b6ef"><title>Haiku 4.5: 95% interval 35% to 55%</title></rect>
