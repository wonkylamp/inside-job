<text x="80.0" y="434.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 4.5</text>
<text x="80.0" y="468.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">52 of 84 whisper turns, 34 games</text>
