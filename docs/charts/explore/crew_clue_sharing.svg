<text x="80.0" y="624.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 5</text>
<text x="80.0" y="658.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">44 of 102 whisper turns, 36 games</text>
<rect x="807.1" y="613" width="219.9" height="14" rx="7" fill="#86b6ef"><title>Sonnet 5: 95% interval 33% to 54%</title></rect>
<rect x="910.3" y="594" width="8" height="52" rx="3" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/>
<text x="914.3" y="586.0" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle" stroke="#fcfcfb" stroke-width="8" stroke-linejoin="round" paint-order="stroke">43%</text>
<text x="80.0" y="800.0" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Crew seats in pilot 1, pilot 2 and bluff games (same five crew models; 61 games). Card shown = the engine confirms the card is one the player holds.</text>
<text x="80.0" y="830.0" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Bar: bootstrap 95% interval over games. Rounds without a clue are not counted.</text>
