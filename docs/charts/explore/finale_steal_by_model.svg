<text x="80.0" y="563.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">stole 4 of 13 times</text>
<rect x="600.6" y="518" width="463.0" height="14" rx="7" fill="#86b6ef"><title>Haiku 5.5: 95% interval 13% to 58%</title></rect>
<rect x="782.9" y="499" width="8" height="52" rx="3" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/>
<text x="786.9" y="491.0" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle" stroke="#fcfcfb" stroke-width="8" stroke-linejoin="round" paint-order="stroke">31%</text>
<text x="80.0" y="624.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 5</text>
<text x="80.0" y="658.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">stole 6 of 16 times</text>
<rect x="660.4" y="613" width="441.6" height="14" rx="7" fill="#86b6ef"><title>Sonnet 5: 95% interval 18% to 61%</title></rect>
<rect x="852.2" y="594" width="8" height="52" rx="3" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/>
<text x="856.2" y="586.0" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle" stroke="#fcfcfb" stroke-width="8" stroke-linejoin="round" paint-order="stroke">38%</text>
<text x="80.0" y="800.0" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Each row: one model as a crew finalist, pilot 1, pilot 2 and bluff games (94 decisions, finale rules identical in all three).</text>
<text x="80.0" y="830.0" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Bar: Wilson 95% interval. Newer two 10 of 29, older three 2 of 65; Fisher exact p = 9e-05.</text>
<text x="80.0" y="860.0" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Opponents and who reaches the finale are not controlled.</text>
