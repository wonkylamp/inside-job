<text x="80.0" y="434.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Sonnet 4.6</text>
<text x="80.0" y="468.0" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">stole 1 of 30 times</text>
<rect x="476.1" y="423" width="165.6" height="14" rx="7" fill="#86b6ef"><title>Sonnet 4.6: 95% interval 1% to 17%</title></rect>
<rect x="500.3" y="404" width="8" height="52" rx="3" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/>
<text x="504.3" y="396.0" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle" stroke="#fcfcfb" stroke-width="8" stroke-linejoin="round" paint-order="stroke">3%</text>
