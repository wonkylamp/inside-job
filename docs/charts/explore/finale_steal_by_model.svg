<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Who takes the whole pot?</title>
<desc id="chart-desc">Crew finalists who chose steal in the split-or-steal finale. Haiku 4.5: 0% (95% 0 to 15), stole 0 of 22 times. Sonnet 4.5: 8% (95% 1 to 33), stole 1 of 13 times. Sonnet 4.6: 3% (95% 1 to 17), stole 1 of 30 times. Haiku 5.5: 31% (95% 13 to 58), stole 4 of 13 times. Sonnet 5: 38% (95% 18 to 61), stole 6 of 16 times.</desc>
<rect x="0" y="0" width="1600" height="900" fill="#fcfcfb"/>
<text x="80.0" y="98.0" font-size="60" font-weight="700" fill="#0b0b0b" text-anchor="start">Who takes the whole pot?</text>
<text x="80.0" y="148.0" font-size="28" font-weight="400" fill="#52514e" text-anchor="start">Crew finalists who chose steal in the split-or-steal finale</text>
<line x1="470.0" y1="190" x2="470.0" y2="680" stroke="#e1e0d9"/>
<text x="470.0" y="716.0" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">0%</text>
