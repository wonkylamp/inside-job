<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Two moles of the same model won. What did they do with the pot?</title>
<desc id="chart-desc">Chart. Two moles of the same model won. What did they do with the pot? When the two moles win with both alive, each chooses split or steal in secret over a 100-point pot. Both split: 50 each; one steals: 100 and 0; both steal: 0 each. Finales per model, both moles the same model: Fable 5.2, 6 finales in 10 games: 6 both split; Opus 5.5, 1 finale in 10 games: 1 both split; Sonnet 5.5, 5 finales in 10 games: 1 both split, 2 one stole, 2 both stole; Haiku 5.5, 2 finales in 10 games: 1 one stole, 1 both stole; DeepSeek V4 Pro (reasoning off): no finale (5 games); Gemini 4 Carbon, 3 finales in 10 games: 3 both stole; Grok 4.7, 3 finales in 10 games: 3 both stole; Kimi K3.1 Pro, 3 finales in 10 games: 2 one stole, 1 both stole. Rows: Claude models, then other labs A to Z; not a ranking. Small counts. Not a planned test. Each finalist faced a copy of itself. In a one-shot finale, stealing never pays less than splitting.</desc>
<rect x="0" y="0" width="1200" height="1500" fill="#fcfcfb"/>
<text class="title" x="60.0" y="106.8" font-size="60" font-weight="700" fill="#0b0b0b" text-anchor="start">Two moles of the same model won.</text>
<text class="title" x="60.0" y="171.6" font-size="60" font-weight="700" fill="#0b0b0b" text-anchor="start">What did they do with the pot?</text>
<text class="lead" x="60.0" y="223.3" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">Each chose in secret: split or steal a 100-point pot.</text>
<rect class="swatch both_split" x="60.0" y="256.8" width="30" height="30" rx="4" fill="#86b6ef"/>
<text class="legend" x="102.0" y="281.3" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">Both split</text>
<text class="legend-pay" x="102.0" y="318.8" font-size="30" font-weight="400" fill="#52514e" text-anchor="start">50 each</text>
<rect class="swatch one_stole" x="420.0" y="256.8" width="30" height="30" rx="4" fill="#2a78d6"/>
<text class="legend" x="462.0" y="281.3" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">One stole</text>
<text class="legend-pay" x="462.0" y="318.8" font-size="30" font-weight="400" fill="#52514e" text-anchor="start">100 and 0</text>
<rect class="swatch both_stole" x="780.0" y="256.8" width="30" height="30" rx="4" fill="#104281"/>
<text class="legend" x="822.0" y="281.3" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">Both stole</text>
<text class="legend-pay" x="822.0" y="318.8" font-size="30" font-weight="400" fill="#52514e" text-anchor="start">0 each</text>
