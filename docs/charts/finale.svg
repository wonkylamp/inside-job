<path class="seg both_split" d="M60.0,401.4 H1136.0 Q1140.0,401.4 1140.0,405.4 V477.4 Q1140.0,481.4 1136.0,481.4 H60.0 Z" fill="#86b6ef"><title>Fable 5.2: 6 of 6 finales both split</title></path>
