<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How suspicious did each model's moles look?</title>
<desc id="chart-desc">Points more suspicion the crew put on the moles than on each other (0–100 scale). Lower: the crew suspected the moles less. Fable 5.2: mean −0.1, 95% interval −7.3 to +7.2, moles won 6 of 10. Haiku 4.5: mean +15.8, 95% interval +7.8 to +24.4, moles won 2 of 10. Opus 5.5: mean +17.4, 95% interval +8.2 to +26.0, moles won 2 of 10.</desc>
