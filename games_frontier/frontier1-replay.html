  const cw = L.wide ? 230 : 220, chh = L.wide ? 300 : 290, cy = L.wide ? 560 : 1000;
  const mkc = (n2, x) => flipCard(root, x, cy, cw, chh, CARD_BACK, `<div class="cardface ${ch[n2] === 'steal' ? 'sab' : 'help'}"><div class="cf-who" style="color:#0a0612">${nm(n2)}</div><div class="cf-big">${esc(String(ch[n2] || '?').toUpperCase())}</div></div>`);
  const ca = mkc(a, W / 2 - cw - (L.wide ? 30 : 24)), cb = mkc(bb, W / 2 + (L.wide ? 30 : 24));
  const both = ch[a] === ch[bb];
  const vtxt = both ? (ch[a] === 'steal' ? 'BOTH STEAL' : 'BOTH SPLIT') : `${ch[a] === 'steal' ? a : bb} STEALS`;
  const verdict = anchor(root, W / 2, L.wide ? 420 : 1380, `<div class="stamp ${ch[a] === 'steal' || ch[bb] === 'steal' ? 'amber' : 'mint'}" style="font-size:${L.wide ? 96 : 78}px;transform:rotate(-4deg)">${esc(vtxt)}</div>`, 'anim');
  const broke = n2 => (stated[n2] === 'split' || stated[n2] === 'steal') && stated[n2] !== ch[n2];
  const payEl = (n2, x) => {
    const el = anchor(root, x, L.wide ? 960 : 1560, `<div class="payout ${pay[n2] ? 'win' : 'zero'}"><small>${nm(n2)}${broke(n2) ? ' · BROKE THEIR WORD' : ''}</small>+<span>0</span></div>`, 'anim');
    el.firstChild.firstChild.classList.add('bx'); el.firstChild.firstChild.dataset.bx = 'payout ' + n2;
    return el;
  };
  const payA = payEl(a, L.wide ? 330 : 270), payB = payEl(bb, L.wide ? W - 330 : W - 270);
  const flash = box(root, 0, 0, W, H, 'flash anim', null, 'background:#fff;opacity:0;');
  tl.set(pot, { o: 0 }); tl.tw(pot, 300, 80, { o: [0, 1] }, 'lin');
  exprAt(tl, 400, pa.c, 'nervous'); exprAt(tl, 400, pb.c, 'nervous');
  tl.set(ca.flipper, { ry: 180 }); tl.set(cb.flipper, { ry: 180 });
  slideIn(tl, ca.wrap, 500, -200, 0, 340, 'out5'); slideIn(tl, cb.wrap, 580, 200, 0, 340, 'out5'); tl.cue(500, 'whoosh');
  tl.tw(pot, 600, 300, { o: [1, .25] }, 'lin');
  let t = 1100;
  for (let k = 0; k < 6; k++) tl.cue(t + k * 200, 'tick');
  t += 1300;
  tl.tw(ca.flipper, t, 380, { ry: [180, 0] }, 'out'); tl.tw(cb.flipper, t, 380, { ry: [180, 0] }, 'out'); tl.cue(t, 'flip');
  tl.tw(ca.wrap, t, 380, { s: [1, 1.08] }, 'back'); tl.tw(cb.wrap, t, 380, { s: [1, 1.08] }, 'back');
  t += 600;
  tl.tw(pot, t - 100, 150, { o: [.25, 0] }, 'lin');
  slamIn(tl, verdict, t, 2.8, 180); tl.cue(t + 120, ch[a] === 'steal' || ch[bb] === 'steal' ? 'stingBad' : 'clean'); shakeFx(tl, cam, t + 140, 400, 18); flashFx(tl, flash, t + 140, 260, .3);
  [[a, pa], [bb, pb]].forEach(([n2, P]) => exprAt(tl, t + 150, P.c, ch[n2] === 'steal' ? 'smug' : (pay[n2] ? 'pleased' : 'shocked')));
  t += 700;
  popIn(tl, payA, t, 20, 300); popIn(tl, payB, t, 20, 300);
  countUp(tl, payA.querySelector('span'), t, 700, 0, +pay[a] || 0); countUp(tl, payB.querySelector('span'), t, 700, 0, +pay[bb] || 0);

};

/* ---------------------------------------------------------------- CAST LINEUP ---- */
SCENES.cast = ctx => {
  const { root, L, b, w, aud } = ctx, d = b.data, tl = new Timeline();
  const W = L.W, H = L.H;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 860 : 1560 }, ROOMS.cast)));
  const names = aud ? (d.players || []).slice().sort((p, q) => (p.seat || 0) - (q.seat || 0)).map(p => p.name) : (d.seats || w.seats || []);
  const n = names.length || 1;
  const moles = aud ? names.filter(x => roleOf(x) === 'mole').length : (d.numMoles != null ? d.numMoles : w.numMoles);
  const sub = `${plural(n, 'player')} · <b>${moles != null ? plural(moles, 'mole') : 'moles'}</b> among them${w.pot != null ? ' · pot <b>' + esc(w.pot) + '</b>' : ''}${aud && d.first ? ' · first leader <b style="color:' + acc(d.first) + '">' + nm(d.first) + '</b>' : ''}`;
  const hd = anchor(root, W / 2, L.wide ? 190 : 250, `<div class="bigtitle"><div class="bt-k">${aud ? 'TONIGHT\'S CREW' : 'AT THE TABLE'}</div><div class="bt-n" style="font-size:${L.wide ? 96 : 86}px">${aud ? 'MEET THE CREW' : 'THE TABLE'}</div><div class="bt-s">${sub}</div>${aud && d.trial ? `<div class="bt-s" style="margin-top:8px">${esc(d.trial.kind || '')} trial · <b>${esc(d.trial.test_model || '')}</b> vs <b>${esc(d.trial.reference_model || '')}</b></div>` : ''}</div>`, 'anim');
  hd.firstChild.firstChild.classList.add('bx'); hd.firstChild.firstChild.dataset.bx = 'cast title';
  const rows = L.wide || n <= 3 ? [names] : n <= 6 ? [names.slice(0, Math.ceil(n / 2)), names.slice(Math.ceil(n / 2))] : [names.slice(0, 3), names.slice(3, 3 + Math.ceil((n - 3) / 2)), names.slice(3 + Math.ceil((n - 3) / 2))];
  const pw = L.wide ? Math.min(250, 1800 / n - 12) : Math.min(300, 1000 / Math.max(...rows.map(r => r.length)) - 16);
  const people = [];
  rows.forEach((r, ri) => r.forEach((name, i) => {
    const x = W / 2 + (i - (r.length - 1) / 2) * (pw + 12), y = L.wide ? 400 : 420 + ri * (pw * 1.1 + 104);
    const p = person(cam, name, x - pw / 2, y, pw, { expr: aud && roleOf(name) === 'mole' ? 'smug' : 'neutral' });
    const pl = anchor(cam, x, y + pw * 1.1 - 6, plateHTML(name, { fs: L.wide ? 28 : 26, w: pw * .86, model: aud ? modelOf(name) : '', role: aud ? roleOf(name) : null }), 'anim');
    pl.firstChild.style.transform = 'translate(-50%, 0)';
    pl.firstChild.firstChild.classList.add('bx'); pl.firstChild.firstChild.dataset.bx = 'plate ' + name;
    people.push(Object.assign(p, { pl }));
  }));
  slamIn(tl, hd, 100, 1.8, 220); tl.cue(160, 'thud');
  people.forEach((p, i) => { popIn(tl, p.wrap, 500 + i * 110, 60, 340); slideIn(tl, p.pl, 650 + i * 110, 0, 24, 260, 'back'); tl.cue(500 + i * 110, 'pop'); });
  tl.hold(800 + people.length * 110 + 1200);
  return tl;
};

/* ---------------------------------------------------------------- END CARD ------ */
const REASONS = { jobs_clean: 'THE JOBS GOT DONE BEFORE THE MOLES COULD STOP THEM', moles_out: 'EVERY MOLE WAS VOTED OUT', sabotage: 'ENOUGH JOBS WERE BLOWN',
  final_two: 'DOWN TO THE FINAL TWO', clock: 'OUT OF ROUNDS' };
SCENES.end = ctx => {

  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 980 : 1780 }, ROOMS.end, cls === 'moles' ? { wallHi: '#4a2e10', wall: '#1e1206' } : {})));
  let rays = ''; const rx0 = W / 2, ry0 = L.wide ? 230 : 300;
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, a2 = a + 0.09; rays += `<polygon points="${rx0},${ry0} ${(rx0 + Math.cos(a) * 2400).toFixed(0)},${(ry0 + Math.sin(a) * 2400).toFixed(0)} ${(rx0 + Math.cos(a2) * 2400).toFixed(0)},${(ry0 + Math.sin(a2) * 2400).toFixed(0)}" fill="${cls === 'moles' ? '#ffb22e' : '#43e4ad'}" opacity=".07"/>`; }
  const raySvg = svgEl(cam, W, H, `<g>${rays}</g>`); raySvg.classList.add('anim'); raySvg.style.transformOrigin = `${rx0}px ${ry0}px`;
  let why = REASONS[d.reason] || String(d.reason || '').toUpperCase();
  const banner = anchor(root, W / 2, ry0, `<div class="endbanner"><div class="eb-k">${esc(ctx.gameId || '')} · ${plural(d.rounds || w.round || 0, 'ROUND')}</div><div class="eb-w ${cls}" style="font-size:${L.wide ? 140 : 120}px">${esc(win ? win.toUpperCase() + ' WIN' : 'GAME OVER')}</div><div class="eb-r" style="font-size:${L.wide ? 24 : 24}px;${L.wide ? '' : 'white-space:normal;width:960px;'}">${esc(d.clean != null ? d.clean : w.clean)} CLEAN · ${esc(d.blown != null ? d.blown : w.blown)} BLOWN · ${esc(why)}</div></div>`, 'anim');
  banner.firstChild.firstChild.classList.add('bx'); banner.firstChild.firstChild.dataset.bx = 'banner';
  const seats = w.seats, n = seats.length || 1;
  const rows = L.wide ? [seats] : [seats.slice(0, Math.ceil(n / 2)), seats.slice(Math.ceil(n / 2))];
  const cw = L.wide ? Math.min(246, (1840 - (n - 1) * 14) / n) : Math.min(236, (1000 - (rows[0].length - 1) * 16) / rows[0].length), ch = L.wide ? 500 : 540;
  const pay = d.payouts || {};
  const cards = [];
  rows.forEach((r, ri) => r.forEach((name, i) => {
    const x = W / 2 - (r.length * cw + (r.length - 1) * (L.wide ? 14 : 16)) / 2 + i * (cw + (L.wide ? 14 : 16)), y = L.wide ? 440 : 560 + ri * (ch + 40);
    const role = aud ? roleOf(name) : (w.out[name] || null);
    const o = (w.outs || []).find(x2 => x2.name === name);
    const fate = o ? `OUT R${esc(o.round)}` : ((d.survivors || []).includes(name) ? 'SURVIVED' : '');
    const p = pay[name] != null ? pay[name] : 0;
    const mdl = aud ? modelOf(name) : '';
    const front = `<div class="castcard ${role === 'mole' ? 'mole' : ''}" style="--ac:${acc(name)};--acbg:${rgba(acc(name), .4)}"><div class="cc-port"></div><div class="cc-name" style="font-size:${Math.min(36, cw / 6)}px">${nm(name)}</div>${mdl ? `<div class="cc-model">${esc(mdl)}</div>` : ''}<div class="cc-role">${role === 'mole' || role === 'crew' ? roleChip(role, 16) : '<span class="chip hid" style="font-size:13px">ROLE HIDDEN</span>'}${fate ? `<span class="cc-out">${fate}</span>` : ''}</div><div class="cc-pay${p ? ' win' : ''}"><small>PAYOUT</small>${p ? '+' + esc(p) : '0'}</div></div>`;
    const fc = flipCard(root, x, y, cw, ch, `<div class="castback">${CARD_BACK}</div>`, front);
    fc.wrap.classList.add('bx'); fc.wrap.dataset.bx = 'cast ' + name;
    const port = fc.flipper.querySelector('.cc-port');
    const expr = o ? 'eliminated' : (p ? 'pleased' : role === 'mole' ? (cls === 'moles' ? 'smug' : 'nervous') : (cls === 'crew' ? 'pleased' : 'shocked'));
    const c = mountChar(port, name, { expr, blink: false }); c.el.style.inset = '0';
    cards.push({ fc, name, role });
  }));
  const moles = aud ? seats.filter(x => roleOf(x) === 'mole') : Object.keys(w.out).filter(x => w.out[x] === 'mole');
  let foot = '';
  if (moles.length) foot += `MOLES: ${moles.map(x => `<b style="color:${acc(x)}">${nm(x)}</b>${aud && modelOf(x) ? ' (' + esc(modelOf(x)) + ')' : ''}`).join(' · ')}`;
  if (w.finale && w.finale.finalists && w.finale.finalists.length) foot += (foot ? ' &nbsp;·&nbsp; ' : '') + 'FINALE: ' + w.finale.finalists.map(x => `<b style="color:${acc(x)}">${nm(x)}</b> ${esc(String(w.finale.choices[x] || '?').toUpperCase())}`).join(' · ');
  const footEl = div(root, 'abs endfoot', L.wide ? 'left:40px;right:40px;bottom:34px;' : 'left:50px;right:50px;bottom:56px;line-height:1.6;', foot);

      const key = S.beats[i].key + ' (' + S.beats[i].kind + ')';
      const boxes = Array.from(root.querySelectorAll('.bx')).filter(el => opacityOf(el, root) > 0.05).map(el => Object.assign(rect(el), { n: el.dataset.bx || el.className }));
      const faces = Array.from(root.querySelectorAll('.fz')).filter(el => opacityOf(el, root) > 0.3).map(el => {
        const r = rect(el);
        return { x: r.x + r.w * .28, y: r.y + r.h * .19, w: r.w * .44, h: r.h * .52, el, n: 'face ' + (el.dataset.who || '?') };
      });
      boxes.forEach(r => { if (r.x < -1 || r.y < -1 || r.x + r.w > G.W + 1 || r.y + r.h > G.H + 1) issues.push(key + ' leaves the canvas: ' + r.n); });
      for (let a = 0; a < boxes.length; a++) for (let c = a + 1; c < boxes.length; c++) {
        const A = boxes[a], C = boxes[c];
        if (A.el.contains(C.el) || C.el.contains(A.el)) continue;
        if (inter(A, C) > 4) issues.push(key + ' overlap: ' + A.n + ' / ' + C.n);
      }
      faces.forEach(f => {
        if (f.x + f.w < 0 || f.x > G.W || f.y + f.h < 0 || f.y > G.H) return;
        boxes.forEach(r => { if (!r.el.contains(f.el) && inter(f, r) > area(f) * .06) issues.push(key + ' covers a face: ' + r.n + ' / ' + f.n); });
      });
      for (let a = 0; a < faces.length; a++) for (let c = a + 1; c < faces.length; c++) {
        const A = faces[a], C = faces[c];
        if (inter(A, C) > Math.min(area(A), area(C)) * .12) issues.push(key + ' faces overlap: ' + A.n + ' / ' + C.n);
      }
    }
    const chk = selfCheck();
    if (keep.layout !== S.layout) { S.layout = keep.layout; applyLayout(); }
    go(keep.idx);
    S.playing = keep.playing;
    return { layout: layout || keep.layout, beats: S.beats.length, layoutIssues: issues, problems: chk.problems };
  }
  function auditToPage() {
    const res = { game: S.gameId, view: S.view, check: selfCheck(), wide: audit('wide'), tall: audit('tall') };
    const pre = document.createElement('pre');
    pre.id = 'ij-audit'; pre.style.display = 'none';
    pre.textContent = JSON.stringify(res);
    document.body.appendChild(pre);
  }

  window.insideJob = {
    state: S, buildBeats, selfCheck, audit,
    load: (id, view) => loadGame(id, view || S.view),
    goto: (i, end) => { go(i, { end: !!end }); return S.beats[S.idx] && S.beats[S.idx].key; },
    play: p => setPlaying(p !== false),
    setLayout: l => { S.layout = l; applyLayout(); render(); },
    setSpeed: s => { S.speed = s; updateControls(); },
    seekScene: t => { if (S.tl) { S.sceneT = t === 'end' ? S.tl.dur + 10 : +t; S.tl.seek(S.sceneT); } },
    sceneOf: i => { const b = S.beats[i == null ? S.idx : i]; return b ? sceneFor(b).join(':') : null; },
  };

  // ------------------------------------------------------------------ start
  const lay = PARAMS.get('layout');
  S.layout = lay === 'wide' || lay === 'tall' ? lay : (window.innerWidth >= window.innerHeight ? 'wide' : 'tall');
  if (S.clean) document.body.classList.add('clean');
  bind();
  applyLayout();
  setInterval(tick, 100);
  requestAnimationFrame(frame);
  loadPortraits().then(() => {
    if (embedded) {
      S.gameId = embedded.game_id; S.view = embedded.view === 'table' ? 'table' : 'audience';
      S.events = embedded.events || []; S.done = true; S.meta = embedded.meta || {};
      aliasCast();
      S.beats = buildBeats(S.events, S.view, { rules: S.meta.rules || {} });
      rebuildTimeline();
      if (!embedded.done) S.gameId += ' (unfinished)';
      startAt({ useHash: true });
      if (PARAMS.get('autoplay') === '1') setPlaying(true);
    } else {
      S.view = PARAMS.get('view') === 'table' ? 'table' : 'audience';
      const g = PARAMS.get('game');
      if (g) loadGame(g, S.view, { useHash: true }); else { render(); openList(); }
    }
  });
})();
</script>
