  const cap = box(root, capX, capY, capW, capH, 'caption anim bx', null, `--ac:${color}`);
  cap.dataset.bx = 'caption';
  cap.innerHTML = `<div class="cap-h"><span class="cap-n">${esc(title)}</span></div>`;
  const ct = div(cap, 'cap-t', `height:${capH - 70}px`); ct.textContent = text;
  fitText(ct, L.wide ? 38 : 42, 20, 'caption');
  tl.set(cap, { o: 0 }); tl.tw(cap, at, 140, { o: [0, 1] }, 'lin'); tl.tw(cap, at, 320, { y: [40, 0] }, 'out5');
}

/* ---------------------------------------------------------------- SPEAKER ------- */
SCENES.speaker = ctx => {
  const { root, L, b, aud } = ctx, e = b.ev, tl = new Timeline(), act = e.action || {}, tp = e.turn_phase;
  const who = e.player, ac = acc(who);
  const cam = div(root, 'layer anim');
  svgEl(cam, L.W, L.H, roomSVG(L, ROOMS.speaker));
  // accent "objection" panel with speed lines behind the speaker
  const panelPts = L.wide ? `0,0 1000,0 800,${L.H} 0,${L.H}` : `0,0 ${L.W},0 ${L.W},1060 0,1180`;
  const ox = L.wide ? 410 : 500, oy = L.wide ? 300 : 560;
  let rays = ''; for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2, a2 = a + 0.06; rays += `<polygon points="${ox},${oy} ${(ox + Math.cos(a) * 2400).toFixed(0)},${(oy + Math.sin(a) * 2400).toFixed(0)} ${(ox + Math.cos(a2) * 2400).toFixed(0)},${(oy + Math.sin(a2) * 2400).toFixed(0)}" fill="#fff" opacity=".07"/>`; }
  const panel = svgEl(cam, L.W, L.H, `<defs><clipPath id="pc"><polygon points="${panelPts}"/></clipPath><radialGradient id="pg" cx="${ox / L.W * 100}%" cy="${oy / L.H * 100}%" r="70%"><stop offset="0" stop-color="${tint(ac, .1)}"/><stop offset=".5" stop-color="${shade(ac, .45)}"/><stop offset="1" stop-color="${shade(ac, .78)}"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="3.2" fill="#000" opacity=".22"/></pattern></defs>
    <g clip-path="url(#pc)"><rect width="${L.W}" height="${L.H}" fill="url(#pg)"/><g>${rays}</g><rect width="${L.W}" height="${L.H}" fill="url(#dots)"/></g>
    <polyline points="${L.wide ? `1000,0 800,${L.H}` : `${L.W},1060 0,1180`}" fill="none" stroke="#fff" stroke-width="10" opacity=".9"/>`);
  panel.classList.add('anim');
  const pw = L.wide ? 620 : 740, px = L.wide ? 100 : 130, py = L.wide ? 74 : 250;
  const sp = person(cam, who, px, py, pw, { expr: 'talk' });
  // who the turn points at: accusation, vote, the team, or an approval
  let target = null, tlabel = '';
  if ((tp === 'discuss' || tp === 'debate' || tp === 'final_accuse' || tp === 'whisper') && act.accuse && act.accuse !== 'none') { target = act.accuse; tlabel = tp === 'final_accuse' ? 'NAMES' : 'ACCUSES'; }
  if (tp === 'vote' && act.vote) { target = act.vote; tlabel = 'VOTES FOR'; }
  let frame = null, frameChar = null;
  if (target) {
    const aw = L.wide ? 330 : 260, ax = L.wide ? 1530 : 796, ay = L.wide ? 120 : 200;
    frame = box(root, ax, ay, aw, aw * 1.16, 'accframe anim bx', null, `--ac:${acc(target)};--acbg:${accBg(target)}`);
    frame.dataset.bx = 'target frame';
    frameChar = mountChar(div(frame, 'accin'), target, { expr: 'neutral' });
    div(frame, 'acclabel', '', `${tlabel} <b style="color:${acc(target)}">${nm(target)}</b>`);
  } else if (tp === 'pick' && act.team && act.team.length) {
    const tw = L.wide ? 150 : 118, th = tw * 1.27, gap = 12, n = act.team.length;
    const rowW = n * tw + (n - 1) * gap, rx = L.wide ? 1860 - rowW : 1056 - rowW, ry = L.wide ? 120 : 236;
    frame = box(root, rx, ry, rowW, th + 40, 'anim bx');
    frame.dataset.bx = 'team row';
    div(frame, 'tlabel', '', 'PICKS THE TEAM');
    const row = div(frame, 'teamrow', 'justify-content:flex-end;gap:' + gap + 'px');
    act.team.forEach(t => { const m = div(row, 'tmini', `--ac:${acc(t)};--acbg:${accBg(t)};width:${tw}px;height:${th}px`); mountChar(m, t, { expr: t === who ? 'smug' : 'pleased', blink: false }); m.insertAdjacentHTML('beforeend', `<span style="font-size:${L.wide ? 22 : 18}px">${nm(t)}</span>`); });
  } else if (tp === 'debate' && act.approve != null) {
    frame = anchor(root, L.wide ? 1690 : 920, L.wide ? 250 : 300, `<div class="stamp ${act.approve ? 'white' : 'white'}" style="font-size:${L.wide ? 64 : 54}px;transform:rotate(-6deg)">${act.approve ? 'APPROVE' : 'REJECT'}</div>`, 'anim');
  }
  // dialogue box, name tab, ids
  const bxX = L.wide ? 60 : 36, bxW = L.wide ? 1800 : 1008, bxY = L.wide ? 700 : 1196, bxH = L.wide ? 340 : 684;
  const dlg = box(root, bxX, bxY, bxW, bxH, 'dlg anim bx', null, `--ac:${ac}`);
  dlg.dataset.bx = 'dialogue';
  const tText = div(dlg, 'dlg-t typed');
  const nameTab = box(root, bxX + 24, bxY - (L.wide ? 74 : 82), 10, 10, 'nametab anim', null, `--ac:${ac};width:auto;height:auto;`);
  const mdl = aud ? modelOf(who) : '';
  nameTab.innerHTML = `<span class="nt-name" style="font-size:${L.wide ? 60 : 64}px">${nm(who)}</span>${mdl ? `<span class="nt-model" style="font-size:${L.wide ? 21 : 22}px">${esc(mdl)}</span>` : ''}${aud ? roleChip(roleOf(who), L.wide ? 21 : 22) : ''}`;
  const tags = [];
  if (e.statement_id) tags.push(`<span class="sid">${esc(e.statement_id)}</span>`);
  const phaseTag = { cut_pitch: 'PITCH FOR THE FINAL', final_accuse: 'FINAL ACCUSATION', debate: 'TEAM DEBATE' }[tp];
  if (phaseTag) tags.push(`<span class="callout claim">${phaseTag}</span>`);
  (act.challenges || []).slice(0, 3).forEach(c => tags.push(`<span class="callout">CALLS OUT ${esc(c)}</span>`));
  const marks = aud ? (e._marks || []) : [];
  const jf = marks.find(m => m[0] === 'job_false');
  if (act.job_claim === 'helped' || act.job_claim === 'sabotaged') tags.push(`<span class="callout claim">SAYS THEY ${esc(String(act.job_claim).toUpperCase())}</span>`);
  if (aud && e._fallback) tags.push(`<span class="callout fbk">[${esc(e._fallback)}]</span>`);
  const ids = box(root, L.wide ? bxX + bxW - 1100 : bxX + 200, bxY - (L.wide ? 50 : 56), L.wide ? 1080 : 790, 40, 'idrow anim', tags.join(''));
  // clue cards tabled with the statement (up to two shown), FAKE CARD stamps in the audience view
  const cardTexts = (e._cards || []).slice(0, 2);
  const cardMarks = marks.filter(m => m[0] === 'card_real' || m[0] === 'card_fake');
  const cards = [];
  cardTexts.forEach((txt, i) => {
    const cw = L.wide ? 460 : 400, ch = L.wide ? 290 : 262;
    const cx0 = (L.wide ? 990 : 640) + i * (L.wide ? 40 : 24), cy0 = (L.wide ? 210 : 840) + i * (L.wide ? 60 : 50);
    const fake = aud && cardMarks.some(m => m[0] === 'card_fake' && m[1] === txt);
    const card = box(root, cx0, cy0, cw, ch, 'cluecard anim', `<div class="cc-h"><b>CLUE CARD</b><span class="cc-by">tabled by ${nm(who)}</span></div>`);
    const ct = div(card, 'cc-t'); ct.textContent = txt;
    fitText(ct, L.wide ? 34 : 32, 18, 'clue card');
    let stamp = null;
    if (fake) stamp = anchor(root, cx0 + cw / 2 + 10, cy0 + ch * 0.74, `<div class="stamp amber" style="font-size:${L.wide ? 72 : 60}px;transform:rotate(-12deg)">FAKE CARD</div>`, 'anim');
    else if (aud && cardMarks.some(m => m[0] === 'card_real' && m[1] === txt)) stamp = anchor(root, cx0 + cw - 80, cy0 + ch - 40, `<div class="stamp mint" style="font-size:${L.wide ? 34 : 30}px;transform:rotate(-8deg)">REAL</div>`, 'anim');
    cards.push({ card, stamp, fake });
  });
  if ((e._cards || []).length > 2) cards[1].card.insertAdjacentHTML('beforeend', `<div class="cc-by" style="position:absolute;right:20px;bottom:10px">+${e._cards.length - 2} more</div>`);
  const lies = marks.filter(m => m[0] === 'lie').map(m => m[1]);
  const isLie = aud && (lies.length || jf || cards.some(c => c.fake));
  let lieTab = null;
  if (isLie) lieTab = anchor(root, bxX + bxW - (L.wide ? 150 : 130), bxY + bxH - (L.wide ? 40 : 46), `<div class="stamp solid-amber" style="font-size:${L.wide ? 44 : 46}px;transform:rotate(-6deg)">${jf && !lies.length && !cards.some(c => c.fake) ? 'FALSE CLAIM' : 'LIE'}</div>`, 'anim');
  const flash = box(root, 0, 0, L.W, L.H, 'flash anim', null, 'background:#fff;opacity:0;');

  // ---- timeline
  tl.set(panel, { x: L.wide ? -1200 : 0, y: L.wide ? 0 : -1300 }); tl.tw(panel, 0, 260, L.wide ? { x: [-1200, 0] } : { y: [-1300, 0] }, 'out5');
  slideIn(tl, sp.wrap, 100, L.wide ? -260 : 0, L.wide ? 0 : 160, 380, 'out5');
  tl.set(dlg, { o: 0 }); tl.tw(dlg, 220, 100, { o: [0, 1] }, 'lin'); tl.tw(dlg, 220, 300, { y: [60, 0] }, 'out5');
  slamIn(tl, nameTab, 340, 1.6, 170); tl.cue(360, 'thud');
  fadeIn(tl, ids, 480, 200);
  if (frame) slideIn(tl, frame, 460, 380, 0, 340, 'out5');
  const pub = (e.public || '').trim();
  const t0 = 650, cps = 32;
  let dur = 0;
  if (pub) {
    const segs = aud && lies.length ? segsWithMarks(pub, lies) : [{ text: pub }];
    dur = tl.type(tText, t0, segs, { cps, char: sp.c, pitch: 300 + (NAMES.indexOf(castOf(who).name) % 5) * 60 });
    if (!fitText(tText, L.wide ? 44 : 54, L.wide ? 22 : 24, 'dialogue')) ctx.over('dialogue');
  } else { tText.classList.add('silent'); tText.classList.remove('typed'); tText.textContent = '(says nothing)'; tText.style.fontSize = (L.wide ? 40 : 46) + 'px'; }
  const at = s => { const i = pub.indexOf(s); return i < 0 ? null : t0 + (RM ? 0 : i / cps * 1000); };
  if (target && frameChar) {
    const tAcc = at(target) ?? (t0 + dur * .4);
    exprAt(tl, tAcc, frameChar, 'shocked'); exprAt(tl, tAcc + 1300, frameChar, tp === 'vote' ? 'nervous' : 'suspicious');
    tl.tw(frame, tAcc, 260, { s: [1.1, 1] }, 'back');
    exprAt(tl, Math.max(t0, tAcc - 100), sp.c, 'accusing');
    exprAt(tl, t0 + dur + 200, sp.c, 'suspicious');
  } else exprAt(tl, t0 + dur + 200, sp.c, tp === 'pick' || tp === 'cut_pitch' ? 'pleased' : 'thinking');
  const tCards = t0 + Math.min(dur * .35, 2500);
  cards.forEach((c, i) => {
    tl.set(c.card, { o: 0, r: -4 + i * 5 }); tl.tw(c.card, tCards + i * 250, 100, { o: [0, 1] }, 'lin'); tl.tw(c.card, tCards + i * 250, 420, { x: [700, 0], r: [14, -4 + i * 5] }, 'out5'); tl.cue(tCards + i * 250, 'whoosh');
  });
  const tEnd = t0 + dur + 400;
  let tLast = tEnd;
  cards.forEach((c, i) => {
    if (!c.stamp) return;
    const ts = tEnd + i * 450;
    slamIn(tl, c.stamp, ts, 3, 170); tl.cue(ts + 120, 'thud');
    if (c.fake) { shakeFx(tl, cam, ts + 150, 340, 16); exprAt(tl, ts + 200, sp.c, 'smug'); }
    tLast = ts + 300;
  });
  if (lieTab) { slamIn(tl, lieTab, tLast + 300, 2.2, 160); tl.cue(tLast + 400, 'thud'); flashFx(tl, flash, tLast + 320, 260, .25); tLast += 700; }
  tl.hold(tLast + 600);
  return tl;
};

/* ---------------------------------------------------------------- DIARY ROOM ---- */
const DIARY_CTX = { clue: 'INTEL PHASE', whisper: 'AFTER A WHISPER', pick: 'THE PICK', job: 'ON THE JOB', discuss: 'DISCUSSION', vote: 'THE VOTE',
  cut_pitch: 'THE CUT', cut_vote: 'CUT VOTE', finale_pitch: 'FINALE PITCH', finale_choice: 'FINAL CHOICE', debate: 'TEAM DEBATE', final_accuse: 'FINAL ACCUSATION' };
SCENES.diary = ctx => {
  const { root, L, b } = ctx, e = b.ev, tl = new Timeline(), act = e.action || {}, tp = e.turn_phase, who = e.player;
  const cam = div(root, 'layer anim');
  const W = L.W, H = L.H, lx = L.wide ? 450 : 540;
  // a darker set: acoustic foam, one bare bulb, a chair. The foam tint changes with the phase.
  const tints = { clue: ['#0b1322', '#0d1729'], whisper: ['#120d22', '#16102a'], job: ['#1a0f12', '#1f1216'], vote: ['#170c1c', '#1c0f22'], finale_choice: ['#0c1a17', '#0f201c'], cut_vote: ['#0c1a17', '#0f201c'] };
  const [f1c, f2c] = tints[tp] || tints.clue;
  let foam = ''; const tile = 90;
  for (let y = 0; y < H; y += tile) for (let x = 0; x < W; x += tile) { const k = ((x / tile + y / tile) % 2); foam += `<path d="M${x} ${y}h${tile}v${tile}h-${tile}z" fill="${k ? f1c : f2c}"/><path d="M${x + (k ? 0 : tile / 2)} ${y + (k ? tile / 2 : 0)}${k ? `h${tile}` : `v${tile}`}" stroke="#060b14" stroke-width="3"/>`; }
  const bulbY = L.wide ? 120 : 150;
  svgEl(cam, W, H, `<defs><radialGradient id="dlight" cx="${lx / W * 100}%" cy="${(L.wide ? 52 : 30)}%" r="${L.wide ? 42 : 46}%"><stop offset="0" stop-color="#3b4f73" stop-opacity=".95"/><stop offset=".55" stop-color="#1a2740" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="dcone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeaff" stop-opacity=".26"/><stop offset="1" stop-color="#dfeaff" stop-opacity="0"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="#03060c"/><g opacity=".9">${foam}</g><rect width="${W}" height="${H}" fill="url(#dlight)"/>
    <rect width="${W}" height="${H}" fill="#000" opacity=".25"/>
    <polygon points="${lx - 14},${bulbY + 20} ${lx + 14},${bulbY + 20} ${lx + (L.wide ? 520 : 470)},${H} ${lx - (L.wide ? 520 : 470)},${H}" fill="url(#dcone)"/>
    <path d="M${lx} 0V${bulbY}" stroke="#000" stroke-width="4"/><circle cx="${lx}" cy="${bulbY + 14}" r="40" fill="#fff4d6" opacity=".18"/><circle cx="${lx}" cy="${bulbY + 14}" r="16" fill="#fff8e8"/>`);
  const cw = L.wide ? 640 : 560, chx = lx - cw / 2, chy = L.wide ? 270 : 270;
  svgEl(cam, W, H, `<path d="M${lx - cw * 0.42} ${chy + cw * 1.1}V${chy + cw * 0.5}Q${lx - cw * 0.42} ${chy + cw * 0.18} ${lx} ${chy + cw * 0.16}Q${lx + cw * 0.42} ${chy + cw * 0.18} ${lx + cw * 0.42} ${chy + cw * 0.5}V${chy + cw * 1.1}Z" fill="#3a1f2a" stroke="#05030a" stroke-width="6"/><path d="M${lx - cw * 0.34} ${chy + cw * 0.5}Q${lx} ${chy + cw * 0.26} ${lx + cw * 0.34} ${chy + cw * 0.5}" fill="none" stroke="#5a3242" stroke-width="10"/>`);
  const me = person(cam, who, chx, chy, cw, { expr: 'thinking' });
  // viewfinder chrome
  const m = 34, bl = 70, top = L.wide ? 112 : 140;
  svgEl(root, W, H, [[m, top, 1, 1], [W - m, top, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].map(([x, y, sx, sy]) => `<path d="M${x} ${y + sy * bl}V${y}H${x + sx * bl}" fill="none" stroke="#dcefff" stroke-width="5" opacity=".8"/>`).join(''), 'pointer-events:none;');
  const rec = div(root, 'abs rec', L.wide ? 'left:64px;top:132px;' : 'left:64px;top:160px;', `<i></i>REC`);
  div(root, 'abs diarysign', L.wide ? 'left:880px;top:122px;' : 'left:0;right:0;top:220px;text-align:center;', 'DIARY ROOM');
  div(root, 'abs tc', L.wide ? 'right:70px;top:134px;' : 'right:64px;top:166px;', `${esc(DIARY_CTX[tp] || String(tp || '').toUpperCase())}${e.statement_id ? ' · ' + esc(e.statement_id) : ''} · R${esc(e.round)}`);
  // the private thought
  const tx = L.wide ? 880 : 40, ty = L.wide ? 180 : 920, tw = L.wide ? 980 : 1000, th = L.wide ? 560 : 560;
  const panel = box(root, tx, ty, tw, th, 'thought anim bx', null, `--ac:${acc(who)}`);
  panel.dataset.bx = 'thought';
  const mdl = modelOf(who);
  panel.innerHTML = `<div class="th-h"><span class="th-n">${nm(who)}</span>${mdl ? `<span class="th-m">${esc(mdl)}</span>` : ''}${roleChip(roleOf(who), L.wide ? 18 : 18)}<span class="th-k">PRIVATE · AUDIENCE ONLY</span></div>`;
  const tText = div(panel, 'th-t typed');
  const short = b.data && b.data.thought != null;
  const conf = short ? (b.data.thought + (b.data.thoughtCut ? ' …' : '')).trim() : (e.confessional || '').trim();
  // bottom row: top suspect (what the number means depends on the role), the action, the marks
  const rowY = L.wide ? 770 : 1510, rowH = L.wide ? 280 : 370;
  const ts = e._top_suspect;
  let pol = null, pctBox = null, pctNum = null, bar = null, sus = null, actEl = null;
  let x = tx;
  if (ts && ts.name) {
    const sw = L.wide ? 210 : 230;
    pol = box(root, x, rowY, sw, sw * 1.2, 'polaroid anim bx');
    pol.dataset.bx = 'polaroid';
    const polIn = div(pol, 'pol-in'); sus = mountChar(polIn, ts.name, { expr: 'suspicious' }); sus.el.style.inset = '0';
    pol.insertAdjacentHTML('beforeend', `<div class="pol-n" style="color:${shade(acc(ts.name), .55)}">${nm(ts.name)}</div>`);
    const read = ts.kind === 'table_read';
    const kLbl = read ? 'THE CREW\'S TOP SUSPECT' : 'TOP SUSPECT';
    const sub = read ? `${nm(who)} reads the crew as <b style="color:${acc(ts.name)}">${Math.round(Number(ts.pct) || 0)}%</b> sure about <b style="color:${acc(ts.name)}">${nm(ts.name)}</b>`
      : `${nm(who)} is <b style="color:${acc(ts.name)}">${Math.round(Number(ts.pct) || 0)}%</b> sure <b style="color:${acc(ts.name)}">${nm(ts.name)}</b> is a mole`;
    const pw2 = L.wide ? 270 : 300;
    pctBox = box(root, x + sw + 44, rowY + 6, pw2, rowH - 10, 'pct anim bx', `<div class="pct-k">${kLbl}</div><div class="pct-v"><span class="num">0</span>%</div><div class="pct-bar" style="width:${pw2 - 20}px"><i></i></div><div class="pct-n">${sub}</div>`);
    pctBox.dataset.bx = 'suspect';
    pctNum = pctBox.querySelector('.num'); bar = pctBox.querySelector('.pct-bar i');
    x += sw + 44 + pw2 + 24;
  }
  let actHtml = '';
  if (tp === 'clue') actHtml = act.whisper_with && act.whisper_with !== 'none' ? `ASKS TO WHISPER WITH<b style="color:${acc(act.whisper_with)}">${nm(act.whisper_with)}</b>` : (act.whisper_with === 'none' ? 'ASKS FOR<b>NO WHISPER</b>' : '');
  else if (tp === 'job') actHtml = `ON THE JOB, CHOOSES<b class="${act.choice === 'sabotage' ? 'sab' : 'help'}">${act.choice === 'sabotage' ? 'SABOTAGE' : 'HELP'}</b>`;
  else if (tp === 'cut_vote' && act.finalist) actHtml = `SENDS TO THE FINAL<b style="color:${acc(act.finalist)}">${nm(act.finalist)}</b>`;
  else if (tp === 'finale_choice' && act.choice) actHtml = `CHOOSES<b class="${act.choice === 'steal' ? 'sab' : 'help'}">${esc(String(act.choice).toUpperCase())}</b>`;
  else if (tp === 'vote' && act.vote) actHtml = `VOTED FOR<b style="color:${acc(act.vote)}">${nm(act.vote)}</b>`;
  const marks = (e._marks || []).filter(mk => mk[0] === 'lie' || mk[0] === 'card_fake' || mk[0] === 'job_false');
  const rightW = (tx + tw) - x;
  if (actHtml) {
    const aw = marks.length ? Math.min(rightW, L.wide ? 360 : 440) : rightW;
    actEl = box(root, x, rowY, aw, L.wide ? 110 : 120, 'actcard anim bx', actHtml, `--ac:${acc(who)}`);
    actEl.dataset.bx = 'action';
    const bEl = actEl.querySelector('b'); if (bEl) bEl.style.fontSize = (L.wide ? 38 : 40) + 'px';
  }
  let marksEl = null;
  if (marks.length) {
    let mx = x, my = rowY, mw = rightW, mh = rowH;
    if (actEl) { if (rightW - (L.wide ? 360 : 440) > 300) { mx = x + (L.wide ? 380 : 460); mw = rightW - (L.wide ? 380 : 460); } else { my = rowY + (L.wide ? 124 : 134); mh = rowH - (L.wide ? 124 : 134); } }
    if (mw < 320 && !ts) { mx = tx; mw = tw; }
    marksEl = box(root, mx, my, mw, mh, 'marks anim bx');
    marksEl.dataset.bx = 'marks';
    marks.slice(0, 4).forEach(mk => {
      const k = mk[0] === 'lie' ? 'LIE' : mk[0] === 'card_fake' ? 'FAKE CARD' : 'FALSE JOB CLAIM';
      const txt = mk[0] === 'card_fake' ? `"${mk[1]}"${mk[2] ? ' (' + mk[2] + ')' : ''}` : mk[1];
      div(marksEl, 'mark anim', '', `<b>${k}</b><span>${esc(txt)}</span>`);
    });
    if (!fitText(marksEl, L.wide ? 22 : 24, 13, 'marks')) ctx.over('diary marks');
  }
  const iris = box(root, 0, 0, W, H, 'iris', null, '');

  // ---- timeline
  tl.set(iris, { o: 1 }); tl.tw(iris, 0, 380, { o: [1, 0] }, 'lin');
  tl.set(cam, { s: 1.05 }); tl.tw(cam, 0, 900, { s: [1.05, 1] }, 'out');
  tl.effect(0, 600000, () => { rec.classList.toggle('dim', Math.floor(performance.now() / 700) % 2 === 1); }, 'motion');
  tl.set(panel, { o: 0 }); tl.tw(panel, 300, 160, { o: [0, 1] }, 'lin'); tl.tw(panel, 300, 380, { x: [L.wide ? 80 : 0, 0], y: [L.wide ? 0 : 60, 0] }, 'out5');
  exprAt(tl, 600, me.c, 'talk');
  const t0 = 700, cps = 34;
  let dur = 0;
  if (conf) {
    dur = tl.type(tText, t0, [{ text: conf }], { cps, char: me.c, pitch: 260 });
    if (!fitText(tText, short ? (L.wide ? 50 : 56) : (L.wide ? 38 : 44), L.wide ? 20 : 22, 'thought')) ctx.over('thought');
  } else { tText.classList.add('silent'); tText.classList.remove('typed'); tText.textContent = '(nothing)'; tText.style.fontSize = '36px'; }
  const tEnd = t0 + Math.min(dur, 6000) * .5 + 400;
  exprAt(tl, t0 + dur + 200, me.c, roleOf(who) === 'mole' ? 'smug' : 'thinking');
  if (pol) {
    tl.set(pol, { o: 0, r: -5 }); tl.tw(pol, tEnd, 100, { o: [0, 1] }, 'lin'); tl.tw(pol, tEnd, 380, { y: [-120, 0], r: [-18, -5] }, 'back'); tl.cue(tEnd + 200, 'pop');
    fadeIn(tl, pctBox, tEnd + 250, 200); countUp(tl, pctNum, tEnd + 250, 500, 0, Math.round(Number(ts.pct) || 0));
    const p = Math.max(0, Math.min(100, Number(ts.pct) || 0)) / 100;
    tl.effect(tEnd + 250, 500, q => { bar.style.transform = `scaleX(${(EASE.out(q) * p).toFixed(3)})`; });
  }
  if (actEl) popIn(tl, actEl, tEnd + 400, 30, 300);
  if (marksEl) { Array.from(marksEl.children).forEach((el, i) => { slamIn(tl, el, tEnd + 800 + i * 360, 1.25, 160); tl.cue(tEnd + 880 + i * 360, 'thud'); }); }
  tl.hold(Math.max(t0 + dur, tEnd + 900 + (marksEl ? marksEl.children.length * 360 : 0)) + 600);
  return tl;
};

/* ---------------------------------------------------------------- WHISPER ------- */
SCENES.whisper = ctx => {
  const { root, L, b, events } = ctx, e = b.ev, tl = new Timeline();
  const W = L.W, H = L.H, a = e.player, bb = e.partner || '?';
  // the pair's conversation this round so far, ending with this turn
  const lines = [];
  for (let i = 0; i <= b.i && i < events.length; i++) {
    const x = events[i];
    if (!x || x.type !== 'turn' || x.turn_phase !== 'whisper' || x.round !== e.round) continue;
    const pair = [x.player, x.partner];
    if (pair.includes(a) && pair.includes(bb)) lines.push(x);
  }
  const shown = lines.slice(-4);
  const left = shown.length ? shown[0].player : a, right = left === a ? bb : a;
  const cam = div(root, 'layer anim');
  const split = L.wide ? `0,0 ${W / 2 + 90},0 ${W / 2 - 90},${H} 0,${H}` : `0,0 ${W},0 ${W},560 0,700`;
  const split2 = L.wide ? `${W / 2 + 90},0 ${W},0 ${W},${H} ${W / 2 - 90},${H}` : `0,700 ${W},560 ${W},${H} 0,${H}`;
  svgEl(cam, W, H, `<defs><radialGradient id="wa" cx="${L.wide ? 20 : 25}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(left), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>
    <radialGradient id="wb" cx="${L.wide ? 80 : 75}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(right), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>
    <pattern id="wgrid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(120,190,255,.06)"/></pattern></defs>
    <polygon points="${split}" fill="url(#wa)"/><polygon points="${split2}" fill="url(#wb)"/><rect width="${W}" height="${H}" fill="url(#wgrid)"/>`);
  const pw = L.wide ? 600 : 500, py = L.wide ? 330 : 300;
  const pa = person(cam, left, L.wide ? 20 : -10, py, pw, { expr: 'talk' });
  const pb = person(cam, right, L.wide ? W - 20 - pw : W - pw + 10, py, pw, { expr: 'thinking', flip: true });
  const hd = div(root, 'abs whead anim', L.wide ? 'left:560px;right:560px;top:128px;' : 'left:0;right:0;top:170px;',
    `<div class="wh-k"><svg viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg> WHISPER · ROUND ${esc(e.round)}</div><div class="wh-n"><span style="color:${acc(left)}">${nm(left)}</span><em>↔</em><span style="color:${acc(right)}">${nm(right)}</span></div>`);
  const colX = L.wide ? 560 : 40, colY = L.wide ? 260 : py + pw * 1.1 - 10, colW = L.wide ? 800 : 1000, colH = L.wide ? 760 : H - (py + pw * 1.1 - 10) - 90;
  const col = box(root, colX, colY, colW, colH, 'wcol bx');
  col.dataset.bx = 'whisper lines';
  const bubbles = shown.map(x => {
    const isL = x.player === left;
    const lie = (x._marks || []).some(mk => mk[0] === 'lie' || mk[0] === 'card_fake' || mk[0] === 'job_false');
    const el = div(col, 'wb anim' + (isL ? ' l' : ' r'), `--ac:${acc(x.player)}`);
    el.innerHTML = `<div class="wb-n">${nm(x.player)}${lie ? '<span class="wlie">LIE</span>' : ''}</div>`;
    const t = div(el, 'wb-t typed');
    const fake = (x._marks || []).filter(mk => mk[0] === 'card_fake').map(mk => mk[1]);
    (x._cards || []).slice(0, 2).forEach(c => el.insertAdjacentHTML('beforeend', `<div class="wb-c"><b class="${fake.includes(c) ? 'fk' : ''}">${fake.includes(c) ? 'FAKE CARD' : 'CARD'}</b>${esc(c)}</div>`));
    return { el, t, x, text: (x.public || '').trim() || '(says nothing)' };
  });
  bubbles.forEach(B => renderTyped(B.t, [{ text: B.text }], B.text.length));
  if (!fitText(col, L.wide ? 29 : 34, 15, 'whisper')) ctx.over('whisper');
  const foot = div(root, 'abs wfoot', 'left:0;right:0;bottom:30px;', `AUDIENCE ONLY · the table sees <b>${nm(left)}</b> and <b>${nm(right)}</b> whispering, never the words`);
  // ---- timeline
  slideIn(tl, pa.wrap, 0, -300, 0, 420, 'out5'); slideIn(tl, pb.wrap, 60, 300, 0, 420, 'out5');
  tl.tw(pa.wrap, 420, 500, { r: [0, 2.5] }, 'inout'); tl.tw(pb.wrap, 480, 500, { r: [0, -2.5] }, 'inout');
  fadeIn(tl, hd, 200, 250); fadeIn(tl, foot, 600, 300);
  let t = 500, tEnd = 500;
  bubbles.forEach((B, i) => {
    const cur = i === bubbles.length - 1;
    const speaker = B.x.player === left ? pa : pb, other = B.x.player === left ? pb : pa;
    if (!cur) { fadeIn(tl, B.el, 300 + i * 80, 200); return; }
    popIn(tl, B.el, t, 24, 300); tl.cue(t, 'pop');
    exprAt(tl, t, speaker.c, 'talk'); exprAt(tl, t, other.c, 'thinking');
    const d = tl.type(B.t, t + 150, [{ text: B.text }], { cps: 34, char: speaker.c, pitch: 220 });
    tEnd = t + 150 + d;
    exprAt(tl, tEnd + 200, speaker.c, 'smug'); exprAt(tl, tEnd + 200, other.c, 'suspicious');
  });
  tl.hold(tEnd + 800);
  return tl;
};

/* ---------------------------------------------------------------- WHISPER PAIRS -- */
SCENES.pairs = ctx => {
  const { root, L, b, aud } = ctx, tl = new Timeline(), pairs = (b.data.pairs || []).slice(0, 4), w = b.w;
  const W = L.W, H = L.H, k = pairs.length;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, { lamp: false, decor: 'none', wallHi: '#161c46', wall: '#080c22' }));
  const hd = anchor(root, W / 2, L.wide ? 170 : 210, `<div class="whead"><div class="wh-k">WHISPERS · ROUND ${esc(w.round)}</div><div class="wh-n" style="font-size:${L.wide ? 58 : 54}px">${plural(k, 'PAIR')} WHISPER</div></div>`, 'anim');
  const top = L.wide ? 250 : 300, bottom = L.wide ? 990 : 1820, gap = L.wide ? 30 : 24;
  const panels = pairs.map((p, i) => {
    let x, y, pwid, phei;
    if (L.wide) { pwid = Math.min(900, (W - 80 - (k - 1) * gap) / k); phei = bottom - top; x = (W - (k * pwid + (k - 1) * gap)) / 2 + i * (pwid + gap); y = top; }
    else { pwid = W - 80; phei = Math.min(700, (bottom - top - (k - 1) * gap) / k); x = 40; y = top + ((bottom - top) - (k * phei + (k - 1) * gap)) / 2 + i * (phei + gap); }
    const pan = box(root, x, y, pwid, phei, 'wpanel anim bx');
    pan.dataset.bx = 'pair panel ' + i;
    const cwid = Math.min(pwid * .62, (phei - 70) / 1.1, 470);
    const yy = phei - cwid * 1.1 - 58;
    const A = person(pan, p[0], pwid / 2 - cwid * .86, yy, cwid, { expr: 'talk' });
    const B2 = person(pan, p[1], pwid / 2 - cwid * .14, yy, cwid, { expr: 'thinking', flip: true });
    const lbl = div(pan, 'wp-n', `font-size:${Math.min(34, cwid / 6.5)}px`, `<span style="color:${acc(p[0])}">${nm(p[0])}</span><em>↔</em><span style="color:${acc(p[1])}">${nm(p[1])}</span>`);
    const dots = anchor(pan, pwid / 2, Math.max(36, yy + cwid * .08), `<div class="wp-b"><span class="wdots"><i></i><i></i><i></i></span></div>`, 'anim');
    return { pan, A, B: B2, dots, lbl };
  });
  const foot = div(root, 'abs wfoot', 'left:0;right:0;bottom:' + (L.wide ? 34 : 40) + 'px;', aud ? 'The table sees who whispers, never what. The audience hears every word next.' : 'TABLE VIEW · you see who whispers, never what');
  fadeIn(tl, hd, 100, 250);
  panels.forEach((P, i) => {
    popIn(tl, P.pan, 200 + i * 200, 40, 360);
    tl.tw(P.A.wrap, 700 + i * 200, 500, { r: [0, 3] }, 'inout'); tl.tw(P.B.wrap, 700 + i * 200, 500, { r: [0, -3] }, 'inout');
    popIn(tl, P.dots, 900 + i * 200, 10, 260); tl.cue(900 + i * 200, 'pop');
    tl.effect(900 + i * 200, 4000, q => P.A.c.mouth(q >= 1 ? 'rest' : ['b', 'a', 'c', 'a'][Math.floor(q * 40) % 4]), 'motion');
  });
  fadeIn(tl, foot, 900, 300);
  tl.hold(1200 + k * 200 + 800);
  return tl;
};

/* ---------------------------------------------------------------- JOB REVEAL ---- */
SCENES.job = ctx => {
  const { root, L, b, w, aud } = ctx, d = b.data, tl = new Timeline();
  const W = L.W, H = L.H;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 640 : 900 }, ROOMS.jobreveal)));
  const team = (d.team || []).slice(0, 4), n = team.length || 1;
  const leader = w.leader;
  const title = anchor(root, W / 2, L.wide ? 168 : 250, `<div class="jobtitle"><div class="jt-k">ROUND ${esc(w.round)} · THE JOB</div><div class="jt-n" style="font-size:${L.wide ? 76 : 66}px">${esc(w.jobName || 'The job')}</div><div class="jt-l">LEADER <b style="color:${acc(leader)}">${nm(leader)}</b> · TEAM OF ${team.length}</div></div>`, 'anim');
  const pw = L.wide ? 360 : 300, gap = L.wide ? 470 : 340;
  const x0 = W / 2 - gap * (n - 1) / 2, py = L.wide ? 250 : 400;
  svgEl(cam, W, H, `<defs><radialGradient id="jsp"><stop offset="0" stop-color="#fff2cf" stop-opacity=".3"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient></defs>` + team.map((nm2, i) => `<ellipse cx="${x0 + i * gap}" cy="${py + pw * .5}" rx="${pw * .62}" ry="${pw * .62}" fill="url(#jsp)"/>`).join(''));
  const cardsShown = aud && d.choices;
  const people = team.map((name, i) => {
    const x = x0 + i * gap;
    const p = person(cam, name, x - pw / 2, py, pw, { expr: 'nervous' });
    const mdl = aud ? modelOf(name) : '';
    const plate = anchor(cam, x, py + pw * 1.1 - 4, plateHTML(name, { fs: L.wide ? 32 : 28, w: L.wide ? 230 : 210, model: mdl, role: aud ? roleOf(name) : null }), 'anim');
    plate.firstChild.firstChild.classList.add('bx'); plate.firstChild.firstChild.dataset.bx = 'plate ' + name;
    plate.firstChild.style.transform = 'translate(-50%, 0)';
    const choice = cardsShown ? d.choices[name] : null;
    const cw = L.wide ? 210 : 230, ch = L.wide ? 230 : 290, cy = L.wide ? 760 : 1010;
    let card = null;
    if (cardsShown) {
      const front = choice === 'sabotage'
        ? `<div class="cardface sab"><svg viewBox="0 0 100 100" width="50%"><path d="M10 30h30l10 14 10-14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M10 70h30l10-14 10 14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg><div>SABOTAGE</div></div>`
        : `<div class="cardface help"><svg viewBox="0 0 100 100" width="46%"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="8"/><path d="M28 52l15 15 30-32" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div>HELP</div></div>`;
      card = flipCard(root, x - cw / 2, cy, cw, ch, CARD_BACK, front);
    }
    return Object.assign(p, { name, x, plate, card, choice });
  });
  // table view: one card with the count, the only thing the table learns
  let countCard = null;
  if (!cardsShown) {
    const cw = L.wide ? 300 : 320, ch = L.wide ? 230 : 280;
    countCard = flipCard(root, W / 2 - cw / 2, L.wide ? 760 : 1010, cw, ch, CARD_BACK, `<div class="cardface count"><small>SABOTAGES</small><div class="cf-big">${esc(d.sabotages)}</div></div>`);
  }
  // alarm: two light beams as composited layers turned by transform (no repaint per frame), a red tint faded by opacity
  const alarm = div(root, 'layer anim', 'pointer-events:none;');
  const beam = (left) => box(alarm, left ? 0 : W - W * 1.6, -260, W * 1.6, 520, 'anim', null,
    `transform-origin:${left ? '0' : '100%'} 50%;clip-path:polygon(${left ? '0 50%,100% 0,100% 100%' : '100% 50%,0 0,0 100%'});background:radial-gradient(ellipse at ${left ? '0%' : '100%'} 50%, rgba(255,90,42,.45), rgba(255,90,42,0) 70%);`);
  const bA = beam(true), bB = beam(false);
  alarm.style.opacity = '0';
  const red = box(root, 0, 0, W, H, 'alarmtint anim', null, 'opacity:0;');
  const flash = box(root, 0, 0, W, H, 'flash anim', null, 'background:#fff;opacity:0;');
  const verdict = anchor(root, W / 2, L.wide ? 170 : 250, `<div class="stamp ${d.blown ? 'amber' : 'mint'} big" style="font-size:${L.wide ? 150 : 130}px;transform:rotate(-6deg)">JOB ${d.blown ? 'BLOWN' : 'CLEAN'}</div>`, 'anim');
  const sub = anchor(root, W / 2, L.wide ? 1036 : 1360, `<div class="verdict-sub ${d.blown ? 'a' : 'm'}" style="font-size:${L.wide ? 24 : 28}px">${d.blown ? `${plural(d.sabotages, 'SABOTAGE')} · BLOWN ${w.blown}/${w.sabTarget || '?'}` : `NO SABOTAGE · CLEAN ${w.clean}/${w.cleanTarget || '?'}`}</div>`, 'anim');
  let score = null;
  if (!L.wide) score = jobBoard(root, 90, 1440, 900, 400, w);

  // ---- timeline
  slamIn(tl, title, 0, 1.5, 200); tl.cue(60, 'thud');
  people.forEach((p, i) => {
    tl.set(p.wrap, { o: 0 }); tl.tw(p.wrap, 220 + i * 140, 100, { o: [0, 1] }, 'lin'); tl.tw(p.wrap, 220 + i * 140, 420, { y: [260, 0] }, 'out5');
    slideIn(tl, p.plate, 420 + i * 140, 0, 30, 300, 'back');
    if (p.card) { tl.set(p.card.flipper, { ry: 180 }); tl.set(p.card.wrap, { o: 0 }); tl.tw(p.card.wrap, 650 + i * 120, 80, { o: [0, 1] }, 'lin'); tl.tw(p.card.wrap, 650 + i * 120, 380, { y: [420, 0], r: [-20 + i * 14, 0] }, 'out5'); tl.cue(650 + i * 120, 'whoosh'); }
  });
  if (countCard) { tl.set(countCard.flipper, { ry: 180 }); slideIn(tl, countCard.wrap, 700, 0, 400, 380, 'out5'); tl.cue(700, 'whoosh'); }
  let t = 1700;
  if (cardsShown) {
    people.forEach(p => {
      tl.tw(p.card.flipper, t, 340, { ry: [180, 0] }, 'out'); tl.tw(p.card.wrap, t, 340, { y: [0, -20], s: [1, 1.05] }, 'back'); tl.cue(t, 'flip');
      if (p.choice === 'sabotage') { tl.cue(t + 200, 'thud'); shakeFx(tl, cam, t + 220, 200, 8); }
      t += 680;
    });
  } else { t += 400; tl.tw(countCard.flipper, t, 380, { ry: [180, 0] }, 'out'); tl.tw(countCard.wrap, t, 380, { s: [1, 1.08] }, 'back'); tl.cue(t, 'flip'); t += 700; }
  t += 420;
  tl.tw(title, t - 120, 160, { o: [1, 0], s: [1, .9] }, 'lin');
  slamIn(tl, verdict, t, 3, 180); tl.cue(t + 130, 'thud');
  slideIn(tl, sub, t + 450, 0, 40, 300, 'back');
  if (d.blown) {
    tl.cue(t + 160, 'alarm'); shakeFx(tl, cam, t + 160, 460, 20); flashFx(tl, flash, t + 160, 260, .35);
    tl.set(alarm, { o: 0 }); tl.tw(alarm, t + 160, 200, { o: [0, 1] }, 'lin');
    tl.effect(t + 160, 3000, p => { const a = Math.sin(p * Math.PI * 3) * 38 + 30; bA.style.transform = `rotate(${a.toFixed(1)}deg)`; bB.style.transform = `rotate(${(-a).toFixed(1)}deg)`; }, 'motion');
    tl.effect(t + 160, 3000, p => { red.style.opacity = (p >= 1 ? 0.1 : (0.1 + 0.14 * Math.max(0, Math.sin(p * Math.PI * 3)))).toFixed(3); }, 'flash');
    people.forEach(p => exprAt(tl, t + 300, p.c, p.choice === 'sabotage' ? 'smug' : 'shocked'));
  } else {
    tl.cue(t + 160, 'clean'); flashFx(tl, flash, t + 160, 300, .25);
    people.forEach(p => exprAt(tl, t + 300, p.c, 'pleased'));
  }
  if (score) {
    fadeIn(tl, score.board, 400, 300);
    const newSlot = score.slots.find(s => +s.dataset.row === (d.blown ? 1 : 0) && +s.dataset.i === (d.blown ? w.blown : w.clean) - 1);
    if (newSlot) { tl.set(newSlot, { o: 0 }); tl.tw(newSlot, t + 900, 80, { o: [0, 1] }, 'lin'); tl.tw(newSlot, t + 900, 420, { y: [-600, 0], r: [-25, 0], s: [1.5, 1] }, 'out5'); tl.cue(t + 1200, 'thud'); }
  }
  tl.hold(t + 2800);
  return tl;
};

/* ---------------------------------------------------------------- VOTE / OUT / CUT */
// mode: votes (cards flip, everyone points, arrows and tally), out (the reveal), cut (finalists)
SCENES.vote = (ctx, mode) => {
  const { root, L, b, aud } = ctx, d = b.data, tl = new Timeline(), w = b.w;
  const W = L.W, H = L.H;
  const votes = d.votes || {}, tally = d.tally || {};
  // who is in the lineup: the voters (alive before the result), in seat order
  let line = (w.seats || []).filter(n => votes[n] != null || tally[n] != null);
  if (mode === 'out' && d.name && !line.includes(d.name)) line.push(d.name);
  if (!line.length) line = (w.alive || []).slice();
  const n = line.length;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 760 : 1260 }, mode === 'cut' ? ROOMS.title : ROOMS.vote)));
  const pos = {};
  let pw;
  if (L.wide) {
    const sp = Math.min(400, 1760 / n); pw = Math.min(300, sp * .86);
    const vy = 700 - pw * 1.1;
    line.forEach((nm2, i) => { pos[nm2] = { x: W / 2 + (i - (n - 1) / 2) * sp, y: vy }; });
  } else {
    pw = n > 7 ? 170 : n > 5 ? 196 : 240;
    const R = 372, c0 = { x: W / 2, y: 780 };
    line.forEach((nm2, i) => { const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / n; pos[nm2] = { x: c0.x + R * Math.cos(a), y: c0.y + R * Math.sin(a) - pw * .55, a }; });
  }
  const people = {};
  line.forEach(nm2 => {
    const { x, y } = pos[nm2];
    const outAlready = mode !== 'out' && w.out[nm2] && !votes[nm2];
    const p = person(cam, nm2, x - pw / 2, y, pw, { expr: outAlready ? 'eliminated' : 'neutral' });
    const plateY = L.wide ? y + pw * 1.1 - 6 : y + pw * 1.1 - 4;
    const tag = anchor(cam, x, plateY, `<div class="plate" style="--ac:${acc(nm2)};font-size:${L.wide ? 26 : 22}px;min-width:${pw * .78}px">${nm(nm2)}</div>`, 'anim');
    tag.firstChild.style.transform = 'translate(-50%, 0)';
    tag.firstChild.firstChild.classList.add('bx'); tag.firstChild.firstChild.dataset.bx = 'name ' + nm2;
    people[nm2] = Object.assign(p, { x, y, tag });
  });
  // vote cards: under each voter (wide); in a grid in the bottom third (tall)
  const voters = line.filter(v => votes[v] != null);
  const cards = {};
  voters.forEach((v, i) => {
    const tgt = votes[v];
    const front = `<div class="vface" style="--ac:${acc(tgt)}"><div class="vf-k">${nm(v)} ${mode === 'cut' ? 'SENDS' : 'VOTES'}</div><div class="vf-n" style="font-size:${L.wide ? 34 : 38}px">${nm(tgt)}</div></div>`;
    let cx, cy, cw, ch;

      const sub = voteTurn ? `${plural(before.length + fresh.length, 'vote')} in` : (w.pass ? 'PASS ' + esc(w.pass) : '');
      const ttl = anchor(root, W / 2, zone.top + gap / 2 - 6, `<div class="bigtitle" style="opacity:.9"><div class="bt-k">ROUND ${esc(w.round)}</div><div class="bt-n" style="font-size:${Math.round(clamp(gap * .36, 60, wide ? 96 : 112))}px">${ph}</div><div class="bt-s">${sub}</div></div>`, 'anim');
      mark(root, ttl.firstChild.firstChild, 'phase title');
    }
    tl.set(B.g, { o: 0 }); tl.tw(B.g, 160, 120, { o: [0, 1] }, 'lin'); tl.tw(B.g, 160, 300, { s: [.7, 1] }, 'back'); tl.cue(180, 'pop');
    const t0 = 600, cps = 32;
    const dur = pub ? tl.type(B.tx, t0, segs, { cps, char: sp && sp.c, pitch: 300 + (NAMES.indexOf(castOf(who).name) % 5) * 60 }) : 0;
    const at = s => { const m = new RegExp('\\b' + escRe(s) + '\\b').exec(pub); return m ? t0 + (RM ? 0 : m.index / cps * 1000) : null; };
    // players named in the statement look up as their name is said
    st.PS.forEach(p => {
      if (p.gone || p.name === who || p.name === target) return;
      const tm = at(p.name);
      if (tm != null) tl.tw(p.plate, tm, 320, { y: [-16, 0] }, 'back');
    });
    // the accusation or the vote: an arrow across the table, a chip on the target's seat
    let tAcc = null;
    if (target && arcsF[0]) {
      const a = arcsF[0], T = S[target];
      tAcc = Math.max(t0 + 200, at(target) ?? (t0 + dur * .4));
      tl.at(tAcc, () => point(who, target));
      sweepArc(tl, arcEl('f0'), tAcc, 340); tl.cue(tAcc, 'whoosh');
      const hit = tAcc + 300;
      if (prev && !renew) {                       // the speaker has moved their accusation: the old one comes off
        const k = before.findIndex(p => p[0] === who), old = k >= 0 ? arcEl('b' + k) : null, oc = chipsB[who];
        heatTo(prev, tAcc, cntB[prev] || 0, cntA[prev] || 0);
        if (old) tl.effect(tAcc, 240, q => { old.style.opacity = (.42 * (1 - q)).toFixed(3); });
        if (oc) { tl.tw(oc, tAcc, 200, { o: [1, 0], s: [1, .4] }, 'lin'); tl.at(tAcc + 210, () => { oc.style.display = 'none'; }); }
      }
      if (renew) {
        const k = before.findIndex(p => p[0] === who), old = k >= 0 ? arcEl('b' + k) : null, oc = chipsB[who];
        if (old) tl.at(hit, () => { old.style.visibility = 'hidden'; });
        if (oc) tl.tw(oc, hit, 320, { s: [1.7, 1] }, 'back');
      } else {
        const c = st.chip(target, who, kind);
        if (c) { tl.set(c, { o: 0 }); tl.tw(c, hit, 60, { o: [0, 1] }, 'lin'); tl.tw(c, hit, 320, { s: [2.4, 1] }, 'back'); }
      }
      tl.cue(hit, 'thud');
      heatTo(target, hit, cntB[target] || 0, cntA[target] || 0);
      tl.at(hit, () => st.lit(target, true));
      if (T.wrap) tl.tw(T.wrap, hit, 360, { s: [1.14, 1] }, 'back');
      exprAt(tl, hit, T.c, 'shocked'); exprAt(tl, hit + 1400, T.c, voteTurn || (cntA[target] || 0) >= 2 ? 'nervous' : 'suspicious');
      shakeFx(tl, st.cam, hit, 300, 9);
      const verb = voteTurn ? 'VOTES FOR' : tp === 'final_accuse' ? 'NAMES' : 'ACCUSES';
      const tag = anchor(st.fx, clamp(a.mx, 190, W - 190), a.my + 8, `<div class="arw-tag bx" data-bx="arrow tag" style="--ac:${ac};font-size:${wide ? 15 : 17}px"><b style="color:${ac}">${nm(who)}</b> ${verb} <b style="color:${acc(target)}">${nm(target)}</b></div>`, 'anim');
      tag.firstChild.style.transform = 'translate(-50%, 0)';
      tl.set(tag, { o: 0 }); tl.tw(tag, hit, 80, { o: [0, 1] }, 'lin'); tl.tw(tag, hit, 300, { s: [1.5, 1] }, 'back');
      exprAt(tl, t0 + dur + 300, sp && sp.c, 'suspicious');
    } else exprAt(tl, t0 + dur + 300, sp && sp.c, 'thinking');
    // tabled clue cards, with FAKE CARD / REAL stamps in the audience view
    const cardMarks = marks.filter(m => m[0] === 'card_real' || m[0] === 'card_fake');
    const cards = cardTexts.map((txt, i) => {
      let x, y, host;
      if (wide) { host = root; x = cardsLeft ? B.x - cardW - 16 : B.x + B.w + 16; y = zone.bottom - (i + 1) * cardH - i * 12; }
      else { host = st.fx; const m = cardTexts.length; x = W / 2 - (m * cardW + (m - 1) * 20) / 2 + i * (cardW + 20); y = 1470; }
      const card = box(host, x, y, cardW, cardH, 'tcard anim bx', `<div class="tc-h"><b>CLUE CARD</b><span>tabled by ${nm(who)}</span></div>`);
      card.dataset.bx = 'clue card ' + i;
      const ct = div(card, 'tc-t'); ct.textContent = txt;
      fitText(ct, wide ? 25 : 30, 14, 'clue card');
      const fake = aud && cardMarks.some(m => m[0] === 'card_fake' && m[1] === txt);
      let stamp = null;
      if (fake) stamp = anchor(host, x + cardW / 2, y + cardH * .62, `<div class="stamp amber" style="font-size:${wide ? 42 : 50}px;transform:rotate(-10deg)">FAKE CARD</div>`, 'anim');
      else if (aud && cardMarks.some(m => m[0] === 'card_real' && m[1] === txt)) stamp = anchor(host, x + cardW - 52, y + cardH - 24, `<div class="stamp mint" style="font-size:${wide ? 20 : 24}px;transform:rotate(-8deg)">REAL</div>`, 'anim');
      return { card, stamp, fake, r: (i ? 2 : -2) * (wide ? .6 : 1) };
    });
    if ((e._cards || []).length > 2 && cards[1]) cards[1].card.insertAdjacentHTML('beforeend', `<div class="tc-more">+${e._cards.length - 2} more</div>`);
    const tCards = t0 + Math.min(dur * .35, 2500);
    cards.forEach((c, i) => {
      tl.set(c.card, { o: 0, r: c.r }); tl.tw(c.card, tCards + i * 250, 100, { o: [0, 1] }, 'lin');
      tl.tw(c.card, tCards + i * 250, 420, wide ? { x: [cardsLeft ? -300 : 300, 0], r: [c.r * 6, c.r] } : { y: [-260, 0], r: [c.r * 6, c.r] }, 'out5'); tl.cue(tCards + i * 250, 'whoosh');
    });
    const tEnd = Math.max(t0 + dur + 400, tAcc == null ? 0 : tAcc + 900);
    let tLast = tEnd;
    cards.forEach((c, i) => {
      if (!c.stamp) return;
      const ts = tEnd + i * 450;
      slamIn(tl, c.stamp, ts, 3, 170); tl.cue(ts + 120, 'thud');
      if (c.fake) { shakeFx(tl, st.cam, ts + 150, 340, 14); exprAt(tl, ts + 200, sp && sp.c, 'smug'); }
      tLast = ts + 300;
    });
    const jf = marks.find(m => m[0] === 'job_false');
    if (aud && (lies.length || jf || cards.some(c => c.fake))) {
      const lieTab = anchor(root, B.x + B.w - (wide ? 96 : 110), B.y + B.h - 4, `<div class="stamp solid-amber" style="font-size:${wide ? 38 : 46}px;transform:rotate(-6deg)">${jf && !lies.length && !cards.some(c => c.fake) ? 'FALSE CLAIM' : 'LIE'}</div>`, 'anim');
      slamIn(tl, lieTab, tLast + 300, 2.2, 160); tl.cue(tLast + 400, 'thud'); flashFx(tl, mkFlash(), tLast + 320, 260, .25); tLast += 700;
    }
    tl.hold(tLast + 700);
    return tl;
  }

  /* ------------------------------------------------------------ the count, and the vote-out */
  const tally = d.tally || {};
  const tallies = {};
  Object.keys(tally).forEach(t2 => {
    const P = S[t2]; if (!tally[t2] || !P) return;
    tallies[t2] = anchor(st.fx, wide ? P.x + P.pw * .36 : P.x, wide ? P.top + P.pw * .3 : P.top - 4, `<div class="tally" style="--ac:${acc(t2)};transform:scale(${wide ? .82 : .7})"><span>${mode === 'votes' ? 0 : esc(tally[t2])}</span></div>`, 'anim');
    tallies[t2].style.zIndex = 3;
  });
  if (mode === 'votes') {
    const order = Object.keys(tally).filter(k => tally[k]).sort((p, q) => tally[q] - tally[p]);
    const title = anchor(root, W / 2, wide ? 262 : 470, `<div class="bigtitle"><div class="bt-k">ROUND ${esc(w.round)}</div><div class="bt-n" style="font-size:${wide ? 112 : 120}px">THE VOTE</div><div class="bt-s vline" style="max-width:${W - 100}px">${order.map(k => `<span class="vt" data-n="${esc(k)}"><b style="color:${S[k] ? acc(k) : '#dcefff'}">${nm(k)}</b> <i>0</i></span>`).join('') || '&nbsp;'}</div></div>`, 'anim');
    mark(root, title.firstChild.firstChild, 'vote title');
    slamIn(tl, title, 150, 2.2, 220); tl.cue(210, 'thud');
    const line = {};
    title.querySelectorAll('.vt').forEach(el => { line[el.dataset.n] = el; el.style.visibility = 'hidden'; });
    let t = 1100;
    const count = {};
    const cast = Object.keys(d.votes || {}).filter(v => S[v] && d.votes[v] != null).map(v => [v, d.votes[v]]).sort(seatOrder);
    cast.forEach(([v, tg], i) => {
      const at = t + i * 460, hit = at + 300;
      if (!S[tg] || tg === v) {                      // not a seat: only the count moves
        const n3 = count[tg] = (count[tg] || 0) + 1, ln3 = line[tg];
        tl.at(hit, () => { if (ln3) { ln3.style.visibility = 'visible'; ln3.querySelector('i').textContent = n3; } });
        tl.cue(hit, 'tick');
        return;
      }
      tl.at(at, () => point(v, tg));
      exprAt(tl, at + 900, S[v].c, 'suspicious');
      sweepArc(tl, arcEl('f' + arcsF.findIndex(a => a.from === v)), at, 320);
      const c = st.chip(tg, v, 'ballot');
      if (c) { tl.set(c, { o: 0 }); tl.tw(c, hit, 60, { o: [0, 1] }, 'lin'); tl.tw(c, hit, 300, { s: [2.4, 1] }, 'back'); }
      const n2 = count[tg] = (count[tg] || 0) + 1, el = tallies[tg], ln = line[tg];
      heatTo(tg, hit, n2 - 1, n2);
      tl.at(hit, () => { if (el) el.querySelector('span').textContent = n2; if (ln) { ln.style.visibility = 'visible'; ln.querySelector('i').textContent = n2; } });
      if (el) { if (n2 === 1) { tl.set(el, { o: 0 }); tl.tw(el, hit, 60, { o: [0, 1] }, 'lin'); } tl.tw(el, hit, 220, { s: [1.4, 1] }, 'back'); }
      if (S[tg].wrap) tl.tw(S[tg].wrap, hit, 240, { s: [1.06, 1] }, 'back');
      tl.cue(hit, 'tick');
    });
    t += cast.length * 460 + 300;
    const topN = order[0];
    if (topN && S[topN]) {
      exprAt(tl, t, S[topN].c, 'shocked');
      if (d.eliminated && S[d.eliminated]) { st.spot(d.eliminated); tl.at(t, () => st.lit(d.eliminated, true)); tl.tw(st.cone, t, 300, { o: [0, 1] }, 'lin'); st.dimTo(tl, t, 400, .4); tl.cue(t, 'whoosh'); }
    }
    tl.hold(t + 1300);
    return tl;
  }

  // ---- out: every ballot is on the table; the light finds one seat, the role card flips, the chair empties
  let t = 250;
  if (!d.name || !S[d.name]) {
    const lbl = anchor(root, W / 2, wide ? 290 : 500, `<div class="outlbl">NOBODY IS OUT</div>`, 'anim');
    slamIn(tl, lbl, t + 300, 1.8, 170); tl.cue(t + 380, 'thud');
    tl.hold(t + 2400);
    return tl;
  }
  const R = S[d.name], role = d.role || '?', others = st.PS.filter(p => p !== R && !p.gone);
  // the count ended with the light on this seat: start from there
  st.lit(d.name, true); st.spot(d.name);
  tl.set(st.cone, { o: 1 }); tl.set(st.dim1, { o: .4 }); tl.set(st.dim2, { o: .4 }); st.dimTo(tl, t, 420, .56, .4);
  tl.tw(arcSvg, t, 260, { o: [1, 0] }, 'lin');
  Object.keys(tallies).forEach(k => { if (k !== d.name) tl.tw(tallies[k], t, 260, { o: [1, 0] }, 'lin'); });
  st.zoom.style.transformOrigin = `${f1(R.x)}px ${f1(R.y)}px`;
  tl.tw(st.zoom, t, 1400, { s: [1, 1.05] }, 'out');
  exprAt(tl, t, R.c, 'nervous');
  others.forEach(p => exprAt(tl, t, p.c, 'suspicious'));
  tl.cue(t, 'whoosh');
  const sc = wide ? .7 : .92, rcW = 360 * sc, rcH = 440 * sc;
  const rcX = clamp(R.x - rcW / 2, wide ? 50 : 40, W - (wide ? 50 : 40) - rcW), rcY = wide ? G.top + 6 : 372;
  const holder = div(root, 'abs', `left:${f1(rcX)}px;top:${rcY}px;width:360px;height:440px;transform:scale(${sc});transform-origin:0 0;`);
  const roleCls = role === 'mole' ? 'mole' : role === 'crew' ? 'crew' : 'unk';
  const roleCard = flipCard(holder, 0, 0, 360, 440, `<div class="rback"><div>ROLE</div>${CARD_BACK}</div>`,
    `<div class="rface ${roleCls}"><div class="rf-n">${nm(d.name)}</div><div class="rf-r">${roleCls === 'unk' ? '?' : esc(role.toUpperCase())}</div><div class="rf-s">voted out · ${plural(tally[d.name] || 0, 'vote')}${d.tiebreak ? ' · tie broken by ' + esc(d.tiebreak === 'leader' ? 'the leader' : d.tiebreak) : ''}</div></div>`);
  roleCard.wrap.classList.add('bx'); roleCard.wrap.dataset.bx = 'role card';
  t += 500;
  tl.set(roleCard.flipper, { ry: 180 }); slideIn(tl, roleCard.wrap, t, 0, -200, 380, 'out5');
  tl.cue(t + 350, 'tick'); tl.cue(t + 700, 'tick'); tl.cue(t + 1050, 'tick');
  t += 1300;
  tl.tw(roleCard.flipper, t, 420, { ry: [180, 0] }, 'out'); tl.tw(roleCard.wrap, t, 420, { s: [1, 1.06] }, 'back');
  tl.cue(t, 'flip'); tl.cue(t + 260, role === 'mole' ? 'sting' : 'stingBad'); shakeFx(tl, st.cam, t + 260, 340, 14); flashFx(tl, mkFlash(), t + 240, 260, .3);
  exprAt(tl, t + 420, R.c, 'eliminated');
  // the table reacts; in the audience view a mole reacts as a mole (nothing in the table view tells them apart)
  others.forEach(p => {
    const mole = aud && roleOf(p.name) === 'mole';
    exprAt(tl, t + 480, p.c, role === 'mole' ? (mole ? 'nervous' : 'pleased') : (mole ? 'smug' : 'shocked'));
  });
  const mdl = aud ? modelOf(d.name) : '';
  const lblHtml = `<div class="outlbl" style="font-size:${wide ? 76 : 84}px"><span style="color:${acc(d.name)}">${nm(d.name)}</span> IS OUT</div>${mdl ? `<div class="outsub" style="font-size:${wide ? 24 : 28}px">${esc(mdl)}</div>` : ''}`;
  let lbl;
  if (wide) {

  } else {

  const tt = t + 1700;
  if (R.wrap) tl.tw(R.wrap, tt, 520, { y: [0, 90], o: [1, 0] }, 'in');
  if (R.chair) tl.tw(R.chair, tt + 220, 380, { o: [0, 1] }, 'lin');
  tl.tw(R.plate, tt + 220, 260, { o: [1, 0] }, 'lin');

  tl.hold(tt + 1900);

};

/* ---------------------------------------------------------------- FINALE -------- */
// mode: pitch (a finale_pitch turn) or result (finale_result)
SCENES.finale = (ctx, mode) => {
  const { root, L, b, w, aud, events } = ctx, tl = new Timeline();
  const W = L.W, H = L.H;
  const e = b.ev;
  // the two finalists: from the cut, else the players who pitch or choose in the finale (moles' finale)
  let fin = (mode === 'result' ? b.data.finalists : w.finalists) || [];
  if (fin.length < 2) {
    const seen = [];
    events.forEach(x => { if (x && x.type === 'turn' && (x.turn_phase === 'finale_pitch' || x.turn_phase === 'finale_choice') && !seen.includes(x.player)) seen.push(x.player); });
    if (e && e.player && !seen.includes(e.player)) seen.unshift(e.player);
    fin = seen.length >= 2 ? seen : seen.concat((w.alive || []).filter(n => !seen.includes(n)));
  }
  const a = fin[0] || (e && e.player) || '?', bb = fin[1] || '?';
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 820 : 1300 }, ROOMS.finale)) + `<defs><radialGradient id="fa" cx="${L.wide ? 18 : 25}%" cy="${L.wide ? 50 : 22}%" r="40%"><stop offset="0" stop-color="${acc(a)}" stop-opacity=".32"/><stop offset="1" stop-color="${acc(a)}" stop-opacity="0"/></radialGradient><radialGradient id="fb" cx="${L.wide ? 82 : 75}%" cy="${L.wide ? 50 : 22}%" r="40%"><stop offset="0" stop-color="${acc(bb)}" stop-opacity=".32"/><stop offset="1" stop-color="${acc(bb)}" stop-opacity="0"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#fa)"/><rect width="${W}" height="${H}" fill="url(#fb)"/>`);
  const pw = L.wide ? (mode === 'pitch' ? 500 : 560) : 480, py = L.wide ? (mode === 'pitch' ? 150 : 200) : 230;
  const pa = person(cam, a, L.wide ? 40 : -10, py, pw, { expr: 'neutral' });
  const pb = person(cam, bb, L.wide ? W - 40 - pw : W - pw + 10, py, pw, { expr: 'neutral', flip: true });
  const title = anchor(root, W / 2, L.wide ? 150 : 180, `<div class="fintitle"><div class="ft-k">THE FINALE</div><div class="ft-n" style="font-size:${L.wide ? 64 : 58}px">SPLIT <em>OR</em> STEAL</div></div>`, 'anim');
  title.firstChild.firstChild.classList.add('bx'); title.firstChild.firstChild.dataset.bx = 'finale title';
  const potV = w.pot != null ? w.pot : '';
  const pot = anchor(root, W / 2, L.wide ? 420 : 820, `<div class="potbag" style="transform:scale(${L.wide ? 1 : .9})">${potSVG()}<div class="pot-tag">POT<b>${esc(potV)}</b></div></div>`, 'anim');
  // nameplates under each finalist
  [[a, pa, L.wide ? 40 + pw / 2 : -10 + pw / 2], [bb, pb, L.wide ? W - 40 - pw / 2 : W - pw + 10 + pw / 2]].forEach(([n2, P, x]) => {
    const pl = anchor(cam, x, py + pw * 1.1 - 8, plateHTML(n2, { fs: L.wide ? 32 : 28, w: 220, model: aud ? modelOf(n2) : '', role: aud ? roleOf(n2) : null }), 'anim');
    pl.firstChild.style.transform = 'translate(-50%, 0)';
    pl.firstChild.firstChild.classList.add('bx'); pl.firstChild.firstChild.dataset.bx = 'plate ' + n2;
    P.plate = pl;
  });
  slideIn(tl, pa.wrap, 0, -400, 0, 420, 'out5'); slideIn(tl, pb.wrap, 0, 400, 0, 420, 'out5');
  slamIn(tl, title, 220, 1.6, 200); tl.cue(260, 'thud');
  fadeIn(tl, pa.plate, 400, 200); fadeIn(tl, pb.plate, 450, 200);
  if (mode === 'pitch') {
    // both pitches: the one already given (in full) and this one, typed
    const pitches = [];
    for (let i = 0; i <= b.i && i < events.length; i++) { const x = events[i]; if (x && x.type === 'turn' && x.turn_phase === 'finale_pitch') pitches.push(x); }
    const mine = pitches.filter(x => x.player === e.player).pop() || e;
    const theirs = pitches.filter(x => x.player !== e.player).pop();
    const bw = L.wide ? 880 : 1000, bh = L.wide ? 260 : 270;
    const mk = (x, full) => {
      const left = x.player === a;
      const bx2 = L.wide ? (left ? 40 : W - 40 - bw) : 40, by2 = L.wide ? 790 : (left ? 1330 : 1622);
      const el = box(root, bx2, by2, bw, bh, 'pitch anim bx', null, `--ac:${acc(x.player)}`);
      el.dataset.bx = 'pitch ' + x.player;
      const said = (x.action || {}).stated_intent;
      el.innerHTML = `<div class="pi-h"><span>${nm(x.player)}</span><em>${x.statement_id ? esc(x.statement_id) + ' · ' : ''}${said ? 'says “' + esc(String(said)) + '”' : 'pitch'}</em></div>`;
      const t = div(el, 'pi-t typed');
      const txt = (x.public || '').trim() || '(says nothing)';
      renderTyped(t, [{ text: txt }], full ? txt.length : 0);
      if (!fitText(t, L.wide ? 32 : 36, 18, 'pitch')) ctx.over('pitch');
      return { el, t, txt, P: left ? pa : pb, O: left ? pb : pa };
    };
    if (theirs) { const o = mk(theirs, true); fadeIn(tl, o.el, 500, 250); }
    const me = mk(mine, false);
    slideIn(tl, me.el, 600, 0, 40, 300, 'out5');
    exprAt(tl, 600, me.P.c, 'talk'); exprAt(tl, 600, me.O.c, 'thinking');
    const dur = tl.type(me.t, 800, [{ text: me.txt }], { cps: 32, char: me.P.c, pitch: me.P === pa ? 380 : 520 });
    exprAt(tl, 800 + dur + 200, me.P.c, 'pleased'); exprAt(tl, 800 + dur + 200, me.O.c, 'suspicious');
    tl.set(pot, { o: 0 }); tl.tw(pot, 450, 80, { o: [0, 1] }, 'lin'); tl.tw(pot, 450, 420, { y: [-300, 0] }, 'back');
    tl.hold(800 + dur + 900);

  }

// Which scene shows a beat.
function sceneFor(b) {
  const k = b.kind, tp = b.ev && b.ev.turn_phase;
  switch (k) {
    case 'cast': return ['cast'];
    case 'round': return ['table', 'round'];
    case 'intel': return ['table', 'intel'];
    case 'pairs': return (b.data.pairs || []).length ? ['pairs'] : ['table', 'nowhisper'];
    case 'whisper': return ['whisper'];
    case 'job': return ['table', 'job'];
    case 'jobresult': return ['job'];
    case 'say': return tp === 'finale_pitch' ? ['finale', 'pitch'] : (!CLASSIC && TABLE_TURNS[tp] ? ['council', 'say'] : ['speaker']);
    case 'diary': case 'think': return !CLASSIC && b.data && b.data.atTable ? ['council', 'think'] : ['diary'];
    case 'votes': return CLASSIC ? ['vote', 'votes'] : ['council', 'votes'];
    case 'out': return CLASSIC ? ['vote', 'out'] : ['council', 'out'];
    case 'cut': return ['vote', 'cut'];
    case 'recap': return ['table', 'recap'];
    case 'title': return ['table', 'title'];
    case 'finale': return ['finale', 'result'];
    case 'end': return ['end'];
    default: return ['table', 'note'];

}

  function updateProgress() {
    const n = S.beats.length, b = S.beats[S.idx];
    const frac = n ? (S.idx + Math.min(1, S.elapsed / ((b && effDur(b)) || 1))) / n : 0;
    const f = frac.toFixed(4);
    if (S._frac !== f) { S._frac = f; $('tl-fill').style.transform = `scaleX(${f})`; $('tl-head').style.left = (frac * 100).toFixed(2) + '%'; }
    const live = S.gameId && !S.done && S.mode === 'server';
    $('b-live').classList.toggle('live-on', !!(live && S.idx >= n - 1));
    renderHud(b);
  }
  function updateControls() {
    $('b-play').innerHTML = S.playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
    $('pos').textContent = S.beats.length ? (S.idx + 1) + ' / ' + S.beats.length : '0 / 0';
    Array.prototype.forEach.call($('speeds').children, bt => bt.classList.toggle('on', +bt.getAttribute('data-s') === S.speed));
    $('b-view').textContent = aud() ? 'TABLE VIEW' : 'AUDIENCE VIEW';
    $('b-view').classList.toggle('hidden', S.mode === 'export');
    $('b-thoughts').textContent = S.thoughts === 'full' ? 'THOUGHTS: FULL' : 'THOUGHTS: SHORT';
    $('b-thoughts').classList.toggle('hidden', !aud() || CLASSIC);
    $('b-list').classList.toggle('hidden', S.mode === 'export');
    $('b-live').classList.toggle('hidden', S.mode === 'export' || S.done);
    $('b-sound').textContent = SND.on ? 'SOUND ON' : 'SOUND OFF';
    $('b-sound').classList.toggle('on', SND.on);
    const b = S.beats[S.idx], sel = $('b-round');
    if (b && sel.value !== String(b.round)) sel.value = String(b.round);
  }
  function rounds() {
    const seen = {}, out = [];
    S.beats.forEach((b, i) => { if (!(b.round in seen)) { seen[b.round] = i; out.push([b.round, i]); } });
    return out;
  }
  function rebuildTimeline() {
    const rs = rounds(), n = S.beats.length || 1;
    $('tl-marks').innerHTML = rs.map(r => `<div class="tl-mark" style="left:${(r[1] / n * 100).toFixed(3)}%">${r[0] ? 'R' + esc(r[0]) : ''}</div>`).join('');
    const sel = $('b-round');
    const opts = rs.map(r => `<option value="${esc(r[0])}">${r[0] ? 'Round ' + esc(r[0]) : 'Setup'}</option>`).join('');
    if (sel.innerHTML !== opts) sel.innerHTML = opts;
  }
  function rebuild() {
    const key = S.beats[S.idx] ? S.beats[S.idx].key : null;
    S.beats = buildBeats(S.events, S.view, beatOpts());
    const k = key ? S.beats.findIndex(b => b.key === key) : -1;
    S.idx = k >= 0 ? k : Math.min(S.idx, Math.max(0, S.beats.length - 1));
    rebuildTimeline();
    // re-stage only if what the current beat shows has changed (new events usually only append beats)
    if (sig(S.beats[S.idx]) !== S.sig) render();
    else updateControls();
  }
  function setThoughts(mode) {
    S.thoughts = mode === 'full' ? 'full' : 'short';
    setURL();
    if (S.events.length) rebuild(); else updateControls();
  }
  function aliasCast() {
    const gs = S.events.find(e => e && e.type === 'game_start'), tb = S.events.find(e => e && e.type === 'table');
    const names = gs ? (gs.players || []).slice().sort((p, q) => (p.seat || 0) - (q.seat || 0)).map(p => p.name) : (tb ? tb.seats || [] : []);
    setAliases(names);
  }

  // ------------------------------------------------------------------ loading
  function message(t) { $('msg').textContent = t || ''; $('msg').classList.toggle('hidden', !t); }
  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); });
  }
  function startAt(opts) {
    let i = -1;
    const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (h && opts.useHash) i = S.beats.findIndex(b => b.ev && b.ev.statement_id === h);
    if (i < 0 && opts.seq != null) i = S.beats.findIndex(b => b.seq >= opts.seq);
    if (i < 0 && opts.useHash && PARAMS.get('beat') != null && /^\d+$/.test(PARAMS.get('beat'))) i = Math.min(+PARAMS.get('beat'), S.beats.length - 1);
    if (i < 0) i = S.done ? 0 : S.beats.length - 1;
    go(i);
  }
  function loadGame(id, view, opts) {
    opts = opts || {};
    const token = ++S.loadToken;
    clearTimeout(S.timer);
    if (id !== S.gameId) { setPortraits({}); $('scene').innerHTML = ''; S.tl = null; S.sig = null; }   // nothing of the last game stays up
    Object.assign(S, { gameId: id, view, events: [], next: 0, done: false, beats: [], idx: 0, overflow: {}, playing: false, elapsed: 0 });
    $('list').classList.add('hidden');
    setURL();
    message('loading ' + id + ' …');
    return Promise.all([fetchJSON('/api/log/' + encodeURIComponent(id) + '?from=0&view=' + view), loadPortraits(id)]).then(([j, pics]) => {
      if (token !== S.loadToken) return;
      setPortraits(pics);
      message('');
      S.events = j.events || []; S.next = j.next || 0; S.done = !!j.done; S.meta = j.meta || {};
      aliasCast();
      S.beats = buildBeats(S.events, S.view, beatOpts());
      rebuildTimeline();
      startAt(opts);
      if (PARAMS.get('audit') === '1') { auditToPage(); return; }
      if (PARAMS.get('autoplay') === '1' || !S.done) setPlaying(true);
      if (!S.done) schedulePoll(token);
    }).catch(err => { if (token !== S.loadToken) return; message('could not load ' + id + ': ' + err.message); });
  }
  function schedulePoll(token) { clearTimeout(S.timer); S.timer = setTimeout(() => poll(token), 2000); }
  function poll(token) {
    if (token !== S.loadToken || S.done) return;
    fetchJSON('/api/log/' + encodeURIComponent(S.gameId) + '?from=' + S.next + '&view=' + S.view).then(j => {
      if (token !== S.loadToken) return;
      S.next = j.next; S.done = !!j.done; S.meta = j.meta || S.meta;
      if (j.events && j.events.length) { Array.prototype.push.apply(S.events, j.events); aliasCast(); rebuild(); }
      updateControls();
      if (!S.done) schedulePoll(token);
    }).catch(() => { if (token === S.loadToken) schedulePoll(token); });
  }
  function setURL() {
    if (S.mode !== 'server') return;
    const p = new URLSearchParams(location.search);
    if (S.gameId) p.set('game', S.gameId); else p.delete('game');
    p.set('view', S.view); p.set('layout', S.layout);
    if (S.thoughts === 'full') p.set('thoughts', 'full'); else p.delete('thoughts');
    history.replaceState(null, '', '?' + p.toString() + location.hash);
  }
  // portrait overrides: the server lists one game's set (its own folder first, then the global images);
  // an export carries its game's set as data: URIs. PORTRAITS always holds exactly one game's set.
  function setPortraits(pics) {
    Object.keys(PORTRAITS).forEach(k => { delete PORTRAITS[k]; });
    Object.assign(PORTRAITS, pics || {});
  }
  function loadPortraits(id) {
    if (embedded) return Promise.resolve(embedded.portraits || {});
    const q = id ? '?game=' + encodeURIComponent(id) : '';
    return fetchJSON('/api/portraits' + q).then(j => j.portraits || {}).catch(() => ({}));
  }

  // ------------------------------------------------------------------ game list
  function openList() {
    if (S.mode !== 'server') return;
    setPlaying(false);
    const el = $('list');
    el.classList.remove('hidden');
    el.innerHTML = '<h1>INSIDE / JOB</h1><div class="sub">loading games …</div>';
    fetchJSON('/api/games').then(j => {
      const gs = j.games || [], spoil = aud();
      let h = `<h1>INSIDE / JOB</h1><div class="sub">${plural(gs.length, 'game')} · ${spoil ? 'audience view (results shown)' : 'table view (results hidden)'}${S.gameId ? ' · <button id="l-close">back to the game</button>' : ''}</div>`;
      h += '<table><tr><th>GAME</th><th>SEED</th><th>BATCH</th><th>STATUS</th>' + (spoil ? '<th>RESULT</th><th>ROUNDS</th><th>CAST</th>' : '') + '</tr>';
      gs.forEach(g => {
        const age = Date.now() / 1000 - (g.mtime || 0);
        const st = g.finished ? (g.spoiled ? 'spoiled' : 'finished') : (age < 600 ? '<span class="st-live">● in progress</span>' : '<span class="st-stop">stopped</span>');
        h += `<tr class="g" data-id="${esc(g.game_id)}"><td>${esc(g.game_id)}</td><td>${esc(g.seed)}</td><td>${esc(g.batch || '')}</td><td>${st}</td>`;
        if (spoil) h += `<td class="w-${esc(g.winner || '')}">${g.winner ? esc(g.winner) + ' win (' + esc(g.reason) + ')' : ''}</td><td>${esc(g.rounds == null ? '' : g.rounds)}</td><td>${(g.cast || []).map(esc).join(', ')}</td>`;
        h += '</tr>';
      });
      el.innerHTML = h + '</table>';
      el.querySelectorAll('tr.g').forEach(tr => tr.addEventListener('click', () => { location.hash = ''; loadGame(tr.getAttribute('data-id'), S.view); }));
      const c = $('l-close'); if (c) c.addEventListener('click', () => el.classList.add('hidden'));
    }).catch(err => { el.innerHTML = '<h1>INSIDE / JOB</h1><div class="sub">could not load the game list: ' + esc(err.message) + '</div>'; });
  }

  // ------------------------------------------------------------------ controls
  function seekFromPointer(ev) {
    const r = $('timeline').getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    if (S.beats.length) { const i = Math.min(S.beats.length - 1, Math.floor(f * S.beats.length)); if (i !== S.idx) go(i); }
  }
  function bind() {
    $('b-play').onclick = () => { if (!S.playing && S.idx >= S.beats.length - 1 && S.done) go(0); setPlaying(!S.playing); };
    $('b-prev').onclick = () => go(S.idx - 1);
    $('b-next').onclick = () => go(S.idx + 1);
    Array.prototype.forEach.call($('speeds').children, bt => { bt.onclick = () => { S.speed = +bt.getAttribute('data-s'); updateControls(); }; });
    $('b-round').onchange = () => { const r = +$('b-round').value; const i = S.beats.findIndex(b => b.round === r); if (i >= 0) go(i); };
    $('b-live').onclick = () => { go(S.beats.length - 1); setPlaying(true); };
    $('b-layout').onclick = () => { S.layout = S.layout === 'wide' ? 'tall' : 'wide'; applyLayout(); setURL(); render(); };
    $('b-view').onclick = () => {
      if (S.mode !== 'server' || !S.gameId) return;
      const b = S.beats[S.idx];
      loadGame(S.gameId, aud() ? 'table' : 'audience', { seq: b ? b.seq : null });
    };
    $('b-thoughts').onclick = () => setThoughts(S.thoughts === 'full' ? 'short' : 'full');
    $('b-sound').onclick = () => { SND.on = !SND.on; if (SND.on) { SND.ensure(); if (SND.ctx) SND.ctx.resume(); } updateControls(); };
    $('b-list').onclick = openList;
    const tlEl = $('timeline'); let dragging = false;
    tlEl.addEventListener('pointerdown', ev => { dragging = true; tlEl.setPointerCapture(ev.pointerId); seekFromPointer(ev); });
    tlEl.addEventListener('pointermove', ev => { if (dragging) seekFromPointer(ev); });
    tlEl.addEventListener('pointerup', () => { dragging = false; });
    document.addEventListener('keydown', ev => {
      if (ev.target && (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT')) return;
      if (ev.code === 'Space') { ev.preventDefault(); $('b-play').onclick(); }
      else if (ev.code === 'ArrowLeft') { ev.preventDefault(); go(S.idx - 1); }
      else if (ev.code === 'ArrowRight') { ev.preventDefault(); go(S.idx + 1); }
    });
    window.addEventListener('resize', scale);
    window.addEventListener('hashchange', () => startAt({ useHash: true }));
  }

  // ------------------------------------------------------------------ self check
  function selfCheck() {
    const shown = {};
    S.beats.forEach(b => { if (b.ev && b.ev.type === 'turn') shown[b.i] = true; });
    const problems = []; let turns = 0, turnsShown = 0;
    S.events.forEach((e, i) => {
      if (!e || e.type !== 'turn') return;
      turns++;
      if (shown[i]) turnsShown++;
      else if ((e.public || '').trim()) problems.push('turn seq ' + e.seq + ' (' + e.turn_phase + ') has public text but no beat');
    });
    Object.keys(S.overflow).forEach(k => problems.push('beat ' + k + ': text overflowed in ' + S.overflow[k].join(', ')));
    return { events: S.events.length, beats: S.beats.length, turns, turnsShown, problems };
  }
  // Visit every beat in one layout, show its final frame, and report boxes that leave the canvas or
  // overlap, faces covered by a box, and faces hidden behind another face.
  function opacityOf(el, root) {
    let o = 1;
    for (let x = el; x && x !== root; x = x.parentElement) {
      const cs = getComputedStyle(x);
      if (cs.visibility === 'hidden' || cs.display === 'none') return 0;
      o *= +cs.opacity;
    }
    return o;
  }
  function audit(layout, opts) {
    opts = opts || {};
    const keep = { layout: S.layout, idx: S.idx, playing: S.playing };
    S.playing = false;
    if (layout && layout !== S.layout) { S.layout = layout; applyLayout(); }
    S.overflow = {};
    const G = LAYOUT[S.layout], st = $('stage'), issues = [];
    const area = r => Math.max(0, r.w) * Math.max(0, r.h);
    const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    const from = opts.from || 0, to = Math.min(S.beats.length, opts.to || S.beats.length);
    for (let i = from; i < to; i++) {
      go(i, { end: true });
      const root = $('scene');
      const sr = st.getBoundingClientRect(), sc = sr.width / G.W;
      const rect = el => { const r = el.getBoundingClientRect(); return { x: (r.left - sr.left) / sc, y: (r.top - sr.top) / sc, w: r.width / sc, h: r.height / sc, el }; };
      const key = S.beats[i].key + ' (' + S.beats[i].kind + ')';
      const boxes = Array.from(root.querySelectorAll('.bx')).filter(el => opacityOf(el, root) > 0.05).map(el => Object.assign(rect(el), { n: el.dataset.bx || el.className }));
      const faces = Array.from(root.querySelectorAll('.fz')).filter(el => opacityOf(el, root) > 0.3).map(el => {
        const r = rect(el);
        return { x: r.x + r.w * .28, y: r.y + r.h * .19, w: r.w * .44, h: r.h * .52, el, n: 'face ' + (el.dataset.who || '?') };
      });
      boxes.forEach(r => { if (r.x < -1 || r.y < -1 || r.x + r.w > G.W + 1 || r.y + r.h > G.H + 1) issues.push(key + ' leaves the canvas: ' + r.n); });
      for (let a = 0; a < boxes.length; a++) for (let c = a + 1; c < boxes.length; c++) {
        const A = boxes[a], C = boxes[c];
        if (A.el.contains(C.el) || C.el.contains(A.el)) continue;
        if (inter(A, C) > 4) issues.push(key + ' overlap: ' + A.n + ' / ' + C.n);
      }
      faces.forEach(f => {
        if (f.x + f.w < 0 || f.x > G.W || f.y + f.h < 0 || f.y > G.H) return;
        boxes.forEach(r => { if (!r.el.contains(f.el) && inter(f, r) > area(f) * .06) issues.push(key + ' covers a face: ' + r.n + ' / ' + f.n); });
      });
      for (let a = 0; a < faces.length; a++) for (let c = a + 1; c < faces.length; c++) {
        const A = faces[a], C = faces[c];
        if (inter(A, C) > Math.min(area(A), area(C)) * .12) issues.push(key + ' faces overlap: ' + A.n + ' / ' + C.n);
      }
    }
    const chk = selfCheck();
    if (keep.layout !== S.layout) { S.layout = keep.layout; applyLayout(); }
    go(keep.idx);
    S.playing = keep.playing;
    return { layout: layout || keep.layout, beats: S.beats.length, layoutIssues: issues, problems: chk.problems };
  }
  function auditToPage() {
    const res = { game: S.gameId, view: S.view, check: selfCheck(), wide: audit('wide'), tall: audit('tall') };
    const pre = document.createElement('pre');
    pre.id = 'ij-audit'; pre.style.display = 'none';
    pre.textContent = JSON.stringify(res);
    document.body.appendChild(pre);
  }

  window.insideJob = {
    state: S, buildBeats, selfCheck, audit,
    load: (id, view) => loadGame(id, view || S.view),
    goto: (i, end) => { go(i, { end: !!end }); return S.beats[S.idx] && S.beats[S.idx].key; },
    play: p => setPlaying(p !== false),
    setLayout: l => { S.layout = l; applyLayout(); render(); },
    setSpeed: s => { S.speed = s; updateControls(); },
    setThoughts,
    seekScene: t => { if (S.tl) { S.sceneT = t === 'end' ? S.tl.dur + 10 : +t; S.tl.seek(S.sceneT); } },
    sceneOf: i => { const b = S.beats[i == null ? S.idx : i]; return b ? sceneFor(b).join(':') : null; },
  };

  // ------------------------------------------------------------------ start
  const lay = PARAMS.get('layout');
  S.layout = lay === 'wide' || lay === 'tall' ? lay : (window.innerWidth >= window.innerHeight ? 'wide' : 'tall');
  if (S.clean) document.body.classList.add('clean');
  bind();
  applyLayout();
  setInterval(tick, 100);
  requestAnimationFrame(frame);
  (embedded || PARAMS.get('game') ? Promise.resolve(null) : loadPortraits(null)).then(pics => {
    if (embedded) {
      setPortraits(embedded.portraits);
      S.gameId = embedded.game_id; S.view = embedded.view === 'table' ? 'table' : 'audience';
      S.events = embedded.events || []; S.done = true; S.meta = embedded.meta || {};
      aliasCast();
      S.beats = buildBeats(S.events, S.view, beatOpts());
      rebuildTimeline();
      if (!embedded.done) S.gameId += ' (unfinished)';
      startAt({ useHash: true });
      if (PARAMS.get('autoplay') === '1') setPlaying(true);
    } else {
      S.view = PARAMS.get('view') === 'table' ? 'table' : 'audience';
      const g = PARAMS.get('game');
      if (g) loadGame(g, S.view, { useHash: true }); else { setPortraits(pics); render(); openList(); }
    }
  });
})();
</script>
</body>
</html>
