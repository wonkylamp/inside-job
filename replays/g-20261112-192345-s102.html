    const newSlot = score.slots.find(s => +s.dataset.row === (d.blown ? 1 : 0) && +s.dataset.i === (d.blown ? w.blown : w.clean) - 1);
    if (newSlot) { tl.set(newSlot, { o: 0 }); tl.tw(newSlot, t + 900, 80, { o: [0, 1] }, 'lin'); tl.tw(newSlot, t + 900, 420, { y: [-600, 0], r: [-25, 0], s: [1.5, 1] }, 'out5'); tl.cue(t + 1200, 'thud'); }
  }
  tl.hold(t + 2800);
  return tl;
};

/* ---------------------------------------------------------------- VOTE / OUT / CUT */
// mode: votes (cards flip, everyone points, arrows and tally), out (the reveal), cut (finalists)
SCENES.vote = (ctx, mode) => {
  const { root, L, b, aud } = ctx, d = b.data, tl = new Timeline(), w = b.w;
  const W = L.W, H = L.H;
  const votes = d.votes || {}, tally = d.tally || {};
  // who is in the lineup: the voters (alive before the result), in seat order
  let line = (w.seats || []).filter(n => votes[n] != null || tally[n] != null);
  if (mode === 'out' && d.name && !line.includes(d.name)) line.push(d.name);
  if (!line.length) line = (w.alive || []).slice();
  const n = line.length;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 760 : 1260 }, mode === 'cut' ? ROOMS.title : ROOMS.vote)));
  const pos = {};
  let pw;
  if (L.wide) {
    const sp = Math.min(400, 1760 / n); pw = Math.min(300, sp * .86);
    const vy = 700 - pw * 1.1;
    line.forEach((nm2, i) => { pos[nm2] = { x: W / 2 + (i - (n - 1) / 2) * sp, y: vy }; });
  } else {
    pw = n > 7 ? 170 : n > 5 ? 196 : 240;
    const R = 372, c0 = { x: W / 2, y: 780 };
    line.forEach((nm2, i) => { const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / n; pos[nm2] = { x: c0.x + R * Math.cos(a), y: c0.y + R * Math.sin(a) - pw * .55, a }; });
  }
  const people = {};
  line.forEach(nm2 => {
    const { x, y } = pos[nm2];
    const outAlready = mode !== 'out' && w.out[nm2] && !votes[nm2];
    const p = person(cam, nm2, x - pw / 2, y, pw, { expr: outAlready ? 'eliminated' : 'neutral' });
    const plateY = L.wide ? y + pw * 1.1 - 6 : y + pw * 1.1 - 4;
    const tag = anchor(cam, x, plateY, `<div class="plate" style="--ac:${acc(nm2)};font-size:${L.wide ? 26 : 22}px;min-width:${pw * .78}px">${nm(nm2)}</div>`, 'anim');
    tag.firstChild.style.transform = 'translate(-50%, 0)';
    tag.firstChild.firstChild.classList.add('bx'); tag.firstChild.firstChild.dataset.bx = 'name ' + nm2;
    people[nm2] = Object.assign(p, { x, y, tag });
  });
  // vote cards: under each voter (wide); in a grid in the bottom third (tall)
  const voters = line.filter(v => votes[v] != null);
  const cards = {};
  voters.forEach((v, i) => {
    const tgt = votes[v];
    const front = `<div class="vface" style="--ac:${acc(tgt)}"><div class="vf-k">${nm(v)} ${mode === 'cut' ? 'SENDS' : 'VOTES'}</div><div class="vf-n" style="font-size:${L.wide ? 34 : 38}px">${nm(tgt)}</div></div>`;
    let cx, cy, cw, ch;
    if (L.wide) { cw = Math.min(200, pw * .86); ch = 96; cx = pos[v].x - cw / 2; cy = 700 + 60; }
    else { const cols = n > 6 ? 4 : 3, col = i % cols, row = Math.floor(i / cols); cw = 236; ch = 104; cx = W / 2 - (cols * cw + (cols - 1) * 16) / 2 + col * (cw + 16); cy = 1330 + row * (ch + 16); }
    cards[v] = flipCard(root, cx, cy, cw, ch, `<div class="vback">VOTE</div>`, front);
  });
  // arrows voter -> target, drawn over the lineup
  let defs = '', paths = '';
  const arrowEls = [];
  voters.forEach((v, i) => {
    const tgt = votes[v], A = people[v], B = people[tgt];
    if (!A || !B) return;
    defs += `<marker id="ah${i}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${acc(v)}"/></marker>`;
    let dd;
    if (L.wide) {
      const x1 = A.x, y1 = A.y + pw * .12, x2 = B.x + (A.x < B.x ? -pw * .12 : pw * .12), y2 = B.y + pw * .14;
      const lift = Math.min(70 + Math.abs(x2 - x1) * 0.2, Math.min(y1, y2) - 170);
      dd = `M${x1.toFixed(0)} ${y1.toFixed(0)}C${x1.toFixed(0)} ${(Math.min(y1, y2) - lift).toFixed(0)} ${x2.toFixed(0)} ${(Math.min(y1, y2) - lift).toFixed(0)} ${x2.toFixed(0)} ${y2.toFixed(0)}`;
    } else {
      const c0 = { x: W / 2, y: 780 }, hy = pw * .45;
      const ax = A.x, ay = A.y + hy, bx2 = B.x, by2 = B.y + hy;
      const ux = bx2 - ax, uy = by2 - ay, L2 = Math.hypot(ux, uy) || 1;
      const x1 = ax + ux / L2 * pw * .42, y1 = ay + uy / L2 * pw * .42, x2 = bx2 - ux / L2 * pw * .44, y2 = by2 - uy / L2 * pw * .44;
      const mx = (x1 + x2) / 2 + (c0.x - (x1 + x2) / 2) * .35, my = (y1 + y2) / 2 + (c0.y - (y1 + y2) / 2) * .35;
      dd = `M${x1.toFixed(0)} ${y1.toFixed(0)}Q${mx.toFixed(0)} ${my.toFixed(0)} ${x2.toFixed(0)} ${y2.toFixed(0)}`;
    }
    paths += `<path class="arw" data-i="${i}" d="${dd}" fill="none" stroke="#05030a" stroke-width="12" stroke-linecap="round" opacity=".75"/><path class="arw" data-i="${i}" d="${dd}" fill="none" stroke="${acc(v)}" stroke-width="6" stroke-linecap="round" marker-end="url(#ah${i})"/>`;
  });
  const arrowSvg = svgEl(root, W, H, `<defs>${defs}</defs>${paths}`, 'pointer-events:none;');
  arrowSvg.querySelectorAll('.arw').forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.style.visibility = 'hidden'; p._len = len; arrowEls.push(p); });
  const tallies = {};

  }
  function aliasCast() {
    const gs = S.events.find(e => e && e.type === 'game_start'), tb = S.events.find(e => e && e.type === 'table');
    const names = gs ? (gs.players || []).slice().sort((p, q) => (p.seat || 0) - (q.seat || 0)).map(p => p.name) : (tb ? tb.seats || [] : []);
    setAliases(names);
  }

  // ------------------------------------------------------------------ loading
  function message(t) { $('msg').textContent = t || ''; $('msg').classList.toggle('hidden', !t); }
  function fetchJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); });
  }
  function startAt(opts) {
    let i = -1;
    const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (h && opts.useHash) i = S.beats.findIndex(b => b.ev && b.ev.statement_id === h);
    if (i < 0 && opts.seq != null) i = S.beats.findIndex(b => b.seq >= opts.seq);
    if (i < 0 && opts.useHash && PARAMS.get('beat') != null && /^\d+$/.test(PARAMS.get('beat'))) i = Math.min(+PARAMS.get('beat'), S.beats.length - 1);
    if (i < 0) i = S.done ? 0 : S.beats.length - 1;
    go(i);
  }
  function loadGame(id, view, opts) {
    opts = opts || {};
    const token = ++S.loadToken;
    clearTimeout(S.timer);
    if (id !== S.gameId) { setPortraits({}); $('scene').innerHTML = ''; S.tl = null; S.sig = null; }   // nothing of the last game stays up
    Object.assign(S, { gameId: id, view, events: [], next: 0, done: false, beats: [], idx: 0, overflow: {}, playing: false, elapsed: 0 });
    $('list').classList.add('hidden');
    setURL();
    message('loading ' + id + ' …');
    return Promise.all([fetchJSON('/api/log/' + encodeURIComponent(id) + '?from=0&view=' + view), loadPortraits(id)]).then(([j, pics]) => {
      if (token !== S.loadToken) return;
      setPortraits(pics);
      message('');
      S.events = j.events || []; S.next = j.next || 0; S.done = !!j.done; S.meta = j.meta || {};
      aliasCast();
      S.beats = buildBeats(S.events, S.view, beatOpts());
      rebuildTimeline();
      startAt(opts);
      if (PARAMS.get('audit') === '1') { auditToPage(); return; }
      if (PARAMS.get('autoplay') === '1' || !S.done) setPlaying(true);
      if (!S.done) schedulePoll(token);
    }).catch(err => { if (token !== S.loadToken) return; message('could not load ' + id + ': ' + err.message); });
  }
  function schedulePoll(token) { clearTimeout(S.timer); S.timer = setTimeout(() => poll(token), 2000); }
  function poll(token) {
    if (token !== S.loadToken || S.done) return;
    fetchJSON('/api/log/' + encodeURIComponent(S.gameId) + '?from=' + S.next + '&view=' + S.view).then(j => {
      if (token !== S.loadToken) return;
      S.next = j.next; S.done = !!j.done; S.meta = j.meta || S.meta;
      if (j.events && j.events.length) { Array.prototype.push.apply(S.events, j.events); aliasCast(); rebuild(); }
      updateControls();
      if (!S.done) schedulePoll(token);
    }).catch(() => { if (token === S.loadToken) schedulePoll(token); });
  }
  function setURL() {
    if (S.mode !== 'server') return;
    const p = new URLSearchParams(location.search);
    if (S.gameId) p.set('game', S.gameId); else p.delete('game');
    p.set('view', S.view); p.set('layout', S.layout);
    if (S.thoughts === 'full') p.set('thoughts', 'full'); else p.delete('thoughts');
    history.replaceState(null, '', '?' + p.toString() + location.hash);
  }
  // portrait overrides: the server lists one game's set (its own folder first, then the global images);
  // an export carries its game's set as data: URIs. PORTRAITS always holds exactly one game's set.
  function setPortraits(pics) {
    Object.keys(PORTRAITS).forEach(k => { delete PORTRAITS[k]; });
    Object.assign(PORTRAITS, pics || {});
  }
  function loadPortraits(id) {
    if (embedded) return Promise.resolve(embedded.portraits || {});
    const q = id ? '?game=' + encodeURIComponent(id) : '';
    return fetchJSON('/api/portraits' + q).then(j => j.portraits || {}).catch(() => ({}));
  }

  // ------------------------------------------------------------------ game list
  function openList() {
    if (S.mode !== 'server') return;
    setPlaying(false);
    const el = $('list');
    el.classList.remove('hidden');
    el.innerHTML = '<h1>INSIDE / JOB</h1><div class="sub">loading games …</div>';
    fetchJSON('/api/games').then(j => {
      const gs = j.games || [], spoil = aud();
      let h = `<h1>INSIDE / JOB</h1><div class="sub">${plural(gs.length, 'game')} · ${spoil ? 'audience view (results shown)' : 'table view (results hidden)'}${S.gameId ? ' · <button id="l-close">back to the game</button>' : ''}</div>`;
      h += '<table><tr><th>GAME</th><th>SEED</th><th>BATCH</th><th>STATUS</th>' + (spoil ? '<th>RESULT</th><th>ROUNDS</th><th>CAST</th>' : '') + '</tr>';
      gs.forEach(g => {
        const age = Date.now() / 1000 - (g.mtime || 0);
        const st = g.finished ? (g.spoiled ? 'spoiled' : 'finished') : (age < 600 ? '<span class="st-live">● in progress</span>' : '<span class="st-stop">stopped</span>');
        h += `<tr class="g" data-id="${esc(g.game_id)}"><td>${esc(g.game_id)}</td><td>${esc(g.seed)}</td><td>${esc(g.batch || '')}</td><td>${st}</td>`;
        if (spoil) h += `<td class="w-${esc(g.winner || '')}">${g.winner ? esc(g.winner) + ' win (' + esc(g.reason) + ')' : ''}</td><td>${esc(g.rounds == null ? '' : g.rounds)}</td><td>${(g.cast || []).map(esc).join(', ')}</td>`;
        h += '</tr>';
      });
      el.innerHTML = h + '</table>';
      el.querySelectorAll('tr.g').forEach(tr => tr.addEventListener('click', () => { location.hash = ''; loadGame(tr.getAttribute('data-id'), S.view); }));
      const c = $('l-close'); if (c) c.addEventListener('click', () => el.classList.add('hidden'));
    }).catch(err => { el.innerHTML = '<h1>INSIDE / JOB</h1><div class="sub">could not load the game list: ' + esc(err.message) + '</div>'; });
  }

  // ------------------------------------------------------------------ controls
  function seekFromPointer(ev) {
    const r = $('timeline').getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    if (S.beats.length) { const i = Math.min(S.beats.length - 1, Math.floor(f * S.beats.length)); if (i !== S.idx) go(i); }
  }
  function bind() {
    $('b-play').onclick = () => { if (!S.playing && S.idx >= S.beats.length - 1 && S.done) go(0); setPlaying(!S.playing); };
    $('b-prev').onclick = () => go(S.idx - 1);
    $('b-next').onclick = () => go(S.idx + 1);
    Array.prototype.forEach.call($('speeds').children, bt => { bt.onclick = () => { S.speed = +bt.getAttribute('data-s'); updateControls(); }; });
    $('b-round').onchange = () => { const r = +$('b-round').value; const i = S.beats.findIndex(b => b.round === r); if (i >= 0) go(i); };
    $('b-live').onclick = () => { go(S.beats.length - 1); setPlaying(true); };
    $('b-layout').onclick = () => { S.layout = S.layout === 'wide' ? 'tall' : 'wide'; applyLayout(); setURL(); render(); };
    $('b-view').onclick = () => {
      if (S.mode !== 'server' || !S.gameId) return;
      const b = S.beats[S.idx];
      loadGame(S.gameId, aud() ? 'table' : 'audience', { seq: b ? b.seq : null });
    };
    $('b-thoughts').onclick = () => setThoughts(S.thoughts === 'full' ? 'short' : 'full');
    $('b-sound').onclick = () => { SND.on = !SND.on; if (SND.on) { SND.ensure(); if (SND.ctx) SND.ctx.resume(); } updateControls(); };
    $('b-list').onclick = openList;
    const tlEl = $('timeline'); let dragging = false;
    tlEl.addEventListener('pointerdown', ev => { dragging = true; tlEl.setPointerCapture(ev.pointerId); seekFromPointer(ev); });
    tlEl.addEventListener('pointermove', ev => { if (dragging) seekFromPointer(ev); });
    tlEl.addEventListener('pointerup', () => { dragging = false; });
    document.addEventListener('keydown', ev => {
      if (ev.target && (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT')) return;
      if (ev.code === 'Space') { ev.preventDefault(); $('b-play').onclick(); }
      else if (ev.code === 'ArrowLeft') { ev.preventDefault(); go(S.idx - 1); }
      else if (ev.code === 'ArrowRight') { ev.preventDefault(); go(S.idx + 1); }
    });
    window.addEventListener('resize', scale);
    window.addEventListener('hashchange', () => startAt({ useHash: true }));
  }

  // ------------------------------------------------------------------ self check
  function selfCheck() {
    const shown = {};
    S.beats.forEach(b => { if (b.ev && b.ev.type === 'turn') shown[b.i] = true; });
    const problems = []; let turns = 0, turnsShown = 0;
    S.events.forEach((e, i) => {
      if (!e || e.type !== 'turn') return;
      turns++;
      if (shown[i]) turnsShown++;
      else if ((e.public || '').trim()) problems.push('turn seq ' + e.seq + ' (' + e.turn_phase + ') has public text but no beat');
    });
    Object.keys(S.overflow).forEach(k => problems.push('beat ' + k + ': text overflowed in ' + S.overflow[k].join(', ')));
    return { events: S.events.length, beats: S.beats.length, turns, turnsShown, problems };
  }
  // Visit every beat in one layout, show its final frame, and report boxes that leave the canvas or
  // overlap, faces covered by a box, and faces hidden behind another face.
  function opacityOf(el, root) {
    let o = 1;
    for (let x = el; x && x !== root; x = x.parentElement) {
      const cs = getComputedStyle(x);
      if (cs.visibility === 'hidden' || cs.display === 'none') return 0;
      o *= +cs.opacity;
    }
    return o;
  }
  function audit(layout, opts) {
    opts = opts || {};
    const keep = { layout: S.layout, idx: S.idx, playing: S.playing };
    S.playing = false;
    if (layout && layout !== S.layout) { S.layout = layout; applyLayout(); }
    S.overflow = {};
    const G = LAYOUT[S.layout], st = $('stage'), issues = [];
    const area = r => Math.max(0, r.w) * Math.max(0, r.h);
    const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    const from = opts.from || 0, to = Math.min(S.beats.length, opts.to || S.beats.length);
    for (let i = from; i < to; i++) {
      go(i, { end: true });
      const root = $('scene');
      const sr = st.getBoundingClientRect(), sc = sr.width / G.W;
      const rect = el => { const r = el.getBoundingClientRect(); return { x: (r.left - sr.left) / sc, y: (r.top - sr.top) / sc, w: r.width / sc, h: r.height / sc, el }; };
      const key = S.beats[i].key + ' (' + S.beats[i].kind + ')';
      const boxes = Array.from(root.querySelectorAll('.bx')).filter(el => opacityOf(el, root) > 0.05).map(el => Object.assign(rect(el), { n: el.dataset.bx || el.className }));
      const faces = Array.from(root.querySelectorAll('.fz')).filter(el => opacityOf(el, root) > 0.3).map(el => {
        const r = rect(el);
        return { x: r.x + r.w * .28, y: r.y + r.h * .19, w: r.w * .44, h: r.h * .52, el, n: 'face ' + (el.dataset.who || '?') };
      });
      boxes.forEach(r => { if (r.x < -1 || r.y < -1 || r.x + r.w > G.W + 1 || r.y + r.h > G.H + 1) issues.push(key + ' leaves the canvas: ' + r.n); });
      for (let a = 0; a < boxes.length; a++) for (let c = a + 1; c < boxes.length; c++) {
        const A = boxes[a], C = boxes[c];
        if (A.el.contains(C.el) || C.el.contains(A.el)) continue;
        if (inter(A, C) > 4) issues.push(key + ' overlap: ' + A.n + ' / ' + C.n);
      }
      faces.forEach(f => {
        if (f.x + f.w < 0 || f.x > G.W || f.y + f.h < 0 || f.y > G.H) return;
        boxes.forEach(r => { if (!r.el.contains(f.el) && inter(f, r) > area(f) * .06) issues.push(key + ' covers a face: ' + r.n + ' / ' + f.n); });
      });
      for (let a = 0; a < faces.length; a++) for (let c = a + 1; c < faces.length; c++) {
        const A = faces[a], C = faces[c];
        if (inter(A, C) > Math.min(area(A), area(C)) * .12) issues.push(key + ' faces overlap: ' + A.n + ' / ' + C.n);
      }
    }
    const chk = selfCheck();
    if (keep.layout !== S.layout) { S.layout = keep.layout; applyLayout(); }
    go(keep.idx);
    S.playing = keep.playing;
    return { layout: layout || keep.layout, beats: S.beats.length, layoutIssues: issues, problems: chk.problems };
  }
  function auditToPage() {
    const res = { game: S.gameId, view: S.view, check: selfCheck(), wide: audit('wide'), tall: audit('tall') };
    const pre = document.createElement('pre');
    pre.id = 'ij-audit'; pre.style.display = 'none';
    pre.textContent = JSON.stringify(res);
    document.body.appendChild(pre);
  }

  window.insideJob = {
    state: S, buildBeats, selfCheck, audit,
    load: (id, view) => loadGame(id, view || S.view),
    goto: (i, end) => { go(i, { end: !!end }); return S.beats[S.idx] && S.beats[S.idx].key; },
    play: p => setPlaying(p !== false),
    setLayout: l => { S.layout = l; applyLayout(); render(); },
    setSpeed: s => { S.speed = s; updateControls(); },
    setThoughts,
    seekScene: t => { if (S.tl) { S.sceneT = t === 'end' ? S.tl.dur + 10 : +t; S.tl.seek(S.sceneT); } },
    sceneOf: i => { const b = S.beats[i == null ? S.idx : i]; return b ? sceneFor(b).join(':') : null; },
  };

  // ------------------------------------------------------------------ start
  const lay = PARAMS.get('layout');
  S.layout = lay === 'wide' || lay === 'tall' ? lay : (window.innerWidth >= window.innerHeight ? 'wide' : 'tall');
  if (S.clean) document.body.classList.add('clean');
  bind();
  applyLayout();
  setInterval(tick, 100);
  requestAnimationFrame(frame);
  (embedded || PARAMS.get('game') ? Promise.resolve(null) : loadPortraits(null)).then(pics => {
    if (embedded) {
      setPortraits(embedded.portraits);
      S.gameId = embedded.game_id; S.view = embedded.view === 'table' ? 'table' : 'audience';
      S.events = embedded.events || []; S.done = true; S.meta = embedded.meta || {};
      aliasCast();
      S.beats = buildBeats(S.events, S.view, beatOpts());
      rebuildTimeline();
      if (!embedded.done) S.gameId += ' (unfinished)';
      startAt({ useHash: true });
      if (PARAMS.get('autoplay') === '1') setPlaying(true);
    } else {
      S.view = PARAMS.get('view') === 'table' ? 'table' : 'audience';
      const g = PARAMS.get('game');
      if (g) loadGame(g, S.view, { useHash: true }); else { setPortraits(pics); render(); openList(); }
    }
  });
})();
</script>
</body>
</html>
