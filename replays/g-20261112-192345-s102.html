<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Inside Job</title>
<!--
  Inside Job replay viewer (docs/STAGE4.md, docs/STAGE4B.md). One file: HTML, CSS and JavaScript, no libraries,
  no fonts, no images. Characters and sets are SVG drawn in code; sound is synthesised with Web Audio.
  URL parameters: ?game=ID &view=audience|table &layout=wide|tall &autoplay=1 &clean=1 &rm=1 (reduced motion)
  &scene_t=end (hold every scene on its last frame, for screenshots) &audit=1 &classic=1 (close-up speaker and the old
  vote line-up instead of the table scene) &thoughts=full (every private thought in full in the diary room, instead
  of its opening: at the table for intel, discussion and vote, in the diary room after a whisper) &meters=0 (no private-suspicion bars) ; #R2-S3 opens on that statement.
-->
<style>
:root {
  --bg: #0a2141;
  --bg-deep: #061529;
  --ink: #17122b;
  --line: #dcefff;
  --dim: #8db1d8;
  --faint: #4f77a3;
  --cyan: #5fd8ff;
  --amber: #ffb22e;
  --amber-deep: #e07a00;
  --mint: #43e4ad;
  --paper: #f3ead6;
  --paper-ink: #2a2238;
  --display: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --stamp: Impact, "Haettenschweiler", "Arial Black", "Avenir Next Condensed", sans-serif;
  --body: "Avenir Next", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --ctl-h: 58px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #02070f; color: var(--line); font-family: var(--body); overflow: hidden; }
button, select { font-family: var(--mono); }
.hidden { display: none !important; }

/* ------------------------------------------------------------------ stage */
#viewport { position: fixed; left: 0; top: 0; right: 0; bottom: var(--ctl-h); overflow: hidden; }
body.clean #viewport { bottom: 0; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg-deep); }
#stage.wide { width: 1920px; height: 1080px; }
#stage.tall { width: 1080px; height: 1920px; }
#scene, #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#hud { pointer-events: none; z-index: 20; }
.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.abs { position: absolute; }
.anim { will-change: transform, opacity; }

/* ------------------------------------------------------------------ characters */
.ch { position: absolute; }
.ch > .breath { position: absolute; inset: 0; animation: breathe 3.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.ch svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes breathe { from { transform: translateY(0) scaleY(1); } to { transform: translateY(-0.6%) scaleY(1.008); } }
.ch.flip > .breath > svg { transform: scaleX(-1); }
.ch svg .m { display: none; }
.ch svg[data-m="rest"] .m-rest, .ch svg[data-m="a"] .m-a, .ch svg[data-m="b"] .m-b, .ch svg[data-m="c"] .m-c { display: inline; }
.ch svg .eyes-c { display: none; }
.ch svg.blink .eyes-c { display: inline; }
.ch svg.blink .eyes-o { display: none; }
.ch.port.out svg { opacity: .55; }
.ch.port.talking svg { animation: tbob .16s ease-in-out infinite alternate; }
@keyframes tbob { from { transform: translateY(0); } to { transform: translateY(-1.6%); } }
body.rm .ch > .breath, body.rm .ch.port.talking svg { animation: none; }

/* ------------------------------------------------------------------ hud */
.hud-l { position: absolute; padding: 10px 26px 10px 14px; margin: -10px 0 0 -14px; border-radius: 10px; background: linear-gradient(90deg, rgba(3,9,20,.78), rgba(3,9,20,.55) 70%, rgba(3,9,20,0)); }
.logo { font-family: var(--display); font-weight: 800; letter-spacing: .26em; color: var(--line); line-height: 1; }
.logo b { color: var(--amber); font-weight: 800; }
.hud-ph { font-family: var(--mono); color: var(--dim); letter-spacing: .18em; margin-top: 8px; white-space: nowrap; }
.hud-ph span { color: var(--cyan); margin-left: 14px; }
.hud-gid { font-family: var(--mono); font-size: 13px; color: rgba(141,177,216,.7); letter-spacing: .06em; margin-top: 5px; white-space: nowrap; }
.hud-r { position: absolute; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.score { display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; white-space: nowrap; }
.sc { display: flex; align-items: center; gap: 6px; padding: 6px 12px 5px; border-radius: 7px; background: rgba(3,9,20,.82); border: 2px solid; }
.sc.cl { color: var(--mint); } .sc.bl { color: var(--amber); } .sc.pt { color: var(--line); border-color: rgba(220,239,255,.35); }
.sc i { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; transform: rotate(45deg); margin: 0 2px; }
.sc i.on { background: currentColor; }
.sc b { color: var(--line); font-weight: 700; margin-left: 4px; }
.viewtag { font-family: var(--mono); font-size: 14px; letter-spacing: .2em; color: var(--dim); border: 1.5px solid rgba(141,177,216,.5); border-radius: 4px; padding: 4px 10px; background: rgba(3,9,20,.6); white-space: nowrap; }
.livetag { font-family: var(--mono); font-size: 15px; letter-spacing: .16em; color: var(--mint); white-space: nowrap; background: rgba(3,9,20,.7); padding: 3px 8px; border-radius: 4px; }
.livetag .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mint); margin-right: 8px; animation: blink 1.4s infinite; }
.livetag .wait { color: var(--dim); margin-left: 10px; letter-spacing: .06em; }
@keyframes blink { 50% { opacity: .2; } }
body.rm .livetag .dot { animation: none; }

/* ------------------------------------------------------------------ shared pieces */
.chip { display: inline-block; font-family: var(--mono); font-weight: 700; letter-spacing: .14em; padding: 4px 12px 3px; border-radius: 4px; white-space: nowrap; line-height: 1.1; }
.chip.mole { background: var(--amber); color: #2a1600; }
.chip.crew { background: var(--mint); color: #022a1d; }
.chip.hid { border: 2px solid rgba(220,239,255,.45); color: var(--dim); }
.txtbox { position: absolute; overflow: hidden; }
.typed .rest { color: transparent; }
.typed .rest mark, .typed .rest .lie { color: transparent; background: none; box-shadow: none; }
.lie { background: rgba(255,178,46,.18); box-shadow: inset 0 -4px 0 var(--amber); color: #fff3dc; }
.stamp { position: relative; display: inline-block; font-family: var(--stamp); text-transform: uppercase; letter-spacing: .04em; line-height: 1; padding: .12em .32em .08em; border: .09em solid currentColor; border-radius: .12em; white-space: nowrap; text-align: center; }
.stamp.amber { color: var(--amber); background: rgba(40,18,0,.82); box-shadow: 0 .1em .5em rgba(0,0,0,.5); }
.stamp.mint { color: var(--mint); background: rgba(0,32,22,.82); box-shadow: 0 .1em .5em rgba(0,0,0,.5); }
.stamp.white { color: #f4f8ff; background: rgba(4,10,22,.85); box-shadow: 0 .1em .5em rgba(0,0,0,.5); }
.stamp.solid-amber { color: #2b1500; background: var(--amber); border-color: var(--amber); }
.stamp.solid-mint { color: #00261a; background: var(--mint); border-color: var(--mint); }
.stamp.big { border-width: .07em; }
.anc { pointer-events: none; }
.anc > .ctr { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
.flash, .iris, .alarmtint, .dimmer { position: absolute; pointer-events: none; }
.iris { background: #000; }
.alarmtint { background: radial-gradient(ellipse at 50% 50%, rgba(255,60,20,0) 30%, rgba(255,60,20,.9) 100%); }
.dimmer { background: rgba(2,6,14,.55); }
.flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; overflow: hidden; }
.face.back { transform: rotateY(180deg); }
.cardback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d2f5a; border: 5px solid #04070e; border-radius: 16px; box-shadow: inset 0 0 0 6px #163f73;
  background-image: linear-gradient(rgba(95,216,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(95,216,255,.12) 1px, transparent 1px); background-size: 20px 20px; }
.cardface { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border: 5px solid #04070e; border-radius: 16px; font-family: var(--stamp); font-size: 44px; letter-spacing: .04em; }
.cardface.help { background: var(--mint); color: #003524; }
.cardface.sab { background: var(--amber); color: #3a1800; }
.cardface.count { background: #e9eef6; color: #10203a; }
.cardface.count small { font-family: var(--mono); font-size: 16px; letter-spacing: .2em; }
.cf-who { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; color: #0a0612; }
.cf-big { font-size: 64px; }
.plate { position: relative; text-align: center; font-family: var(--display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ac);
  background: linear-gradient(#162a49, #0b1a31); border: 3px solid #04070e; border-top: 4px solid var(--ac); border-radius: 6px; padding: 6px 8px 5px; line-height: 1; box-shadow: 0 8px 0 #050a14, 0 14px 22px rgba(0,0,0,.5); white-space: nowrap; }
.plate.out { color: #8293a8; border-top-color: #6d7d92; }
.plate-out { font-family: var(--mono); font-size: .5em; letter-spacing: .12em; color: #a5b4c8; margin-top: 5px; }
.plate-out b { color: #2a1600; background: var(--amber); padding: 1px 6px; border-radius: 3px; }
.plate-out b.c { background: var(--mint); color: #022a1d; }
.plate-m { font-family: var(--mono); font-weight: 400; font-size: .5em; letter-spacing: .02em; color: var(--line); margin-top: 6px; text-transform: none; }
.plate-m .chip { font-size: .9em; padding: 1px 5px; margin-left: 4px; letter-spacing: .08em; }
.plate.onjob { border-bottom: 0; padding-bottom: 0; }
.plate-job { margin: 5px -8px 0; background: var(--cyan); color: #00121f; font-family: var(--mono); font-weight: 800; font-size: .48em; letter-spacing: .2em; padding: 3px 0 2px; border-radius: 0 0 3px 3px; }
.plate-intel { margin: 5px -8px 0; background: #e9e2cf; color: #2a2238; font-family: var(--mono); font-weight: 800; font-size: .46em; letter-spacing: .16em; padding: 3px 0 2px; border-radius: 0 0 3px 3px; }
.leadbadge { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-weight: 800; letter-spacing: .12em; color: #10203a; background: linear-gradient(#ffffff, #c9d9ee); border: 2.5px solid #0a1a33; border-radius: 30px; padding: 3px 12px 3px 5px; box-shadow: 0 5px 12px rgba(0,0,0,.5); white-space: nowrap; }
.caption { background: rgba(4,12,26,.92); border: 3px solid #04070e; border-left: 12px solid var(--ac); border-radius: 12px; padding: 14px 26px; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
.cap-h { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; white-space: nowrap; }
.cap-n { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .06em; text-transform: uppercase; color: var(--ac); }
.cap-id { font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--dim); }
.cap-t { font-weight: 600; line-height: 1.34; color: #f2f7ff; overflow: hidden; }
.cap-t b { color: #fff; }

/* table shot */
.board { background: #3a2a1c; border: 6px solid #1a120b; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.45);
  background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px); background-size: 9px 9px; }
.board-h { position: absolute; left: 18px; top: 10px; right: 18px; font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .14em; color: #f3ead6; white-space: nowrap; }
.board-h span { float: right; font-family: var(--mono); font-size: 14px; letter-spacing: .08em; margin-top: 10px; color: #d8c8a8; }
.slot { border-radius: 6px; }
.slot.empty { border: 3px dashed rgba(243,234,214,.28); }
.slot-e { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: rgba(243,234,214,.35); }
.slot.clean, .slot.blown { background: var(--paper); box-shadow: 0 6px 0 rgba(0,0,0,.3); transform: rotate(-2deg); }
.slot-r { position: absolute; left: 10px; top: 6px; font-family: var(--mono); font-size: 13px; color: #6a5f50; }
.slot-n { position: absolute; left: 10px; right: 8px; top: 24px; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.05; color: var(--paper-ink); overflow: hidden; max-height: 2.2em; }
.slot-st { position: absolute; right: 6px; bottom: 6px; font-family: var(--stamp); font-size: 20px; padding: 0 5px; border: 3px solid currentColor; border-radius: 4px; transform: rotate(-8deg); }
.slot.clean .slot-st { color: #0f9c6c; }
.slot.blown .slot-st { color: var(--amber-deep); }
.pin { position: absolute; left: 50%; top: -9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a7a, #b3241a); box-shadow: 0 3px 4px rgba(0,0,0,.5); z-index: 2; }
.jobcard { background: var(--paper); border-radius: 8px; padding: 18px 22px; color: var(--paper-ink); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
.jc-k { font-family: var(--mono); font-size: 14px; letter-spacing: .14em; color: #7a6f60; }
.jc-n { font-family: var(--display); font-weight: 800; line-height: 1; margin: 8px 0 10px; text-transform: uppercase; }
.jc-t { font-family: var(--mono); font-size: 15px; letter-spacing: .06em; color: #5a5040; }
.jc-t b { -webkit-text-stroke: .6px rgba(0,0,0,.55); }
.potbag { position: relative; width: 200px; height: 190px; }
.pot-tag { position: absolute; right: -34px; top: 34px; transform: rotate(10deg); background: var(--paper); color: var(--paper-ink); border: 3px solid #120b04; border-radius: 6px; padding: 4px 12px; font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-align: center; box-shadow: 0 6px 12px rgba(0,0,0,.4); }
.pot-tag b { display: block; font-family: var(--display); font-size: 40px; line-height: .95; letter-spacing: 0; }
.bigtitle { text-align: center; white-space: nowrap; }
.bt-k { font-family: var(--mono); font-size: 22px; letter-spacing: .32em; color: var(--cyan); }
.bt-n { font-family: var(--stamp); color: #fff; line-height: 1; letter-spacing: .03em; text-shadow: 0 8px 0 rgba(0,0,0,.45); margin: 6px 0; }
.bt-s { font-family: var(--mono); font-size: 22px; letter-spacing: .14em; color: var(--line); }
.bt-s b { font-family: var(--display); font-size: 1.3em; letter-spacing: .06em; text-transform: uppercase; }
.clue { background: var(--paper); border: 4px solid #1a1206; border-radius: 12px; box-shadow: 0 12px 0 rgba(0,0,0,.3), 0 20px 40px rgba(0,0,0,.5); padding: 14px 18px; color: var(--paper-ink); display: flex; flex-direction: column; }
.clue-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 3px solid #2a2238; padding-bottom: 6px; white-space: nowrap; }
.clue-h b { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; }
.clue-h span { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: #6a6070; }
.clue-t { font-family: var(--serif); line-height: 1.2; margin-top: 10px; overflow: hidden; flex: 1 1 auto; }
.casefile { background: #efe6cf; color: #2a2238; border: 5px solid #1a1206; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.7); padding: 26px 36px; }
.cf-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 4px double #2a2238; padding-bottom: 10px; white-space: nowrap; }
.cf-h b { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: .12em; }
.cf-h span { font-family: var(--mono); font-size: 15px; letter-spacing: .16em; color: #6a6070; }
.cf-t { font-family: var(--serif); line-height: 1.42; margin-top: 16px; overflow: hidden; }

/* speaker */
.dlg { background: linear-gradient(rgba(6,16,34,.95), rgba(3,9,20,.97)); border: 4px solid #04070e; outline: 3px solid var(--ac); outline-offset: -10px; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
.dlg-t { position: absolute; left: 46px; right: 46px; top: 40px; bottom: 32px; font-weight: 600; line-height: 1.34; color: #f4f8ff; overflow: hidden; }
.dlg-t.silent { color: var(--dim); font-style: italic; }
.nametab { display: flex; align-items: center; gap: 16px; background: var(--ac); border: 4px solid #04070e; border-radius: 12px; padding: 4px 20px 4px 24px; box-shadow: 0 10px 0 rgba(0,0,0,.35); transform-origin: 0 100%; white-space: nowrap; }
.nt-name { font-family: var(--display); font-weight: 800; color: #0a0612; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.nt-model { font-family: var(--mono); color: #0a0612; background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 6px; letter-spacing: .02em; }
.nametab .chip { border: 3px solid #04070e; }
.idrow { display: flex; gap: 10px; justify-content: flex-end; align-items: center; white-space: nowrap; }
.sid { font-family: var(--mono); font-size: 20px; letter-spacing: .14em; color: var(--line); background: #0b1c36; border: 2px solid #2b4a75; padding: 4px 10px; border-radius: 5px; }
.callout { font-family: var(--mono); font-size: 17px; letter-spacing: .1em; color: var(--cyan); border: 2px solid var(--cyan); padding: 4px 10px; border-radius: 5px; background: rgba(0,0,0,.55); }
.callout.claim { color: var(--line); border-color: rgba(220,239,255,.6); }
.callout.fbk { color: var(--amber); border-style: dashed; border-color: var(--amber); }
.accframe { background: radial-gradient(ellipse at 50% 40%, var(--acbg), #071224); border: 5px solid #04070e; outline: 4px solid var(--ac); outline-offset: -12px; border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.6); transform-origin: 50% 50%; }
.accin { position: absolute; left: 4%; right: 4%; top: 6%; bottom: 0; }
.accin .ch { inset: 0; }
.acclabel { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .14em; color: #fff; background: rgba(4,8,16,.92); padding: 7px 4px 8px; white-space: nowrap; overflow: hidden; }
.acclabel b { font-family: var(--display); font-size: 28px; letter-spacing: .06em; text-transform: uppercase; }
.teamrow { display: flex; gap: 14px; justify-content: center; }
.tmini { position: relative; width: 150px; height: 190px; border-radius: 14px; overflow: hidden; border: 4px solid #04070e; outline: 3px solid var(--ac); outline-offset: -9px; background: radial-gradient(ellipse at 50% 40%, var(--acbg), #071224); }
.tmini .ch { left: 4%; right: 4%; top: 4%; bottom: 0; }
.tmini span { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; background: rgba(4,8,16,.92); font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 0; color: var(--ac); }
.tlabel { font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .16em; color: var(--line); text-align: center; margin-bottom: 10px; }
.cluecard { background: var(--paper); border: 4px solid #1a1206; border-radius: 14px; box-shadow: 0 14px 0 rgba(0,0,0,.3), 0 24px 50px rgba(0,0,0,.55); padding: 18px 22px; color: var(--paper-ink); display: flex; flex-direction: column; }
.cc-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #2a2238; padding-bottom: 8px; white-space: nowrap; gap: 10px; }
.cc-h b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .12em; }
.cc-by { font-family: var(--mono); font-size: 14px; color: #6a6070; }
.cc-t { font-family: var(--serif); line-height: 1.18; margin-top: 14px; overflow: hidden; flex: 1 1 auto; }

/* diary */
.rec { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-weight: 800; font-size: 24px; letter-spacing: .16em; color: #fff; white-space: nowrap; }
.rec i { width: 20px; height: 20px; border-radius: 50%; background: #ff3b3b; }
.rec.dim i { opacity: .25; }
.diarysign { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .34em; color: var(--cyan); white-space: nowrap; }
.tc { font-family: var(--mono); font-size: 16px; letter-spacing: .1em; color: rgba(220,239,255,.7); white-space: nowrap; }
.thought { background: rgba(8,12,24,.9); border: 3px solid rgba(255,255,255,.12); border-top: 8px solid var(--ac); border-radius: 16px; padding: 20px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.7); display: flex; flex-direction: column; }
.th-h { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; white-space: nowrap; }
.th-n { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; color: var(--ac); }
.th-m { font-family: var(--mono); font-size: 18px; color: var(--line); }
.th-k { margin-left: auto; font-family: var(--mono); font-size: 14px; letter-spacing: .16em; color: var(--dim); }
.th-t { margin-top: 14px; font-family: var(--serif); font-style: italic; line-height: 1.38; color: #f6efe2; overflow: hidden; flex: 1 1 auto; }
.th-t.silent { color: var(--dim); }
.polaroid { background: #f4efe4; padding: 12px 12px 0; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.6); transform-origin: 50% 0; }
.pol-in { position: relative; width: 100%; aspect-ratio: 1 / 1; background: radial-gradient(ellipse at 50% 35%, #31507e, #0e1c33); overflow: hidden; }
.pol-in .ch { left: 0; right: 0; top: 4%; height: 110%; }
.pol-n { font-family: var(--display); font-weight: 800; font-size: 34px; text-align: center; letter-spacing: .06em; text-transform: uppercase; padding: 6px 0 8px; white-space: nowrap; overflow: hidden; }
.pct-k { font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
.pct-v { font-family: var(--display); font-weight: 800; font-size: 110px; line-height: .9; color: #fff; }
.pct-bar { height: 12px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; margin: 8px 0; width: 260px; }
.pct-bar i { display: block; height: 100%; background: var(--line); transform-origin: 0 50%; transform: scaleX(0); }
.pct-n { font-family: var(--mono); font-size: 17px; color: var(--dim); line-height: 1.35; }
.pct-n b { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .06em; }
.marks { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.mark { display: flex; flex-direction: column; justify-content: center; background: rgba(40,20,0,.86); border: 3px solid var(--amber); border-radius: 10px; padding: 8px 16px; transform-origin: 0 50%; flex: none; }
.mark b { font-family: var(--stamp); font-weight: 400; font-size: 1.5em; color: var(--amber); letter-spacing: .06em; line-height: 1; }
.mark span { font-family: var(--body); font-weight: 600; color: #ffe8c2; margin-top: 4px; line-height: 1.2; }
.actcard { background: rgba(8,12,24,.9); border: 3px solid rgba(255,255,255,.14); border-left: 10px solid var(--ac); border-radius: 12px; padding: 14px 20px; font-family: var(--mono); font-size: 18px; letter-spacing: .1em; color: var(--dim); }
.actcard b { display: block; font-family: var(--display); font-size: 40px; letter-spacing: .04em; color: #fff; text-transform: uppercase; margin-top: 4px; white-space: nowrap; }
.actcard b.sab { color: var(--amber); } .actcard b.help { color: var(--mint); }

/* whisper */
.whead { text-align: center; }
.wh-k { font-family: var(--mono); font-size: 20px; letter-spacing: .3em; color: var(--dim); display: inline-flex; gap: 10px; align-items: center; white-space: nowrap; }
.wh-n { font-family: var(--display); font-weight: 800; font-size: 56px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; white-space: nowrap; }
.wh-n em { font-style: normal; color: var(--dim); margin: 0 18px; }
.wcol { display: flex; flex-direction: column; justify-content: flex-start; gap: .5em; overflow: hidden; }
.wb { position: relative; max-width: 90%; background: rgba(6,10,22,.96); border: 3px dashed var(--ac); border-radius: 20px; padding: .45em .8em .55em; box-shadow: 0 14px 30px rgba(0,0,0,.55); flex: none; }
.wb.l { align-self: flex-start; border-bottom-left-radius: 4px; }
.wb.r { align-self: flex-end; border-bottom-right-radius: 4px; }
.wb-n { font-family: var(--display); font-weight: 800; font-size: .8em; letter-spacing: .1em; text-transform: uppercase; color: var(--ac); }
.wb-n .wlie { margin-left: .6em; font-family: var(--stamp); font-weight: 400; color: #2b1500; background: var(--amber); padding: 0 .3em; border-radius: 3px; letter-spacing: .06em; }
.wb-t { font-style: italic; font-weight: 500; line-height: 1.3; color: #e9eefc; }
.wb-c { font-family: var(--serif); font-size: .82em; margin-top: .3em; color: var(--paper); }
.wb-c b { font-family: var(--mono); font-size: .8em; letter-spacing: .12em; color: var(--dim); margin-right: .4em; }
.wb-c b.fk { color: var(--amber); }
.wdots { display: inline-flex; gap: .35em; vertical-align: middle; padding: .3em 0; }
.wdots i { width: .55em; height: .55em; border-radius: 50%; background: #6a7a9a; animation: wdot 1.2s ease-in-out infinite; }
.wdots i:nth-child(2) { animation-delay: .2s; } .wdots i:nth-child(3) { animation-delay: .4s; }
@keyframes wdot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.25em); opacity: 1; } }
body.rm .wdots i { animation: none; }
.wfoot { text-align: center; font-family: var(--mono); font-size: 18px; letter-spacing: .12em; color: var(--dim); }
.wfoot b { color: var(--line); }
.wpanel { border: 3px solid rgba(220,239,255,.14); border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #12305a, #050c1a); }
.wp-n { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.wp-n em { font-style: normal; color: var(--dim); margin: 0 10px; }
.wp-b { background: rgba(6,10,22,.94); border: 3px dashed rgba(220,239,255,.5); border-radius: 18px; padding: 4px 16px; font-size: 30px; }

/* job reveal */
.jobtitle { text-align: center; white-space: nowrap; }
.jt-k { font-family: var(--mono); font-size: 20px; letter-spacing: .3em; color: var(--cyan); }
.jt-n { font-family: var(--display); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.4); }
.jt-l { font-family: var(--mono); font-size: 18px; letter-spacing: .18em; color: var(--dim); margin-top: 6px; }
.jt-l b { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .06em; }
.verdict-sub { font-family: var(--mono); font-weight: 800; letter-spacing: .24em; padding: 6px 16px; border-radius: 6px; white-space: nowrap; }
.verdict-sub.a { color: #2b1500; background: var(--amber); }
.verdict-sub.m { color: #00261a; background: var(--mint); }

/* vote */
.vname { font-family: var(--display); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0,0,0,.6); white-space: nowrap; color: var(--ac); }
.vback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d2f5a; border: 4px solid #04070e; border-radius: 12px; font-family: var(--mono); font-weight: 800; font-size: 20px; letter-spacing: .3em; color: var(--cyan); }
.vface { position: absolute; inset: 0; background: var(--paper); border: 4px solid #04070e; border-bottom: 9px solid var(--ac); border-radius: 12px; text-align: center; padding-top: 6px; overflow: hidden; }
.vf-k { font-family: var(--mono); font-size: 13px; letter-spacing: .2em; color: #6a6070; white-space: nowrap; }
.vf-n { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: 1.05; color: var(--ac); -webkit-text-stroke: 1.2px #1a1426; white-space: nowrap; }
.tally span { display: flex; align-items: center; justify-content: center; width: 78px; height: 78px; border-radius: 50%; background: var(--ac); border: 5px solid #04070e; font-family: var(--display); font-weight: 800; font-size: 54px; color: #0a0612; box-shadow: 0 8px 0 rgba(0,0,0,.4); }
.rback { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; }
.rback > div:first-child { position: absolute; left: 0; right: 0; top: 24px; text-align: center; z-index: 2; font-family: var(--mono); font-weight: 800; font-size: 24px; letter-spacing: .4em; color: var(--line); }
.rface { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid #04070e; border-radius: 16px; text-align: center; }
.rface.mole { background: var(--amber); color: #2b1500; }
.rface.crew { background: var(--mint); color: #00261a; }
.rface.unk { background: #c9d3e2; color: #10203a; }
.rf-n { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: .08em; text-transform: uppercase; }
.rf-r { font-family: var(--stamp); font-size: 120px; line-height: 1; margin: 10px 0; }
.rf-s { font-family: var(--mono); font-size: 17px; letter-spacing: .1em; }
.outlbl { font-family: var(--display); font-weight: 800; font-size: 72px; letter-spacing: .06em; color: #fff; text-transform: uppercase; white-space: nowrap; text-shadow: 0 6px 0 rgba(0,0,0,.5); }
.tallyboard { background: rgba(4,10,22,.88); border: 3px solid rgba(220,239,255,.18); border-radius: 16px; padding: 18px 24px; }
.tb-h { font-family: var(--mono); font-size: 18px; letter-spacing: .24em; color: var(--dim); margin-bottom: 12px; white-space: nowrap; }
.tb-row { display: flex; align-items: center; gap: 14px; height: 54px; }
.tb-row .n { width: 190px; font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .05em; text-transform: uppercase; color: var(--ac); white-space: nowrap; overflow: hidden; }
.tb-row .bar { height: 30px; background: var(--ac); border: 3px solid #04070e; border-radius: 6px; transform-origin: 0 50%; }
.tb-row .c { font-family: var(--display); font-weight: 800; font-size: 34px; color: #fff; }

/* the table: discussion, vote and vote-out with everyone seated */
.bub { position: absolute; display: flex; flex-direction: column; background: var(--paper); color: var(--paper-ink); border: 5px solid #0a0612; border-radius: 28px; box-shadow: 0 22px 46px rgba(0,0,0,.55); }
.bub-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 20px 0 16px; white-space: nowrap; }
.bub-n { font-family: var(--display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1; color: #0a0612; background: var(--ac); border: 3px solid #0a0612; border-radius: 10px; padding: 5px 14px 3px; box-shadow: 0 4px 0 rgba(0,0,0,.28); }
.bub-m { font-family: var(--mono); color: #5a5040; letter-spacing: .02em; }
.bub-h .chip { border: 2.5px solid #0a0612; }
.bub-sid { margin-left: auto; padding-left: 12px; font-family: var(--mono); letter-spacing: .12em; color: #8a7f6c; }
.bub-tag { font-family: var(--mono); font-weight: 700; font-size: .82em; letter-spacing: .08em; color: #2a2238; border: 2px solid #2a2238; border-radius: 5px; padding: 2px 8px 1px; white-space: nowrap; }
.bub-tag b { text-transform: uppercase; }
.bub-tag.fbk { color: #9a4a00; border-style: dashed; border-color: #9a4a00; }
.bub-t { padding: 8px 26px 18px; font-weight: 600; line-height: 1.3; overflow: hidden; }
.bub-t .pn { font-weight: 800; }
.bub-t.silent { color: #8a8070; font-style: italic; }
.bub .lie { background: rgba(255,178,46,.5); box-shadow: inset 0 -4px 0 var(--amber-deep); color: #2a1600; }
.pile { position: absolute; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 3px; }
.pchip { display: flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; background: var(--ac); border: 3px solid #0a0612; color: #0a0612; font-family: var(--mono); font-weight: 800; line-height: 1; box-shadow: 0 3px 0 rgba(0,0,0,.5); }
.pchip.ballot { border-radius: 5px; background: var(--paper); border-bottom: 8px solid var(--ac); }
.arw-tag { font-family: var(--mono); font-weight: 800; letter-spacing: .12em; color: #f4f8ff; background: rgba(4,10,22,.95); border: 3px solid var(--ac); border-radius: 30px; padding: 5px 16px 4px; white-space: nowrap; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
.arw-tag.priv { border-style: dashed; }
.arw-tag b { font-family: var(--display); font-size: 1.4em; letter-spacing: .05em; text-transform: uppercase; }
.tcard { background: var(--paper); border: 4px solid #1a1206; border-radius: 12px; box-shadow: 0 8px 0 rgba(0,0,0,.3), 0 16px 34px rgba(0,0,0,.5); padding: 8px 14px 10px; color: var(--paper-ink); display: flex; flex-direction: column; }
.tc-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2.5px solid #2a2238; padding-bottom: 4px; white-space: nowrap; overflow: hidden; }
.tc-h b { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .12em; }
.tc-h span { font-family: var(--mono); font-size: 12px; color: #6a6070; }
.tc-t { font-family: var(--serif); line-height: 1.16; margin-top: 6px; overflow: hidden; flex: 1 1 auto; }
.tc-more { position: absolute; right: 12px; bottom: 5px; font-family: var(--mono); font-size: 12px; color: #6a6070; }
.outsub { font-family: var(--mono); letter-spacing: .14em; color: var(--line); margin-top: 6px; white-space: nowrap; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.vline { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 0; width: max-content; margin: 0 auto; }
.vline .vt + .vt::before { content: "·"; margin: 0 .7em; color: var(--dim); }
.vline i { font-style: normal; font-family: var(--display); font-weight: 800; font-size: 1.3em; color: #fff; }
.bub.think { background: rgba(9,14,30,.97); color: #f6efe2; border-color: #b9c6e6; }
.bub.think .bub-t { font-family: var(--serif); font-style: italic; font-weight: 400; line-height: 1.34; }
.bub.think .bub-m { color: var(--line); }
.bub.think .bub-sid { color: var(--dim); }
.bub.think .bub-tag { color: var(--line); border-color: rgba(185,198,230,.6); }
.smeter { position: absolute; height: 21px; border-radius: 11px; background: #22344f; border: 2.5px solid #04070e; overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,.45); }
.smeter i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; }
.smeter b { position: absolute; right: 6px; top: 0; font-family: var(--mono); font-weight: 800; font-size: 13px; line-height: 16px; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
.mlegend { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--dim); white-space: nowrap; background: rgba(3,9,20,.6); padding: 2px 8px; border-radius: 4px; }
.mlegend i { display: inline-block; width: 22px; height: 9px; border-radius: 5px; margin-right: 8px; background: linear-gradient(90deg, #7fa8d8, #ff3a48); vertical-align: middle; }

/* finale */
.fintitle { text-align: center; white-space: nowrap; }
.ft-k { font-family: var(--mono); font-size: 20px; letter-spacing: .4em; color: var(--dim); }
.ft-n { font-family: var(--stamp); letter-spacing: .04em; color: #fff; line-height: 1; text-shadow: 0 6px 0 rgba(0,0,0,.45); }
.ft-n em { font-style: normal; color: var(--cyan); font-size: .7em; margin: 0 .2em; }
.pitch { background: rgba(6,12,26,.94); border: 3px solid #04070e; border-top: 8px solid var(--ac); border-radius: 14px; padding: 12px 22px; box-shadow: 0 20px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; }
.pi-h { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.pi-h span { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: .06em; text-transform: uppercase; color: var(--ac); }
.pi-h em { font-style: normal; font-family: var(--mono); font-size: 15px; color: var(--dim); letter-spacing: .04em; }
.pi-t { font-weight: 600; line-height: 1.3; color: #f2f7ff; overflow: hidden; margin-top: 4px; flex: 1 1 auto; }
.payout { font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1; padding: 6px 24px; border-radius: 18px; border: 6px solid #04070e; box-shadow: 0 10px 0 rgba(0,0,0,.4); white-space: nowrap; }
.payout.zero { background: #24324a; color: #9aaccc; }
.payout.win { background: #f4f8ff; color: #10203a; }
.payout small { display: block; font-family: var(--mono); font-size: 14px; letter-spacing: .2em; font-weight: 400; margin-bottom: 2px; }

/* end + cast */
.endbanner { text-align: center; white-space: nowrap; }
.eb-k { font-family: var(--mono); font-size: 20px; letter-spacing: .2em; color: rgba(220,239,255,.75); }
.eb-w { font-family: var(--stamp); line-height: 1; letter-spacing: .04em; }
.eb-w.crew { color: var(--mint); text-shadow: 0 8px 0 #04241a; }
.eb-w.moles { color: var(--amber); text-shadow: 0 8px 0 #2a1500; }
.eb-w.none { color: #fff; text-shadow: 0 8px 0 #000; }
.eb-r { font-family: var(--mono); letter-spacing: .08em; color: #dff; }
.castback { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; }
.castcard { position: absolute; inset: 0; background: linear-gradient(#10264a, #071328); border: 5px solid #04070e; border-top: 10px solid var(--ac); border-radius: 16px; text-align: center; overflow: hidden; }
.castcard.mole { background: linear-gradient(#4a2a00, #1c0e00); box-shadow: inset 0 0 0 4px var(--amber); }
.cc-port { position: relative; height: 54%; background: radial-gradient(ellipse at 50% 40%, var(--acbg), transparent 70%); overflow: hidden; }
.cc-port .ch { left: 2%; right: 2%; top: 4%; bottom: 0; }
.cc-name { font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; margin-top: 8px; color: var(--ac); white-space: nowrap; }
.cc-model { font-family: var(--mono); font-size: 16px; color: var(--line); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.cc-role { margin-top: 10px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.cc-out { font-family: var(--mono); font-size: 14px; color: var(--dim); letter-spacing: .08em; }
.cc-pay { position: absolute; left: 0; right: 0; bottom: 10px; font-family: var(--display); font-weight: 800; font-size: 38px; color: #51627e; }
.cc-pay.win { color: #fff; font-size: 50px; }
.cc-pay small { display: block; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .2em; color: #51627e; margin-bottom: 2px; }
.endfoot { text-align: center; font-family: var(--mono); font-size: 19px; letter-spacing: .08em; color: var(--dim); }
.endfoot b { font-family: var(--display); font-size: 1.25em; letter-spacing: .04em; }
.lineup-h { text-align: center; white-space: nowrap; }

/* ------------------------------------------------------------------ controls */
#controls { position: fixed; left: 0; right: 0; bottom: 0; height: var(--ctl-h); display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #06121f; border-top: 1px solid #1d3a5c; font-size: 13px; z-index: 5; overflow-x: auto; overflow-y: hidden; font-family: var(--mono); }
#controls > * { flex-shrink: 0; }
#controls > #timeline { flex-shrink: 1; }
body.clean #controls { display: none; }
#controls button, #controls select { background: #0d2440; color: var(--line); border: 1px solid #2c5582; padding: 6px 10px; font-size: 13px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
#controls button:hover { border-color: var(--cyan); }
#controls button.on { background: var(--cyan); color: #04121f; border-color: var(--cyan); }
#controls button.live-on { background: var(--mint); color: #04121f; border-color: var(--mint); }
#controls .grp { display: flex; gap: 2px; }
#timeline { position: relative; flex: 1 1 auto; height: 30px; cursor: pointer; min-width: 120px; touch-action: none; }
#tl-track { position: absolute; left: 0; right: 0; top: 13px; height: 4px; background: #1d3a5c; }
#tl-fill { position: absolute; left: 0; top: 13px; height: 4px; width: 100%; background: var(--cyan); transform-origin: 0 50%; transform: scaleX(0); }
#tl-head { position: absolute; left: 0; top: 7px; width: 4px; height: 16px; background: #fff; margin-left: -2px; }
.tl-mark { position: absolute; top: 2px; height: 26px; border-left: 1px solid #5b86b6; font-size: 10px; color: #8db1d8; padding-left: 3px; line-height: 10px; pointer-events: none; }
#pos { color: var(--dim); min-width: 74px; text-align: right; }

/* ------------------------------------------------------------------ game list */
#list { position: fixed; inset: 0; z-index: 10; background: rgba(3,11,22,.97); overflow-y: auto; padding: 36px 5vw 80px; font-family: var(--mono); }
#list h1 { font-size: 26px; letter-spacing: .3em; margin: 0 0 6px; }
#list .sub { color: var(--dim); margin-bottom: 22px; font-size: 14px; }
#list table { width: 100%; border-collapse: collapse; font-size: 14px; }
#list th { text-align: left; color: var(--dim); font-weight: 400; letter-spacing: .12em; border-bottom: 1px solid #2c5582; padding: 8px; }
#list td { padding: 9px 8px; border-bottom: 1px solid #13304f; vertical-align: top; }
#list td:not(:last-child) { white-space: nowrap; }
#list tr.g { cursor: pointer; }
#list tr.g:hover td { background: #0b2340; }
#list .st-live { color: var(--mint); }
#list .st-stop { color: var(--dim); }
#list .w-moles { color: var(--amber); }
#list .w-crew { color: var(--mint); }
#list button { background: #0d2440; color: var(--line); border: 1px solid #2c5582; padding: 6px 12px; cursor: pointer; }

<script id="ij-core">

"use strict";

// Reading pace: a text beat lasts at least words / READ_WPS + 1 seconds at 1x (the speed control scales it).

function words(s) {
  s = (s == null ? "" : String(s)).trim();

}

// Turns staged at the table (discussion and vote); their private thoughts can be shown there in short form.

// in the diary room. A turn that carries a lie always keeps its full thought. Other thoughts (the job, the cut
// vote, the final choice, the pick and the pitches) are never shortened.
var TABLE_THOUGHTS = { discuss: 1, vote: 1, debate: 1, final_accuse: 1 };
var THOUGHT_WORDS = 26;
// The opening of a thought: whole sentences from the start while they fit in maxWords (always the first

  var total = words(text);

  var re = /[.!?]+["')\]]*(?=\s|$)/g, m, end = 0, first = true;

    var stop = m.index + m[0].length;
    var n = words(text.slice(0, stop));
    if (first && n > maxWords + 8) break;
    if (!first && n > maxWords) break;
    end = stop; first = false;
  }
  if (!end) {
    var parts = text.split(/\s+/).slice(0, maxWords);
    var at = 0;
    for (var k = 0; k < parts.length; k++) at = text.indexOf(parts[k], at) + parts[k].length;
    end = at;

    sabTarget: rules.sabotage_target == null ? null : rules.sabotage_target, pot: null, numMoles: null, moles: [],
    team: null, jobName: null, jobResult: null, jobs: [], pairs: [], intel: {}, intelDealt: false, choices: null, accused: {},
    accusing: {}, ballots: {}, beliefs: {}, finalists: null, finale: null, cutSeen: false, finaleSeen: false, anonymised: false, gameId: null, seed: null };

  function snap() {
    return { round: W.round, phase: W.phase, pass: W.pass, leader: W.leader, seats: W.seats.slice(), alive: W.alive.slice(),

      sabTarget: W.sabTarget, pot: W.pot, numMoles: W.numMoles, moles: W.moles.slice(), team: W.team ? W.team.slice() : null,
      jobName: W.jobName, jobResult: W.jobResult, jobs: W.jobs.slice(), pairs: W.pairs.map(function (p) { return p.slice(); }),
      intel: Object.assign({}, W.intel), choices: W.choices, accused: Object.assign({}, W.accused),
      accusing: Object.assign({}, W.accusing), ballots: Object.assign({}, W.ballots), beliefs: Object.assign({}, W.beliefs),

  }
  // n: words of text the beat shows (0 for a reveal); extra: staging seconds on top of the reading time

  function add(i, e, kind, sub, n, extra, data) {

    (e._cards || []).forEach(function (t) { n += 2 + words(t); });

  }

  for (var i = 0; i < events.length; i++) {

    try {

      if (e.game_id && !W.gameId) W.gameId = e.game_id;

          break;
        }
        case "table": {
          if (!W.seats.length) { W.seats = (e.seats || []).slice(); W.alive = W.seats.slice(); }
          if (e.pot != null) W.pot = e.pot;
          if (e.num_moles != null) W.numMoles = e.num_moles;
          if (!aud) add(i, e, "cast", "cast", 8 + W.seats.length, 2.2, { seats: W.seats.slice(), numMoles: e.num_moles, pot: e.pot });

        }
        case "round_start": {
          W.leader = e.leader || null;
          if (e.alive) W.alive = e.alive.slice();
          if (e.clean_jobs != null) W.clean = e.clean_jobs;
          if (e.blown_jobs != null) W.blown = e.blown_jobs;
          W.team = null; W.jobName = null; W.jobResult = null; W.pairs = []; W.intel = {}; W.intelDealt = false;
          W.choices = null; W.accused = {}; W.accusing = {}; W.ballots = {}; W.pass = null;
          add(i, e, "round", "round", 0, 3.6, { leader: e.leader, alive: (e.alive || []).slice() });
          break;
        }
        case "clue_deal": {
          W.intelDealt = true;
          var cards = [];
          var rec = e.recipients || [];
          for (var j = i + 1; j < events.length; j++) {
            var c = events[j];
            if (!c || c.round !== e.round) break;

          }

          cards.forEach(function (c) { W.intel[c.player] = c.text; });
          var nw = 4;

          }

        }
        case "whisper_pairs": {

        case "game_end": {

            blown: e.blown_jobs, payouts: e.payouts || {}, survivors: e.survivors || [] });

          var pub = (e.public || "").trim();
          var conf = aud ? (e.confessional || "").trim() : "";
          var act = e.action || {};

          // accusing[player] = the player they most recently accused; ballots[voter] = who they voted for.
          // A say beat also carries what the speaker's accusation was before this turn (accusePrev).
          var sayData = {};

          // thought that follows carries the speaker's previous ones (beliefPrev), so the meters can move.
          var bel = aud && e.player && act.suspicion && typeof act.suspicion === "object"
            ? { kind: e.suspicion_kind || "belief", s: act.suspicion } : null;

          var lie = aud && isLie(e);

          if (tp === "whisper") {

            if (aud) {

                add(i, e, "diary", "c", words(exw.text) + 4, 1.1, priv);
              } else if (conf) add(i, e, "diary", "c", words(conf) + markWords(e) + 4, 1.1, priv);
            }

          var ap = e.approvals || {};

          var txt2 = (e.approved ? "Team approved" : "Team rejected") + " " + (e.approve != null ? e.approve : yes.length) + " to " +

        }
        case "final_accusation": {          // v0.4 (bot-only rules): shown as a caption

      // A malformed event never breaks playback; it just gets no beat.
    }

  } else if (tp === 'pick' && act.team && act.team.length) {
    const tw = L.wide ? 150 : 118, th = tw * 1.27, gap = 12, n = act.team.length;

    frame = box(root, rx, ry, rowW, th + 40, 'anim bx');
    frame.dataset.bx = 'team row';
    div(frame, 'tlabel', '', 'PICKS THE TEAM');
    const row = div(frame, 'teamrow', 'justify-content:flex-end;gap:' + gap + 'px');
    act.team.forEach(t => { const m = div(row, 'tmini', `--ac:${acc(t)};--acbg:${accBg(t)};width:${tw}px;height:${th}px`); mountChar(m, t, { expr: t === who ? 'smug' : 'pleased', blink: false }); m.insertAdjacentHTML('beforeend', `<span style="font-size:${L.wide ? 22 : 18}px">${nm(t)}</span>`); });
  } else if (tp === 'debate' && act.approve != null) {
    frame = anchor(root, L.wide ? 1690 : 920, L.wide ? 250 : 300, `<div class="stamp ${act.approve ? 'white' : 'white'}" style="font-size:${L.wide ? 64 : 54}px;transform:rotate(-6deg)">${act.approve ? 'APPROVE' : 'REJECT'}</div>`, 'anim');
  }
  // dialogue box, name tab, ids
  const bxX = L.wide ? 60 : 36, bxW = L.wide ? 1800 : 1008, bxY = L.wide ? 700 : 1196, bxH = L.wide ? 340 : 684;
  const dlg = box(root, bxX, bxY, bxW, bxH, 'dlg anim bx', null, `--ac:${ac}`);
  dlg.dataset.bx = 'dialogue';
  const tText = div(dlg, 'dlg-t typed');
  const nameTab = box(root, bxX + 24, bxY - (L.wide ? 74 : 82), 10, 10, 'nametab anim', null, `--ac:${ac};width:auto;height:auto;`);
  const mdl = aud ? modelOf(who) : '';
  nameTab.innerHTML = `<span class="nt-name" style="font-size:${L.wide ? 60 : 64}px">${nm(who)}</span>${mdl ? `<span class="nt-model" style="font-size:${L.wide ? 21 : 22}px">${esc(mdl)}</span>` : ''}${aud ? roleChip(roleOf(who), L.wide ? 21 : 22) : ''}`;
  const tags = [];
  if (e.statement_id) tags.push(`<span class="sid">${esc(e.statement_id)}</span>`);
  const phaseTag = { cut_pitch: 'PITCH FOR THE FINAL', final_accuse: 'FINAL ACCUSATION', debate: 'TEAM DEBATE' }[tp];
  if (phaseTag) tags.push(`<span class="callout claim">${phaseTag}</span>`);
  (act.challenges || []).slice(0, 3).forEach(c => tags.push(`<span class="callout">CALLS OUT ${esc(c)}</span>`));
  const marks = aud ? (e._marks || []) : [];
  const jf = marks.find(m => m[0] === 'job_false');
  if (act.job_claim === 'helped' || act.job_claim === 'sabotaged') tags.push(`<span class="callout claim">SAYS THEY ${esc(String(act.job_claim).toUpperCase())}</span>`);
  if (aud && e._fallback) tags.push(`<span class="callout fbk">[${esc(e._fallback)}]</span>`);
  const ids = box(root, L.wide ? bxX + bxW - 1100 : bxX + 200, bxY - (L.wide ? 50 : 56), L.wide ? 1080 : 790, 40, 'idrow anim', tags.join(''));
  // clue cards tabled with the statement (up to two shown), FAKE CARD stamps in the audience view
  const cardTexts = (e._cards || []).slice(0, 2);
  const cardMarks = marks.filter(m => m[0] === 'card_real' || m[0] === 'card_fake');
  const cards = [];
  cardTexts.forEach((txt, i) => {
    const cw = L.wide ? 460 : 400, ch = L.wide ? 290 : 262;
    const cx0 = (L.wide ? 990 : 640) + i * (L.wide ? 40 : 24), cy0 = (L.wide ? 210 : 840) + i * (L.wide ? 60 : 50);
    const fake = aud && cardMarks.some(m => m[0] === 'card_fake' && m[1] === txt);
    const card = box(root, cx0, cy0, cw, ch, 'cluecard anim', `<div class="cc-h"><b>CLUE CARD</b><span class="cc-by">tabled by ${nm(who)}</span></div>`);
    const ct = div(card, 'cc-t'); ct.textContent = txt;
    fitText(ct, L.wide ? 34 : 32, 18, 'clue card');
    let stamp = null;
    if (fake) stamp = anchor(root, cx0 + cw / 2 + 10, cy0 + ch * 0.74, `<div class="stamp amber" style="font-size:${L.wide ? 72 : 60}px;transform:rotate(-12deg)">FAKE CARD</div>`, 'anim');
    else if (aud && cardMarks.some(m => m[0] === 'card_real' && m[1] === txt)) stamp = anchor(root, cx0 + cw - 80, cy0 + ch - 40, `<div class="stamp mint" style="font-size:${L.wide ? 34 : 30}px;transform:rotate(-8deg)">REAL</div>`, 'anim');
    cards.push({ card, stamp, fake });
  });
  if ((e._cards || []).length > 2) cards[1].card.insertAdjacentHTML('beforeend', `<div class="cc-by" style="position:absolute;right:20px;bottom:10px">+${e._cards.length - 2} more</div>`);
  const lies = marks.filter(m => m[0] === 'lie').map(m => m[1]);
  const isLie = aud && (lies.length || jf || cards.some(c => c.fake));
  let lieTab = null;
  if (isLie) lieTab = anchor(root, bxX + bxW - (L.wide ? 150 : 130), bxY + bxH - (L.wide ? 40 : 46), `<div class="stamp solid-amber" style="font-size:${L.wide ? 44 : 46}px;transform:rotate(-6deg)">${jf && !lies.length && !cards.some(c => c.fake) ? 'FALSE CLAIM' : 'LIE'}</div>`, 'anim');
  const flash = box(root, 0, 0, L.W, L.H, 'flash anim', null, 'background:#fff;opacity:0;');

  // ---- timeline
  tl.set(panel, { x: L.wide ? -1200 : 0, y: L.wide ? 0 : -1300 }); tl.tw(panel, 0, 260, L.wide ? { x: [-1200, 0] } : { y: [-1300, 0] }, 'out5');
  slideIn(tl, sp.wrap, 100, L.wide ? -260 : 0, L.wide ? 0 : 160, 380, 'out5');
  tl.set(dlg, { o: 0 }); tl.tw(dlg, 220, 100, { o: [0, 1] }, 'lin'); tl.tw(dlg, 220, 300, { y: [60, 0] }, 'out5');
  slamIn(tl, nameTab, 340, 1.6, 170); tl.cue(360, 'thud');
  fadeIn(tl, ids, 480, 200);
  if (frame) slideIn(tl, frame, 460, 380, 0, 340, 'out5');
  const pub = (e.public || '').trim();
  const t0 = 650, cps = 32;
  let dur = 0;
  if (pub) {
    const segs = aud && lies.length ? segsWithMarks(pub, lies) : [{ text: pub }];
    dur = tl.type(tText, t0, segs, { cps, char: sp.c, pitch: 300 + (NAMES.indexOf(castOf(who).name) % 5) * 60 });
    if (!fitText(tText, L.wide ? 44 : 54, L.wide ? 22 : 24, 'dialogue')) ctx.over('dialogue');
  } else { tText.classList.add('silent'); tText.classList.remove('typed'); tText.textContent = '(says nothing)'; tText.style.fontSize = (L.wide ? 40 : 46) + 'px'; }
  const at = s => { const i = pub.indexOf(s); return i < 0 ? null : t0 + (RM ? 0 : i / cps * 1000); };
  if (target && frameChar) {
    const tAcc = at(target) ?? (t0 + dur * .4);
    exprAt(tl, tAcc, frameChar, 'shocked'); exprAt(tl, tAcc + 1300, frameChar, tp === 'vote' ? 'nervous' : 'suspicious');
    tl.tw(frame, tAcc, 260, { s: [1.1, 1] }, 'back');
    exprAt(tl, Math.max(t0, tAcc - 100), sp.c, 'accusing');
    exprAt(tl, t0 + dur + 200, sp.c, 'suspicious');
  } else exprAt(tl, t0 + dur + 200, sp.c, tp === 'pick' || tp === 'cut_pitch' ? 'pleased' : 'thinking');
  const tCards = t0 + Math.min(dur * .35, 2500);
  cards.forEach((c, i) => {
    tl.set(c.card, { o: 0, r: -4 + i * 5 }); tl.tw(c.card, tCards + i * 250, 100, { o: [0, 1] }, 'lin'); tl.tw(c.card, tCards + i * 250, 420, { x: [700, 0], r: [14, -4 + i * 5] }, 'out5'); tl.cue(tCards + i * 250, 'whoosh');
  });
  const tEnd = t0 + dur + 400;
  let tLast = tEnd;
  cards.forEach((c, i) => {
    if (!c.stamp) return;
    const ts = tEnd + i * 450;
    slamIn(tl, c.stamp, ts, 3, 170); tl.cue(ts + 120, 'thud');
    if (c.fake) { shakeFx(tl, cam, ts + 150, 340, 16); exprAt(tl, ts + 200, sp.c, 'smug'); }
    tLast = ts + 300;
  });
  if (lieTab) { slamIn(tl, lieTab, tLast + 300, 2.2, 160); tl.cue(tLast + 400, 'thud'); flashFx(tl, flash, tLast + 320, 260, .25); tLast += 700; }
  tl.hold(tLast + 600);
  return tl;
};

/* ---------------------------------------------------------------- DIARY ROOM ---- */
const DIARY_CTX = { clue: 'INTEL PHASE', whisper: 'AFTER A WHISPER', pick: 'THE PICK', job: 'ON THE JOB', discuss: 'DISCUSSION', vote: 'THE VOTE',
  cut_pitch: 'THE CUT', cut_vote: 'CUT VOTE', finale_pitch: 'FINALE PITCH', finale_choice: 'FINAL CHOICE', debate: 'TEAM DEBATE', final_accuse: 'FINAL ACCUSATION' };
SCENES.diary = ctx => {
  const { root, L, b } = ctx, e = b.ev, tl = new Timeline(), act = e.action || {}, tp = e.turn_phase, who = e.player;
  const cam = div(root, 'layer anim');
  const W = L.W, H = L.H, lx = L.wide ? 450 : 540;
  // a darker set: acoustic foam, one bare bulb, a chair. The foam tint changes with the phase.
  const tints = { clue: ['#0b1322', '#0d1729'], whisper: ['#120d22', '#16102a'], job: ['#1a0f12', '#1f1216'], vote: ['#170c1c', '#1c0f22'], finale_choice: ['#0c1a17', '#0f201c'], cut_vote: ['#0c1a17', '#0f201c'] };
  const [f1c, f2c] = tints[tp] || tints.clue;
  let foam = ''; const tile = 90;
  for (let y = 0; y < H; y += tile) for (let x = 0; x < W; x += tile) { const k = ((x / tile + y / tile) % 2); foam += `<path d="M${x} ${y}h${tile}v${tile}h-${tile}z" fill="${k ? f1c : f2c}"/><path d="M${x + (k ? 0 : tile / 2)} ${y + (k ? tile / 2 : 0)}${k ? `h${tile}` : `v${tile}`}" stroke="#060b14" stroke-width="3"/>`; }
  const bulbY = L.wide ? 120 : 150;
  svgEl(cam, W, H, `<defs><radialGradient id="dlight" cx="${lx / W * 100}%" cy="${(L.wide ? 52 : 30)}%" r="${L.wide ? 42 : 46}%"><stop offset="0" stop-color="#3b4f73" stop-opacity=".95"/><stop offset=".55" stop-color="#1a2740" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="dcone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeaff" stop-opacity=".26"/><stop offset="1" stop-color="#dfeaff" stop-opacity="0"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="#03060c"/><g opacity=".9">${foam}</g><rect width="${W}" height="${H}" fill="url(#dlight)"/>
    <rect width="${W}" height="${H}" fill="#000" opacity=".25"/>
    <polygon points="${lx - 14},${bulbY + 20} ${lx + 14},${bulbY + 20} ${lx + (L.wide ? 520 : 470)},${H} ${lx - (L.wide ? 520 : 470)},${H}" fill="url(#dcone)"/>
    <path d="M${lx} 0V${bulbY}" stroke="#000" stroke-width="4"/><circle cx="${lx}" cy="${bulbY + 14}" r="40" fill="#fff4d6" opacity=".18"/><circle cx="${lx}" cy="${bulbY + 14}" r="16" fill="#fff8e8"/>`);
  const cw = L.wide ? 640 : 560, chx = lx - cw / 2, chy = L.wide ? 270 : 270;
  svgEl(cam, W, H, `<path d="M${lx - cw * 0.42} ${chy + cw * 1.1}V${chy + cw * 0.5}Q${lx - cw * 0.42} ${chy + cw * 0.18} ${lx} ${chy + cw * 0.16}Q${lx + cw * 0.42} ${chy + cw * 0.18} ${lx + cw * 0.42} ${chy + cw * 0.5}V${chy + cw * 1.1}Z" fill="#3a1f2a" stroke="#05030a" stroke-width="6"/><path d="M${lx - cw * 0.34} ${chy + cw * 0.5}Q${lx} ${chy + cw * 0.26} ${lx + cw * 0.34} ${chy + cw * 0.5}" fill="none" stroke="#5a3242" stroke-width="10"/>`);
  const me = person(cam, who, chx, chy, cw, { expr: 'thinking' });
  // viewfinder chrome
  const m = 34, bl = 70, top = L.wide ? 112 : 140;
  svgEl(root, W, H, [[m, top, 1, 1], [W - m, top, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].map(([x, y, sx, sy]) => `<path d="M${x} ${y + sy * bl}V${y}H${x + sx * bl}" fill="none" stroke="#dcefff" stroke-width="5" opacity=".8"/>`).join(''), 'pointer-events:none;');
  const rec = div(root, 'abs rec', L.wide ? 'left:64px;top:132px;' : 'left:64px;top:160px;', `<i></i>REC`);
  div(root, 'abs diarysign', L.wide ? 'left:880px;top:122px;' : 'left:0;right:0;top:220px;text-align:center;', 'DIARY ROOM');
  div(root, 'abs tc', L.wide ? 'right:70px;top:134px;' : 'right:64px;top:166px;', `${esc(DIARY_CTX[tp] || String(tp || '').toUpperCase())}${e.statement_id ? ' · ' + esc(e.statement_id) : ''} · R${esc(e.round)}`);
  // the private thought
  const tx = L.wide ? 880 : 40, ty = L.wide ? 180 : 920, tw = L.wide ? 980 : 1000, th = L.wide ? 560 : 560;
  const panel = box(root, tx, ty, tw, th, 'thought anim bx', null, `--ac:${acc(who)}`);
  panel.dataset.bx = 'thought';
  const mdl = modelOf(who);
  panel.innerHTML = `<div class="th-h"><span class="th-n">${nm(who)}</span>${mdl ? `<span class="th-m">${esc(mdl)}</span>` : ''}${roleChip(roleOf(who), L.wide ? 18 : 18)}<span class="th-k">PRIVATE · AUDIENCE ONLY</span></div>`;
  const tText = div(panel, 'th-t typed');
  const short = b.data && b.data.thought != null;
  const conf = short ? (b.data.thought + (b.data.thoughtCut ? ' …' : '')).trim() : (e.confessional || '').trim();
  // bottom row: top suspect (what the number means depends on the role), the action, the marks
  const rowY = L.wide ? 770 : 1510, rowH = L.wide ? 280 : 370;
  const ts = e._top_suspect;
  let pol = null, pctBox = null, pctNum = null, bar = null, sus = null, actEl = null;
  let x = tx;
  if (ts && ts.name) {
    const sw = L.wide ? 210 : 230;
    pol = box(root, x, rowY, sw, sw * 1.2, 'polaroid anim bx');
    pol.dataset.bx = 'polaroid';
    const polIn = div(pol, 'pol-in'); sus = mountChar(polIn, ts.name, { expr: 'suspicious' }); sus.el.style.inset = '0';
    pol.insertAdjacentHTML('beforeend', `<div class="pol-n" style="color:${shade(acc(ts.name), .55)}">${nm(ts.name)}</div>`);
    const read = ts.kind === 'table_read';
    const kLbl = read ? 'THE CREW\'S TOP SUSPECT' : 'TOP SUSPECT';
    const sub = read ? `${nm(who)} reads the crew as <b style="color:${acc(ts.name)}">${Math.round(Number(ts.pct) || 0)}%</b> sure about <b style="color:${acc(ts.name)}">${nm(ts.name)}</b>`
      : `${nm(who)} is <b style="color:${acc(ts.name)}">${Math.round(Number(ts.pct) || 0)}%</b> sure <b style="color:${acc(ts.name)}">${nm(ts.name)}</b> is a mole`;
    const pw2 = L.wide ? 270 : 300;
    pctBox = box(root, x + sw + 44, rowY + 6, pw2, rowH - 10, 'pct anim bx', `<div class="pct-k">${kLbl}</div><div class="pct-v"><span class="num">0</span>%</div><div class="pct-bar" style="width:${pw2 - 20}px"><i></i></div><div class="pct-n">${sub}</div>`);
    pctBox.dataset.bx = 'suspect';
    pctNum = pctBox.querySelector('.num'); bar = pctBox.querySelector('.pct-bar i');
    x += sw + 44 + pw2 + 24;
  }
  let actHtml = '';
  if (tp === 'clue') actHtml = act.whisper_with && act.whisper_with !== 'none' ? `ASKS TO WHISPER WITH<b style="color:${acc(act.whisper_with)}">${nm(act.whisper_with)}</b>` : (act.whisper_with === 'none' ? 'ASKS FOR<b>NO WHISPER</b>' : '');
  else if (tp === 'job') actHtml = `ON THE JOB, CHOOSES<b class="${act.choice === 'sabotage' ? 'sab' : 'help'}">${act.choice === 'sabotage' ? 'SABOTAGE' : 'HELP'}</b>`;
  else if (tp === 'cut_vote' && act.finalist) actHtml = `SENDS TO THE FINAL<b style="color:${acc(act.finalist)}">${nm(act.finalist)}</b>`;
  else if (tp === 'finale_choice' && act.choice) actHtml = `CHOOSES<b class="${act.choice === 'steal' ? 'sab' : 'help'}">${esc(String(act.choice).toUpperCase())}</b>`;
  else if (tp === 'vote' && act.vote) actHtml = `VOTED FOR<b style="color:${acc(act.vote)}">${nm(act.vote)}</b>`;
  const marks = (e._marks || []).filter(mk => mk[0] === 'lie' || mk[0] === 'card_fake' || mk[0] === 'job_false');
  const rightW = (tx + tw) - x;
  if (actHtml) {
    const aw = marks.length ? Math.min(rightW, L.wide ? 360 : 440) : rightW;
    actEl = box(root, x, rowY, aw, L.wide ? 110 : 120, 'actcard anim bx', actHtml, `--ac:${acc(who)}`);
    actEl.dataset.bx = 'action';
    const bEl = actEl.querySelector('b'); if (bEl) bEl.style.fontSize = (L.wide ? 38 : 40) + 'px';
  }
  let marksEl = null;
  if (marks.length) {
    let mx = x, my = rowY, mw = rightW, mh = rowH;
    if (actEl) { if (rightW - (L.wide ? 360 : 440) > 300) { mx = x + (L.wide ? 380 : 460); mw = rightW - (L.wide ? 380 : 460); } else { my = rowY + (L.wide ? 124 : 134); mh = rowH - (L.wide ? 124 : 134); } }
    if (mw < 320 && !ts) { mx = tx; mw = tw; }
    marksEl = box(root, mx, my, mw, mh, 'marks anim bx');
    marksEl.dataset.bx = 'marks';
    marks.slice(0, 4).forEach(mk => {
      const k = mk[0] === 'lie' ? 'LIE' : mk[0] === 'card_fake' ? 'FAKE CARD' : 'FALSE JOB CLAIM';
      const txt = mk[0] === 'card_fake' ? `"${mk[1]}"${mk[2] ? ' (' + mk[2] + ')' : ''}` : mk[1];
      div(marksEl, 'mark anim', '', `<b>${k}</b><span>${esc(txt)}</span>`);
    });
    if (!fitText(marksEl, L.wide ? 22 : 24, 13, 'marks')) ctx.over('diary marks');
  }
  const iris = box(root, 0, 0, W, H, 'iris', null, '');

  // ---- timeline
  tl.set(iris, { o: 1 }); tl.tw(iris, 0, 380, { o: [1, 0] }, 'lin');
  tl.set(cam, { s: 1.05 }); tl.tw(cam, 0, 900, { s: [1.05, 1] }, 'out');
  tl.effect(0, 600000, () => { rec.classList.toggle('dim', Math.floor(performance.now() / 700) % 2 === 1); }, 'motion');
  tl.set(panel, { o: 0 }); tl.tw(panel, 300, 160, { o: [0, 1] }, 'lin'); tl.tw(panel, 300, 380, { x: [L.wide ? 80 : 0, 0], y: [L.wide ? 0 : 60, 0] }, 'out5');
  exprAt(tl, 600, me.c, 'talk');
  const t0 = 700, cps = 34;
  let dur = 0;
  if (conf) {
    dur = tl.type(tText, t0, [{ text: conf }], { cps, char: me.c, pitch: 260 });
    if (!fitText(tText, short ? (L.wide ? 50 : 56) : (L.wide ? 38 : 44), L.wide ? 20 : 22, 'thought')) ctx.over('thought');
  } else { tText.classList.add('silent'); tText.classList.remove('typed'); tText.textContent = '(nothing)'; tText.style.fontSize = '36px'; }
  const tEnd = t0 + Math.min(dur, 6000) * .5 + 400;

  if (pol) {
    tl.set(pol, { o: 0, r: -5 }); tl.tw(pol, tEnd, 100, { o: [0, 1] }, 'lin'); tl.tw(pol, tEnd, 380, { y: [-120, 0], r: [-18, -5] }, 'back'); tl.cue(tEnd + 200, 'pop');
    fadeIn(tl, pctBox, tEnd + 250, 200); countUp(tl, pctNum, tEnd + 250, 500, 0, Math.round(Number(ts.pct) || 0));
    const p = Math.max(0, Math.min(100, Number(ts.pct) || 0)) / 100;

  }
  if (actEl) popIn(tl, actEl, tEnd + 400, 30, 300);

  tl.hold(Math.max(t0 + dur, tEnd + 900 + (marksEl ? marksEl.children.length * 360 : 0)) + 600);
  return tl;
};

/* ---------------------------------------------------------------- WHISPER ------- */
SCENES.whisper = ctx => {
  const { root, L, b, events } = ctx, e = b.ev, tl = new Timeline();
  const W = L.W, H = L.H, a = e.player, bb = e.partner || '?';
  // the pair's conversation this round so far, ending with this turn
  const lines = [];
  for (let i = 0; i <= b.i && i < events.length; i++) {
    const x = events[i];
    if (!x || x.type !== 'turn' || x.turn_phase !== 'whisper' || x.round !== e.round) continue;
    const pair = [x.player, x.partner];
    if (pair.includes(a) && pair.includes(bb)) lines.push(x);
  }
  const shown = lines.slice(-4);
  const left = shown.length ? shown[0].player : a, right = left === a ? bb : a;
  const cam = div(root, 'layer anim');
  const split = L.wide ? `0,0 ${W / 2 + 90},0 ${W / 2 - 90},${H} 0,${H}` : `0,0 ${W},0 ${W},560 0,700`;
  const split2 = L.wide ? `${W / 2 + 90},0 ${W},0 ${W},${H} ${W / 2 - 90},${H}` : `0,700 ${W},560 ${W},${H} 0,${H}`;
  svgEl(cam, W, H, `<defs><radialGradient id="wa" cx="${L.wide ? 20 : 25}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(left), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>
    <radialGradient id="wb" cx="${L.wide ? 80 : 75}%" cy="${L.wide ? 45 : 20}%" r="60%"><stop offset="0" stop-color="${shade(acc(right), .55)}"/><stop offset="1" stop-color="#050a16"/></radialGradient>

  const pw = L.wide ? 600 : 500, py = L.wide ? 330 : 300;

  const hd = div(root, 'abs whead anim', L.wide ? 'left:560px;right:560px;top:128px;' : 'left:0;right:0;top:170px;',
    `<div class="wh-k"><svg viewBox="0 0 24 24" width="1em" height="1em"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg> WHISPER · ROUND ${esc(e.round)}</div><div class="wh-n"><span style="color:${acc(left)}">${nm(left)}</span><em>↔</em><span style="color:${acc(right)}">${nm(right)}</span></div>`);

  if (!fitText(col, L.wide ? 29 : 34, 15, 'whisper')) ctx.over('whisper');
  const foot = div(root, 'abs wfoot', 'left:0;right:0;bottom:30px;', `AUDIENCE ONLY · the table sees <b>${nm(left)}</b> and <b>${nm(right)}</b> whispering, never the words`);
  // ---- timeline
  slideIn(tl, pa.wrap, 0, -300, 0, 420, 'out5'); slideIn(tl, pb.wrap, 60, 300, 0, 420, 'out5');
  tl.tw(pa.wrap, 420, 500, { r: [0, 2.5] }, 'inout'); tl.tw(pb.wrap, 480, 500, { r: [0, -2.5] }, 'inout');

/* ---------------------------------------------------------------- WHISPER PAIRS -- */
SCENES.pairs = ctx => {
  const { root, L, b, aud } = ctx, tl = new Timeline(), pairs = (b.data.pairs || []).slice(0, 4), w = b.w;
  const W = L.W, H = L.H, k = pairs.length;

  svgEl(cam, W, H, roomSVG(L, { lamp: false, decor: 'none', wallHi: '#161c46', wall: '#080c22' }));
  const hd = anchor(root, W / 2, L.wide ? 170 : 210, `<div class="whead"><div class="wh-k">WHISPERS · ROUND ${esc(w.round)}</div><div class="wh-n" style="font-size:${L.wide ? 58 : 54}px">${plural(k, 'PAIR')} WHISPER</div></div>`, 'anim');
  const top = L.wide ? 250 : 300, bottom = L.wide ? 990 : 1820, gap = L.wide ? 30 : 24;
  const panels = pairs.map((p, i) => {
    let x, y, pwid, phei;
    if (L.wide) { pwid = Math.min(900, (W - 80 - (k - 1) * gap) / k); phei = bottom - top; x = (W - (k * pwid + (k - 1) * gap)) / 2 + i * (pwid + gap); y = top; }
    else { pwid = W - 80; phei = Math.min(700, (bottom - top - (k - 1) * gap) / k); x = 40; y = top + ((bottom - top) - (k * phei + (k - 1) * gap)) / 2 + i * (phei + gap); }
    const pan = box(root, x, y, pwid, phei, 'wpanel anim bx');

    const A = person(pan, p[0], pwid / 2 - cwid * .86, yy, cwid, { expr: 'talk' });
    const B2 = person(pan, p[1], pwid / 2 - cwid * .14, yy, cwid, { expr: 'thinking', flip: true });
    const lbl = div(pan, 'wp-n', `font-size:${Math.min(34, cwid / 6.5)}px`, `<span style="color:${acc(p[0])}">${nm(p[0])}</span><em>↔</em><span style="color:${acc(p[1])}">${nm(p[1])}</span>`);
    const dots = anchor(pan, pwid / 2, Math.max(36, yy + cwid * .08), `<div class="wp-b"><span class="wdots"><i></i><i></i><i></i></span></div>`, 'anim');
    return { pan, A, B: B2, dots, lbl };

  const foot = div(root, 'abs wfoot', 'left:0;right:0;bottom:' + (L.wide ? 34 : 40) + 'px;', aud ? 'The table sees who whispers, never what. The audience hears every word next.' : 'TABLE VIEW · you see who whispers, never what');
  fadeIn(tl, hd, 100, 250);

    popIn(tl, P.pan, 200 + i * 200, 40, 360);
    tl.tw(P.A.wrap, 700 + i * 200, 500, { r: [0, 3] }, 'inout'); tl.tw(P.B.wrap, 700 + i * 200, 500, { r: [0, -3] }, 'inout');
    popIn(tl, P.dots, 900 + i * 200, 10, 260); tl.cue(900 + i * 200, 'pop');
    tl.effect(900 + i * 200, 4000, q => P.A.c.mouth(q >= 1 ? 'rest' : ['b', 'a', 'c', 'a'][Math.floor(q * 40) % 4]), 'motion');
  });
  fadeIn(tl, foot, 900, 300);
  tl.hold(1200 + k * 200 + 800);
  return tl;

/* ---------------------------------------------------------------- JOB REVEAL ---- */
SCENES.job = ctx => {
  const { root, L, b, w, aud } = ctx, d = b.data, tl = new Timeline();
  const W = L.W, H = L.H;
  const cam = div(root, 'layer anim');
  svgEl(cam, W, H, roomSVG(L, Object.assign({ floorY: L.wide ? 640 : 900 }, ROOMS.jobreveal)));
  const team = (d.team || []).slice(0, 4), n = team.length || 1;
  const leader = w.leader;
  const title = anchor(root, W / 2, L.wide ? 168 : 250, `<div class="jobtitle"><div class="jt-k">ROUND ${esc(w.round)} · THE JOB</div><div class="jt-n" style="font-size:${L.wide ? 76 : 66}px">${esc(w.jobName || 'The job')}</div><div class="jt-l">LEADER <b style="color:${acc(leader)}">${nm(leader)}</b> · TEAM OF ${team.length}</div></div>`, 'anim');

    plate.firstChild.firstChild.classList.add('bx'); plate.firstChild.firstChild.dataset.bx = 'plate ' + name;
    plate.firstChild.style.transform = 'translate(-50%, 0)';
    const choice = cardsShown ? d.choices[name] : null;
    const cw = L.wide ? 210 : 230, ch = L.wide ? 230 : 290, cy = L.wide ? 760 : 1010;
    let card = null;
    if (cardsShown) {
      const front = choice === 'sabotage'
        ? `<div class="cardface sab"><svg viewBox="0 0 100 100" width="50%"><path d="M10 30h30l10 14 10-14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M10 70h30l10-14 10 14h30" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg><div>SABOTAGE</div></div>`
        : `<div class="cardface help"><svg viewBox="0 0 100 100" width="46%"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="8"/><path d="M28 52l15 15 30-32" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div>HELP</div></div>`;
      card = flipCard(root, x - cw / 2, cy, cw, ch, CARD_BACK, front);
    }
    return Object.assign(p, { name, x, plate, card, choice });
  });
  // table view: one card with the count, the only thing the table learns
  let countCard = null;
  if (!cardsShown) {
    const cw = L.wide ? 300 : 320, ch = L.wide ? 230 : 280;
    countCard = flipCard(root, W / 2 - cw / 2, L.wide ? 760 : 1010, cw, ch, CARD_BACK, `<div class="cardface count"><small>SABOTAGES</small><div class="cf-big">${esc(d.sabotages)}</div></div>`);
  }
  // alarm: two light beams as composited layers turned by transform (no repaint per frame), a red tint faded by opacity
  const alarm = div(root, 'layer anim', 'pointer-events:none;');
  const beam = (left) => box(alarm, left ? 0 : W - W * 1.6, -260, W * 1.6, 520, 'anim', null,
    `transform-origin:${left ? '0' : '100%'} 50%;clip-path:polygon(${left ? '0 50%,100% 0,100% 100%' : '100% 50%,0 0,0 100%'});background:radial-gradient(ellipse at ${left ? '0%' : '100%'} 50%, rgba(255,90,42,.45), rgba(255,90,42,0) 70%);`);
  const bA = beam(true), bB = beam(false);
  alarm.style.opacity = '0';
  const red = box(root, 0, 0, W, H, 'alarmtint anim', null, 'opacity:0;');
  const flash = box(root, 0, 0, W, H, 'flash anim', null, 'background:#fff;opacity:0;');
  const verdict = anchor(root, W / 2, L.wide ? 170 : 250, `<div class="stamp ${d.blown ? 'amber' : 'mint'} big" style="font-size:${L.wide ? 150 : 130}px;transform:rotate(-6deg)">JOB ${d.blown ? 'BLOWN' : 'CLEAN'}</div>`, 'anim');
  const sub = anchor(root, W / 2, L.wide ? 1036 : 1360, `<div class="verdict-sub ${d.blown ? 'a' : 'm'}" style="font-size:${L.wide ? 24 : 28}px">${d.blown ? `${plural(d.sabotages, 'SABOTAGE')} · BLOWN ${w.blown}/${w.sabTarget || '?'}` : `NO SABOTAGE · CLEAN ${w.clean}/${w.cleanTarget || '?'}`}</div>`, 'anim');
  let score = null;
  if (!L.wide) score = jobBoard(root, 90, 1440, 900, 400, w);

  // ---- timeline
  slamIn(tl, title, 0, 1.5, 200); tl.cue(60, 'thud');
  people.forEach((p, i) => {
    tl.set(p.wrap, { o: 0 }); tl.tw(p.wrap, 220 + i * 140, 100, { o: [0, 1] }, 'lin'); tl.tw(p.wrap, 220 + i * 140, 420, { y: [260, 0] }, 'out5');
    slideIn(tl, p.plate, 420 + i * 140, 0, 30, 300, 'back');
    if (p.card) { tl.set(p.card.flipper, { ry: 180 }); tl.set(p.card.wrap, { o: 0 }); tl.tw(p.card.wrap, 650 + i * 120, 80, { o: [0, 1] }, 'lin'); tl.tw(p.card.wrap, 650 + i * 120, 380, { y: [420, 0], r: [-20 + i * 14, 0] }, 'out5'); tl.cue(650 + i * 120, 'whoosh'); }
  });
  if (countCard) { tl.set(countCard.flipper, { ry: 180 }); slideIn(tl, countCard.wrap, 700, 0, 400, 380, 'out5'); tl.cue(700, 'whoosh'); }
  let t = 1700;
  if (cardsShown) {

      if (p.choice === 'sabotage') { tl.cue(t + 200, 'thud'); shakeFx(tl, cam, t + 220, 200, 8); }
      t += 680;
    });
  } else { t += 400; tl.tw(countCard.flipper, t, 380, { ry: [180, 0] }, 'out'); tl.tw(countCard.wrap, t, 380, { s: [1, 1.08] }, 'back'); tl.cue(t, 'flip'); t += 700; }
  t += 420;
  tl.tw(title, t - 120, 160, { o: [1, 0], s: [1, .9] }, 'lin');
  slamIn(tl, verdict, t, 3, 180); tl.cue(t + 130, 'thud');
  slideIn(tl, sub, t + 450, 0, 40, 300, 'back');
  if (d.blown) {
    tl.cue(t + 160, 'alarm'); shakeFx(tl, cam, t + 160, 460, 20); flashFx(tl, flash, t + 160, 260, .35);
    tl.set(alarm, { o: 0 }); tl.tw(alarm, t + 160, 200, { o: [0, 1] }, 'lin');
    tl.effect(t + 160, 3000, p => { const a = Math.sin(p * Math.PI * 3) * 38 + 30; bA.style.transform = `rotate(${a.toFixed(1)}deg)`; bB.style.transform = `rotate(${(-a).toFixed(1)}deg)`; }, 'motion');
    tl.effect(t + 160, 3000, p => { red.style.opacity = (p >= 1 ? 0.1 : (0.1 + 0.14 * Math.max(0, Math.sin(p * Math.PI * 3)))).toFixed(3); }, 'flash');

  if (score) {
